version = 1
name = "babylon"

[setup]
script = ""

[setup.linux]
script = '''
set -euo pipefail

if [ -z "${CODEX_SOURCE_TREE_PATH:-}" ]; then
  echo "CODEX_SOURCE_TREE_PATH is not set" >&2
  exit 1
fi
if [ -z "${CODEX_WORKTREE_PATH:-}" ]; then
  echo "CODEX_WORKTREE_PATH is not set" >&2
  exit 1
fi
if [ "$PWD" != "$CODEX_WORKTREE_PATH" ]; then
  echo "setup must run from CODEX_WORKTREE_PATH ($CODEX_WORKTREE_PATH), got $PWD" >&2
  exit 1
fi
for cargo_environment in CARGO_TARGET_DIR CARGO_BUILD_TARGET_DIR CARGO_BUILD_BUILD_DIR; do
  eval "cargo_environment_is_set=\${$cargo_environment+x}"
  if [ "$cargo_environment_is_set" = x ]; then
    echo "$cargo_environment must be unset; each worktree owns its Cargo state" >&2
    exit 1
  fi
done
if ! command -v python3 >/dev/null 2>&1 || ! python3 -c 'import tomllib' >/dev/null 2>&1; then
  echo "Python 3.11 or newer is required to inspect Cargo configuration" >&2
  exit 1
fi

python3 - "$CODEX_WORKTREE_PATH" <<'PY'
import os
import sys
import tomllib
from pathlib import Path
from typing import Any

MAX_ANCESTORS = 128
MAX_CONFIG_FILES = 512
MAX_INCLUDES_PER_FILE = 128
EXPECTED_TOOLCHAIN = "1.91.1"


def add_active_config(configs: list[Path], cargo_dir: Path) -> None:
    legacy = cargo_dir / "config"
    modern = cargo_dir / "config.toml"
    configs.append(legacy if legacy.exists() else modern)


def initial_configs(workspace: Path) -> list[Path]:
    configs: list[Path] = []
    current = workspace
    reached_root = False
    for _ in range(MAX_ANCESTORS):
        add_active_config(configs, current / ".cargo")
        parent = current.parent
        if parent == current:
            reached_root = True
            break
        current = parent
    if not reached_root:
        raise SystemExit("Cargo config ancestry exceeds the setup bound")

    cargo_home_value = os.environ.get("CARGO_HOME")
    cargo_home = Path(cargo_home_value) if cargo_home_value else Path.home() / ".cargo"
    if not cargo_home.is_absolute():
        cargo_home = workspace / cargo_home
    add_active_config(configs, cargo_home)
    return configs


def load_config(path: Path) -> dict[str, Any]:
    try:
        with path.open("rb") as stream:
            value = tomllib.load(stream)
    except OSError as error:
        raise SystemExit(f"cannot read Cargo config {path}: {error}") from error
    except tomllib.TOMLDecodeError as error:
        raise SystemExit(f"cannot parse Cargo config {path}: {error}") from error
    return value


def add_includes(configs: list[Path], path: Path, value: dict[str, Any]) -> None:
    includes = value.get("include", [])
    if not isinstance(includes, list):
        raise SystemExit(f"Cargo config {path} has a non-list include value")
    if len(includes) > MAX_INCLUDES_PER_FILE:
        raise SystemExit(f"Cargo config {path} exceeds the include bound")
    for index in range(MAX_INCLUDES_PER_FILE):
        if index >= len(includes):
            break
        entry = includes[index]
        optional = False
        if isinstance(entry, str):
            include_value = entry
        elif isinstance(entry, dict):
            include_value = entry.get("path")
            optional = entry.get("optional", False)
            if not isinstance(include_value, str) or not isinstance(optional, bool):
                raise SystemExit(f"Cargo config {path} has an invalid include table")
        else:
            raise SystemExit(f"Cargo config {path} has an invalid include entry")
        include_path = Path(include_value)
        if not include_path.is_absolute():
            include_path = path.parent / include_path
        include_path = include_path.resolve()
        if include_path.exists():
            configs.append(include_path)
        elif not optional:
            raise SystemExit(f"Cargo config {path} requires missing include {include_path}")


worktree = Path(sys.argv[1]).resolve()
workspace = worktree / "rust"
toolchain_path = workspace / "rust-toolchain.toml"
toolchain = load_config(toolchain_path).get("toolchain", {})
if not isinstance(toolchain, dict) or toolchain.get("channel") != EXPECTED_TOOLCHAIN:
    raise SystemExit(
        f"{toolchain_path} must pin Rust {EXPECTED_TOOLCHAIN}, got {toolchain!r}"
    )

configs = initial_configs(workspace)
seen: set[Path] = set()
for index in range(MAX_CONFIG_FILES):
    if index >= len(configs):
        break
    config_path = configs[index].resolve()
    if config_path in seen or not config_path.exists():
        continue
    seen.add(config_path)
    config = load_config(config_path)
    build = config.get("build", {})
    if not isinstance(build, dict):
        raise SystemExit(f"Cargo config {config_path} has an invalid build table")
    for forbidden in ("target-dir", "build-dir", "rustc-wrapper", "rustc-workspace-wrapper"):
        if forbidden in build:
            raise SystemExit(
                f"Cargo config {config_path} sets build.{forbidden}; "
                "the repository dispatcher owns that boundary"
            )
    configured_environment = config.get("env", {})
    if not isinstance(configured_environment, dict):
        raise SystemExit(f"Cargo config {config_path} has an invalid env table")
    for cache_key in (
        "SCCACHE_DIR",
        "SCCACHE_SERVER_UDS",
        "SCCACHE_CACHE_SIZE",
        "SCCACHE_CLIENT_SIDE",
    ):
        if cache_key in configured_environment:
            raise SystemExit(
                f"Cargo config {config_path} sets env.{cache_key}; "
                "the repository dispatcher owns the compiler-cache boundary"
            )
    add_includes(configs, config_path, config)
else:
    raise SystemExit("Cargo config include graph exceeds the setup bound")
if len(configs) > MAX_CONFIG_FILES:
    raise SystemExit("Cargo config include graph exceeds the setup bound")
PY

python3 "$CODEX_WORKTREE_PATH/.codex/host/cargo-config.py" "$CODEX_WORKTREE_PATH/rust"

# Two measured 15 GiB worktree targets plus the bounded 10 GiB compiler cache.
minimum_free_kib=41943040
available_kib="$(df -Pk "$CODEX_WORKTREE_PATH" | awk 'NR == 2 { print $4 }')"
case "$available_kib" in
  ''|*[!0-9]*)
    echo "could not read free space for $CODEX_WORKTREE_PATH" >&2
    exit 1
    ;;
esac
if [ "$available_kib" -lt "$minimum_free_kib" ]; then
  echo "Codex worktrees require 40 GiB free; $CODEX_WORKTREE_PATH has $((available_kib / 1048576)) GiB" >&2
  exit 1
fi

lfs_cache="/tmp/babylon-codex-lfs-$(id -u)"
install -d -m 700 "$lfs_cache"
git config extensions.worktreeConfig true
git config --worktree lfs.storage "$lfs_cache"

if [ ! -e data ] && [ ! -L data ]; then
  if [ ! -f "$CODEX_SOURCE_TREE_PATH/data/sqlite/marxist-data-3NF.sqlite" ]; then
    echo "Babylon reference data is missing from $CODEX_SOURCE_TREE_PATH/data" >&2
    exit 1
  fi
  cp -a "$CODEX_SOURCE_TREE_PATH/data" .
fi
if [ ! -e .env ] && [ ! -L .env ]; then
  install -m 600 .env.example .env
fi

rustup toolchain install 1.91.1 --profile minimal --component clippy --component rustfmt

. "$CODEX_WORKTREE_PATH/.codex/host/policy.sh"
codex_tools_root="$(codex_rust_tools_root)"
codex_cache_root="$(codex_rust_cache_root)"
codex_rust_data_root="${XDG_DATA_HOME:-$HOME/.local/share}"
codex_rust_dispatcher_bin="$codex_rust_data_root/codex-rust-host/bin"
codex_rust_cargo_home="${CARGO_HOME:-$HOME/.cargo}"
# The first install creates this dedicated Cargo-only shim. Put its future
# location first now so install.sh verifies it instead of rustup's Cargo proxy,
# and so the following sccache bootstrap enters the governed dispatcher.
export PATH="$codex_rust_dispatcher_bin:$codex_rust_cargo_home/bin:$PATH"
mkdir -p "$codex_tools_root" "$codex_cache_root"
cache_available_kib="$(df -Pk "$codex_cache_root" | awk 'NR == 2 { print $4 }')"
case "$cache_available_kib" in
  ''|*[!0-9]*)
    echo "could not read free space for $codex_cache_root" >&2
    exit 1
    ;;
esac
if [ "$cache_available_kib" -lt 10485760 ]; then
  echo "the sccache filesystem requires 10 GiB free; $codex_cache_root has $((cache_available_kib / 1048576)) GiB" >&2
  exit 1
fi

CODEX_RUST_CACHE_ROOT="$codex_cache_root" "$CODEX_WORKTREE_PATH/.codex/host/install.sh"
hash -r

sccache_cache_dir="$(codex_rust_cache_dir babylon "$codex_cache_root")"
sccache_server_socket="$(codex_rust_server_socket babylon "$codex_cache_root")"
mkdir -p "$sccache_cache_dir" "$(dirname "$sccache_server_socket")"
python3 - "$sccache_server_socket" <<'PY'
import os
import sys

if len(os.fsencode(sys.argv[1])) >= 108:
    raise SystemExit(f"sccache Unix socket path is too long: {sys.argv[1]}")
PY
sccache_version_root="$codex_tools_root/sccache/$CODEX_RUST_SCCACHE_VERSION"
if [ -x "$sccache_version_root/sccache" ] && [ "$("$sccache_version_root/sccache" --version)" = "sccache $CODEX_RUST_SCCACHE_VERSION" ]; then
  sccache_bin="$sccache_version_root/sccache"
elif [ -x "$sccache_version_root/bin/sccache" ] && [ "$("$sccache_version_root/bin/sccache" --version)" = "sccache $CODEX_RUST_SCCACHE_VERSION" ]; then
  sccache_bin="$sccache_version_root/bin/sccache"
else
  mkdir -p "$sccache_version_root"
  CODEX_RUST_SCCACHE_BOOTSTRAP=1 env \
    -u CARGO_BUILD_RUSTC_WRAPPER \
    -u CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER \
    RUSTC_WRAPPER= \
    RUSTC_WORKSPACE_WRAPPER= \
    cargo +1.91.1 install --locked --force --version "=$CODEX_RUST_SCCACHE_VERSION" \
      --root "$sccache_version_root" sccache
  sccache_bin="$sccache_version_root/bin/sccache"
fi
if [ ! -x "$sccache_bin" ] || [ "$("$sccache_bin" --version)" != "sccache $CODEX_RUST_SCCACHE_VERSION" ]; then
  echo "sccache $CODEX_RUST_SCCACHE_VERSION is not available at $sccache_bin" >&2
  exit 1
fi
CODEX_RUST_CACHE_ROOT="$codex_cache_root" "$CODEX_WORKTREE_PATH/.codex/host/install.sh" --check

mise trust --yes
mise install
mise run install
git lfs pull --include='reports/sim-trace-baseline-200.csv,src/babylon/reference/data/michigan_bea_ea.csv,tests/baselines/michigan-e2e.json'
mise run check:worktree-contract

target_directory="$(
  cd "$CODEX_WORKTREE_PATH/rust"
  cargo metadata --locked --no-deps --format-version 1 |
    python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])'
)"
if [ "$target_directory" != "$CODEX_WORKTREE_PATH/rust/target" ]; then
  echo "Cargo target must be $CODEX_WORKTREE_PATH/rust/target, got $target_directory" >&2
  exit 1
fi

git status --short --branch
'''

