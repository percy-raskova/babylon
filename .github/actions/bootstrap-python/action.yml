# Shared Python bootstrap (Program 15). ONE provisioner: mise installs the
# exact [tools] pins from .mise.toml (python 3.12 + uv), so CI and local dev
# run the identical toolchain against the single uv.lock. The venv cache key
# hashes uv.lock AND .mise.toml (the uv pin lives there); bump -vN to evict.
name: Bootstrap Python
description: mise toolchain + uv-managed venv cache + uv sync

inputs:
  gdal:
    description: >-
      Install GeoDjango system libraries (GEOS/GDAL/PROJ) — needed by anything
      importing Django settings, including mypy (django-stubs plugin loads
      settings at startup)
    required: false
    default: "false"
  docs:
    description: Install the docs dependency group
    required: false
    default: "false"
  server:
    description: >-
      Install the `server` optional-dependencies extra (Django/DRF/gunicorn +
      ansible/rst/boto). Required by any job that runs pytest or mypy, since
      DJANGO_SETTINGS_MODULE + django-stubs load Django at import.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up tools with mise
      uses: jdx/mise-action@v4
      with:
        cache: true

    # M7 packaging flip (BD-5 / ADR150 Task 44): babylon-tui is a default
    # [project] dependency built from the in-tree rust/ path source, so every
    # `uv sync` needs cargo + rustc. rust-toolchain.toml pins the channel;
    # rustup honors it when cargo runs inside rust/, this step just installs
    # it explicitly (minimal profile — rustfmt/clippy live in the rust-gate
    # job, not here).
    - name: Install Rust toolchain (wheel build)
      shell: bash
      run: |
        CHANNEL="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
        rustup toolchain install "$CHANNEL" --profile minimal --no-self-update

    # Cargo registry + git-dep checkouts (hypergraph-rs) + the workspace
    # target dir — makes the maturin build incremental (R6 "wheel caching").
    - name: Load cargo caches (wheel build)
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          rust/target
        key: cargo-${{ runner.os }}-v1-${{ hashFiles('rust/Cargo.lock') }}

    # The venv cache key hashes the rust/ crate sources too: uv's directory
    # -source invalidation does NOT watch .rs files (the documented "uv does
    # not recompile on Rust edits" behavior), so a restored .venv could carry
    # a wheel stale against this PR's Rust source unless the key evicts it.
    - name: Load cached venv
      id: venv-cache
      uses: actions/cache@v6
      with:
        path: .venv
        key: >-
          venv-${{ runner.os }}-py3.12-uv-v2-${{ inputs.docs }}-${{ inputs.server }}-${{
          hashFiles('uv.lock', '.mise.toml', 'rust/Cargo.lock', 'rust/pyproject.toml',
          'rust/crates/**', 'rust/python/**') }}

    - name: Sync dependencies (uv)
      shell: bash
      run: |
        EXTRA=""
        GROUP=""
        if [ "${{ inputs.server }}" = "true" ]; then EXTRA="--extra server"; fi
        if [ "${{ inputs.docs }}" = "true" ]; then GROUP="--group docs"; fi
        uv sync --frozen $EXTRA $GROUP

    # GeoDjango: settings/base.py uses the postgis backend, which loads
    # GEOS/GDAL/PROJ at import — pytest touching Django settings AND mypy
    # (django-stubs plugin) die with ImproperlyConfigured without these.
    - name: Install GeoDjango system libraries
      if: inputs.gdal == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils libproj-dev gdal-bin
