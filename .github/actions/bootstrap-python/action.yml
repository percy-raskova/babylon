# Shared Python bootstrap (Program 15). ONE provisioner: mise installs the
# exact [tools] pins from .mise.toml (python 3.12 + uv), so CI and local dev
# run the identical toolchain against the single uv.lock. The venv cache key
# hashes uv.lock, .mise.toml, and mise.lock (the exact interpreter build).
name: Bootstrap Python
description: mise toolchain + uv-managed venv cache + uv sync

inputs:
  docs:
    description: Install the docs dependency group
    required: false
    default: "false"
  ops:
    description: Install the operator-only Ansible/RST/Boto dependency extra
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up tools with mise
      uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      with:
        version: 2026.9.1
        cache: true
        install_args: --locked

    # Amendment AF (ADR186) deletion ceremony: the babylon-tui maturin wheel
    # (ADR181 R8's "once per head" build-wheel job + this action's former
    # wheel-dir injection mode) is gone — `uv sync` needs no cargo/rustc, so
    # the venv cache key needs no rust/ hashes either.
    - name: Load cached venv
      id: venv-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .venv
        key: >-
          venv-${{ runner.os }}-py3.12-uv-v4-${{ inputs.docs }}-${{ inputs.ops }}-${{
          hashFiles('uv.lock', '.mise.toml', 'mise.lock') }}

    - name: Sync dependencies (uv)
      shell: bash
      run: |
        EXTRA=""
        GROUP=""
        if [ "${{ inputs.ops }}" = "true" ]; then EXTRA="--extra ops"; fi
        if [ "${{ inputs.docs }}" = "true" ]; then GROUP="--group docs"; fi
        uv sync --frozen $EXTRA $GROUP
