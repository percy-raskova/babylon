# Dependabot configuration for Babylon
# Docs: https://docs.github.com/en/code-security/dependabot
#
# Branch model (Program 15, Phase 3): `dev` is the default branch, so
# Dependabot opens every PR against `dev`. Omitting `target-branch` is
# deliberate: GitHub then applies this configuration to security updates too.
# The required-checks ruleset and `.github/workflows/dependabot-automerge.yml`
# allow only exact-head, fully verified merges.
# `main` never receives a Dependabot PR directly. A Director-authorized release PR
# from `dev` carries these changes through the main qualification manifest.
#
# CONFIG-AUTHORITY INVARIANT (2026-07-12): Dependabot reads THIS FILE — every
# group and every `ignore` below — from the repository's DEFAULT
# branch ONLY. The default branch is now `dev` (changed from `main` on
# 2026-07-12) precisely so rule/ignore edits take effect the moment they land
# on `dev`, with no main release PR required. If the default branch is ever
# moved back to `main`, edits here go INERT until a configuration PR reaches
# `main`. Keep the default branch equal to the branch where this file changes.

version: 2
updates:
  # ==========================================================================
  # Python dependencies (uv)
  # ==========================================================================
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      # Dependabot rejects YAML aliases; the policy test keeps all four copies equal.
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    # Cooldown (PER-264): fresh releases batch instead of trickling in as
    # singleton PRs, and majors get a week of upstream bake time before a
    # candidate even opens. Docker stays uncooled: monthly is already slow.
    cooldown:
      default-days: 3
      semver-major-days: 7
    rebase-strategy: "auto"
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "python"
    groups:
      # Group all minor/patch updates into a single PR (reduces noise)
      uv-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Security updates get their own group (higher priority)
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Hold the mypy major for its dedicated modernization batch.
    ignore:
      - dependency-name: "mypy"
        update-types: ["version-update:semver-major"]

  # ==========================================================================
  # GitHub Actions
  # Run a day after the Python batch so each ecosystem gets its own CI queue.
  # ==========================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    rebase-strategy: "auto"
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "ci"
    groups:
      # Major action updates remain individual manual-review PRs.
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ==========================================================================
  # Postgres base image (Docker) — monthly: base-image bumps are deliberate,
  # engine-adjacent events (see the Phase-3 postgis bump protocol).
  # ==========================================================================
  - package-ecosystem: "docker"
    directory: "/docker/postgres"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "docker"
    # PG-major bumps (16 -> 17, alpine, etc.) are OWNER ITEM 45: a Postgres/
    # PostGIS major can alter geometry float behavior under the byte-identical
    # determinism bundle and needs the full Rust adopter protocol on the new
    # image plus its upgrade path and testcontainers lockstep. Not a casual PR.
    ignore:
      - dependency-name: "postgis/postgis"
        update-types: ["version-update:semver-major"]

  # ==========================================================================
  # Rust workspace (cargo) — ADR181 R6: 355 locked crates previously had no
  # proactive update PRs while the FROZEN Python stack got weekly bumps. The
  # git-dep (hypergraph-rs) is invisible to Dependabot by construction — its
  # rev-bump protocol is manual and deliberate (rust/deny.toml [sources]).
  # Thursday avoids both the Monday/Tuesday dependency batches and Wednesday's
  # scheduled deep-validation workflows.
  # ==========================================================================
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    rebase-strategy: "auto"
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    groups:
      rust-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      rust-security:
        applies-to: security-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
