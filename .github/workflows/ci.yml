name: CI

# Program 15 (The Gauntlet): the DEV FAST LANE.
#
# Tier model: push to dev = fast iteration with sanity checks (~8-10 min wall);
# push to main = the full pipeline (main.yml); deep/slow legs run on a schedule
# (per-leg nightly workflows). PRs to either branch get this fast lane only —
# main.yml's pull_request trigger was deleted (R7, ADR181: identical check
# names with admitted drift made required contexts ambiguous).
#
# House rules (Constitution III.11 — Loud Failure):
#   - every job carries timeout-minutes (a hang must die loudly, not run 56min);
#   - no continue-on-error except jobs explicitly named "(advisory)";
#   - steps invoke the same mise tasks devs run locally — one invocation
#     source of truth (the bootstrap composite pins the identical toolchain).

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # ADR181 R2c: post-merge dev runs are NEVER cancelled — 22% were dying
  # mid-flight (merges land faster than the wall), leaving 1 in 5 merged
  # states unvalidated; a COMPLETED post-merge run is the layer that caught
  # #392. PR runs still cancel on force-push (superseded head = dead work).
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  fast-gate:
    name: Fast Gate (hygiene, lint, format, imports, types, lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/bootstrap-python

      # Incremental mypy state. Key ends in the commit SHA so every run saves
      # a fresh snapshot; restore-keys fall back to the newest same-lock cache.
      # Speed only — mypy's verdict is identical warm or cold.
      - name: Cache mypy incremental state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-py3.12-${{ hashFiles('uv.lock') }}-

      - name: Repo hygiene gate
        run: mise run check:hygiene

      - name: bevy/dynamic_linking fence (R1.4 — local-iteration-only, never in CI)
        run: mise run check:dynamic-linking-fence

      - name: Sentinel family (static gates — VIII.12; catalog DB-probe runs in nightly refdata)
        run: mise run check:sentinels-static

      - name: Public-surface baseline gate (__all__ vs pinned baseline)
        run: mise run check:surface

      - name: Lint (ruff check)
        run: mise run lint:check

      - name: Format (ruff format --check — blocking)
        run: mise run format:check

      - name: Import-boundary contracts
        run: mise run lint:imports

      - name: Type check (mypy strict)
        run: mise run typecheck

      - name: uv lock consistency
        run: mise run check:lock

  # M7 packaging flip (BD-5 / ADR150 Task 44): the in-tree rust/ client
  # workspace gets the same CI-parity gate devs run locally. Single job, all
  # cargo legs sequential inside `mise run ci:rust` (one target-dir lock —
  # parallel legs only contend; machine-safety doctrine).
  rust-gate:
    name: Rust Gate (fmt, clippy, test, doc — rust/ workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 (full history + tags, matching ci.yml's own pattern at
      # ceremony-gate/gitleaks below): check:bsl-sentinels' citation-drift
      # check resolves `.py` citations via `git show p27-python-freeze:<path>`
      # (Amendment AE) — a default shallow/no-tags checkout wouldn't have that
      # tag ref at all, aborting the whole ci:rust leg (task-w1-review.md C1).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Bevy's Linux windowing/audio stack (babylon-client, Amendment AF)
      # compiles against system Wayland/X11/ALSA/udev headers — the wayland-sys
      # build script hard-fails without pkg-config entries for them. These are
      # the four packages Bevy's own Linux CI installs; compile-time only, no
      # display server needed (tests run headless).
      - name: Install Bevy system dependencies (compile-time headers)
        run: >-
          tools/install_ci_apt_packages.sh
          libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Set up tools with mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.8.12
          cache: true

      - name: Install Rust toolchain (with rustfmt + clippy)
        run: |
          CHANNEL="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$CHANNEL" --profile minimal \
            --component rustfmt --component clippy --no-self-update

      - name: Install Rust test reporter
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest@0.9.143
          fallback: none

      # Restore is intentionally separate from save. Pull requests can consume
      # the newest compatible dev cache but cannot publish build output. The
      # source hash prevents a lock/toolchain-only exact hit from going stale.
      - name: Restore cargo cache
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target/.rustc_info.json
            rust/target/debug/.cargo-lock
            rust/target/debug/.fingerprint
            rust/target/debug/build
            rust/target/debug/*.d
            rust/target/debug/deps/*.d
            rust/target/debug/deps/*.rlib
            rust/target/debug/deps/*.rmeta
            rust/target/debug/deps/*.so
            rust/target/debug/deps/*.a
            rust/target/debug/examples/*.d
            rust/target/debug/examples/*.rlib
            rust/target/debug/examples/*.rmeta
            rust/target/debug/examples/*.so
            rust/target/debug/examples/*.a
            rust/target/doc
          key: >-
            cargo-gate-${{ runner.os }}-v4-${{
            hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-${{
            hashFiles('rust/**/*.rs', 'rust/**/Cargo.toml', '.mise.toml',
            '.github/workflows/ci.yml') }}
          restore-keys: |
            cargo-gate-${{ runner.os }}-v4-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}-

      - name: Rust full gate (canonical ci:rust task)
        run: mise run ci:rust

      - name: Upload Rust test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-test-results-${{ github.sha }}
          path: reports/test-results/rust/
          retention-days: 14
          if-no-files-found: error

      # ADR181 R6: supply-chain gate for the engine language — advisories,
      # bans, licenses, and a [sources] allowlist covering the rev-pinned
      # hypergraph-rs git dep (invisible to version->advisory matching by
      # construction; the allowlist + manual rev-bump protocol is the
      # ceiling). Config: rust/deny.toml.
      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories bans licenses sources

      # Cache reusable compiler outputs, not multi-gigabyte test executables or
      # incremental state. Oversized caches never weaken the gate: validation
      # remains green or red on its own merits, but publication is skipped and
      # the reason is visible in both the log and run summary.
      - name: Measure cargo cache payload
        id: cargo-cache-size
        shell: bash
        env:
          CARGO_CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
          CARGO_CACHE_MATCHED_KEY: ${{ steps.cargo-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          max_bytes=$((8 * 1024 * 1024 * 1024))
          cache_bytes=0
          for cache_path in \
            "$HOME/.cargo/registry" \
            "$HOME/.cargo/git" \
            rust/target/debug/.fingerprint \
            rust/target/debug/build \
            rust/target/doc; do
            if [[ -e "$cache_path" ]]; then
              path_bytes="$(du -sb "$cache_path" | cut -f1)"
              cache_bytes=$((cache_bytes + path_bytes))
            fi
          done
          for cache_file in rust/target/.rustc_info.json rust/target/debug/.cargo-lock; do
            if [[ -f "$cache_file" ]]; then
              cache_bytes=$((cache_bytes + $(stat -c %s "$cache_file")))
            fi
          done
          find_roots=()
          for cache_root in \
            rust/target/debug \
            rust/target/debug/deps \
            rust/target/debug/examples; do
            if [[ -d "$cache_root" ]]; then
              find_roots+=("$cache_root")
            fi
          done
          if (( ${#find_roots[@]} > 0 )); then
            while IFS= read -r -d '' cache_file; do
              cache_bytes=$((cache_bytes + $(stat -c %s "$cache_file")))
            done < <(
              find "${find_roots[@]}" -maxdepth 1 -type f \
                \( -name '*.d' -o -name '*.rlib' -o -name '*.rmeta' \
                -o -name '*.so' -o -name '*.a' \) -print0
            )
          fi
          if (( cache_bytes <= max_bytes )); then
            within_bound=true
          else
            within_bound=false
          fi
          echo "cargo-cache exact_restore=${CARGO_CACHE_HIT:-false}"
          echo "cargo-cache matched_key=${CARGO_CACHE_MATCHED_KEY:-none}"
          echo "cargo-cache payload_bytes=$cache_bytes"
          echo "cargo-cache publication_bound_bytes=$max_bytes"
          echo "cargo-cache within_publication_bound=$within_bound"
          echo "bytes=$cache_bytes" >> "$GITHUB_OUTPUT"
          echo "within-bound=$within_bound" >> "$GITHUB_OUTPUT"
          {
            echo "### Rust cargo cache"
            echo "- exact restore: ${CARGO_CACHE_HIT:-false}"
            echo "- matched key: ${CARGO_CACHE_MATCHED_KEY:-none}"
            echo "- payload bytes: $cache_bytes"
            echo "- publication bound bytes: $max_bytes"
            echo "- within publication bound: $within_bound"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish trusted cargo cache
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
          success() && steps.cargo-cache-size.outputs.within-bound == 'true' &&
          steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target/.rustc_info.json
            rust/target/debug/.cargo-lock
            rust/target/debug/.fingerprint
            rust/target/debug/build
            rust/target/debug/*.d
            rust/target/debug/deps/*.d
            rust/target/debug/deps/*.rlib
            rust/target/debug/deps/*.rmeta
            rust/target/debug/deps/*.so
            rust/target/debug/deps/*.a
            rust/target/debug/examples/*.d
            rust/target/debug/examples/*.rlib
            rust/target/debug/examples/*.rmeta
            rust/target/debug/examples/*.so
            rust/target/debug/examples/*.a
            rust/target/doc
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # §6.5 Provenance & Ceremony (owner ruling 2026-07-20; doctrine in CLAUDE.md
  # "Baseline ceremonies"): every PR commit touching tests/baselines/** must
  # declare its ceremony with a `Baselines: blessed(<slug>)` trailer. PR-only:
  # dev/main only move via PRs, so the PR range is the authoritative boundary
  # (the commit-msg pre-commit hook is the best-effort local leg). Stdlib-only
  # script — no poetry bootstrap needed.
  ceremony-gate:
    name: Baseline Ceremony Gate (§6.5 provenance)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Ceremony declarations present on baseline-touching commits
        run: >-
          python3 tools/check_baseline_ceremony.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  test-unit:
    name: Unit Tests (xdist, coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Fetch pinned Constitution predecessors (bounded)
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.version=2 fetch \
            --depth=1 --no-tags --prune --no-recurse-submodules origin \
            +3acd1089b6b4e68177c99b4f4cec245e7b74317c:refs/remotes/origin/constitution-v3.1 \
            +cbfc67921283ccb6e00c4b0278288a232281440a:refs/remotes/origin/constitution-v3.2
          test "$(git rev-parse 3acd1089b6b4e68177c99b4f4cec245e7b74317c:CONSTITUTION.md)" = \
            "a265b85120ed2a90be40c72e63ee5bf27fc6e703"
          test "$(git rev-parse cbfc67921283ccb6e00c4b0278288a232281440a:CONSTITUTION.md)" = \
            "e905e90d66bddc6e4eca36a3896428f5ce63de5b"

      - uses: ./.github/actions/bootstrap-python

      - name: Unit shard (excludes ai/slow/reference-DB; engine/systems cov >= 80%)
        run: mise run test:unit-ci

      - name: Upload test results + coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-ci-results
          path: reports/test-results/unit-ci/
          retention-days: 14

  qa-regression:
    name: Determinism Gate (byte-identical dense goldens)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The 5 regression scenarios are synthetic in-memory factories
      # (no reference DB or Postgres) — proven by the Phase-0
      # probe: byte-identical on hosted runners across CPU/glibc/Python.
      - uses: ./.github/actions/bootstrap-python

      - name: qa:regression (5 scenarios vs committed baselines)
        run: mise run qa:regression

      - name: qa:vault-regression (golden-vault byte-gate, in-process scenario — WO-53)
        run: mise run qa:vault-regression

      - name: Gate-coverage truth probe (declared evidence verified at gate cadence)
        run: mise run check:gate-coverage-truth

  pg-integration-shards:
    name: PostgreSQL Contract (${{ matrix.focus }})
    # The one-way cutover replaced the Python writer's integration subset with
    # the task-owned Rust live matrix. The six focus boundaries preserve the
    # complete PR contract while removing independent phases from the critical
    # path. fail-fast stays disabled so every exact-head run yields a complete
    # contract receipt even when one sibling fails.
    # The seventh live focus, client_dossier, stays in the legacy-adopter
    # runner script but leaves this matrix: Bevy compiles against system
    # Wayland/X11/ALSA/udev headers, and the Director ruled (2026-09-04) that
    # Bevy-dependent live lanes run on the dev box, not in CI. Its local
    # exit-0 evidence rides in the PR body.
    runs-on: ubuntu-latest
    timeout-minutes: 99
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        focus:
          - clean_bootstrap
          - h3_atomicity
          - rust_persistence_runtime
          - installed_mutation
          - archive_worker
          - reader_role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/bootstrap-persistence

      - name: Rust PostgreSQL contract
        timeout-minutes: 69
        env:
          BABYLON_LEGACY_ADOPTER_LIVE_FOCUS: ${{ matrix.focus }}
        run: tools/run_rust_legacy_adopter_pg.sh

  pg-integration:
    name: Postgres Integration Tier (PG 17, pinned runtime)
    needs: pg-integration-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every PostgreSQL contract shard
        run: test '${{ needs.pg-integration-shards.result }}' = success

  security:
    # Blocking since 2026-07-11: item 41 closed the CVE wave (73 -> 5, the
    # residue in security/pip-audit-ignores.toml with reasons + expiries).
    name: Security Audit (pip-audit policy — blocking since item-41)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/bootstrap-python
        with:
          ops: "true"

      - name: pip-audit (policy wrapper — ignores carry reason + expiry)
        run: mise run security:pip-audit

  gitleaks:
    name: Secret Scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-config:
    name: IaC Config Scan (trivy, HIGH+CRITICAL blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: .pre-commit-cache
          trivyignores: .trivyignore
          cache: "true"
