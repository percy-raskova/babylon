name: "CodeQL Security Scan"

# ADR181 R5 (2026-07-30): the SAST budget follows executable authority.
# - Python and Rust cover the live engine and periphery.
# - Actions covers the CI supply chain, and JavaScript/TypeScript covers the
#   remaining executable repository tooling.
# - Main pull requests require CodeQL before merge. Protected-branch pushes,
#   weekly scans and manual runs refresh security findings asynchronously.
# - `paths-ignore` excludes non-executable design material and Rust test-only
#   files (`tests/` trees and `tests.rs` modules), which never ship (PER-339).
#   The test-tree rule also covers two intentionally malformed nested
#   Rust-workspace fixtures that cannot be extracted. Inline `#[cfg(test)]`
#   modules stay in scope.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  schedule:
    # Weekly scan on Sundays at 3am UTC
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Keep build-mode explicit per language. All current extractors use
        # no-build mode, and a future exception must be visible in this row.
        include:
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds lower-precision security queries to the
          # default suite without turning code-quality findings into blockers.
          queries: security-extended
          config: |
            paths-ignore:
              - .design-sync
              - design
              - rust/**/tests/**
              - rust/**/tests.rs

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
          # Upload findings even if a prior step failed so GitHub can evaluate
          # the repository's native zero-alert code-scanning protection rule.
          upload: always
