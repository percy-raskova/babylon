# Copilot Coding Agent Setup
# Pre-installs dependencies for GitHub Copilot's ephemeral environment
# Docs: docs.github.com/en/copilot/customizing-copilot/
#       customizing-the-development-environment-for-copilot-coding-agent

name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Sync dependencies (dev + ops)
        run: uv sync --frozen --extra ops

      - name: Install mise (task runner)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.8.12
          install: true

      - name: Install pre-commit hooks
        run: uv run --frozen pre-commit install --install-hooks

      - name: Verify environment
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== uv version ==="
          uv --version
          echo "=== Installed packages ==="
          uv tree | head -50
          echo "=== Available mise tasks ==="
          mise tasks 2>/dev/null || echo "mise tasks not available"
          echo "=== Quick sanity check ==="
          uv run python -c "import babylon; print(f'babylon version: {babylon.__version__}')"
