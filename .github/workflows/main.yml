name: Main Qualification

# A pull request to main already runs ci.yml. This workflow adds only the
# release-only legs, under unique check names, so the combined manifest is the
# full pre-merge qualification without rerunning or racing the ordinary gates.
#
# workflow_dispatch is the proof path required before the Director opens a
# release PR. It is accepted only on dev. A push to main never starts this
# workflow because qualification must finish before main advances.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  event-contract:
    name: Main Qualification / Event Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Accept only a main PR or exact dev proof
        run: >-
          python3 tools/check_main_qualification_event.py
          --event "${{ github.event_name }}"
          --ref "${{ github.ref }}"
          --base-ref "${{ github.base_ref }}"

  test-rest:
    name: Main Qualification / Non-Unit Behavioral Contracts
    needs: [event-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bootstrap-python
      - name: Heavy shard (integration, scenarios, property, contract)
        env:
          BABYLON_REST_SHARD_TIMEOUT: 32m
          BABYLON_SLOWUNIT_TIMEOUT: 9m
        run: mise run test:rest-ci
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: main-qualification-rest-results
          path: reports/test-results/rest-ci/
          retention-days: 14

  postgres-determinism:
    name: Main Qualification / PostgreSQL Determinism Bundle
    needs: [event-contract]
    if: ${{ vars.CI_REFDB_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BABYLON_TEST_PG_DSN: "dbname=babylon_test host=localhost port=5433 user=test password=test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bootstrap-python
      - uses: ./.github/actions/bootstrap-persistence
      - uses: ./.github/actions/postgres-up
      - uses: ./.github/actions/fetch-reference-db
      - name: Apply engine schema (canonical DDL)
        run: mise run db:bootstrap
      - name: Strict five-tick bundle versus baseline
        run: mise run qa:e2e-regression
      - name: Rows-per-tick storage budget
        run: mise run qa:storage-budget
      - name: Stop Postgres
        if: always()
        run: tools/ci_postgres_compose.sh down

  refdata-tests:
    name: Main Qualification / Reference-Data Contracts
    needs: [event-contract]
    if: ${{ vars.CI_REFDB_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bootstrap-python
      - uses: ./.github/actions/fetch-reference-db
      - name: Catalog-to-database reconciliation
        run: uv run python tools/sentinel_check.py catalog --check
      - name: Run reference-data contracts
        run: >-
          uv run pytest tests -m requires_reference_db
          -o addopts="" -vv -ra -l --tb=long --durations=0

  docs:
    name: Main Qualification / Release Documentation
    needs: [event-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bootstrap-python
        with:
          docs: "true"
      - name: Run formula doctest examples
        run: >-
          uv run pytest --doctest-modules src/babylon/formulas
          -o addopts="" -vv -ra --tb=long
      - name: Build the release manual (advisory until warning debt closes)
        continue-on-error: true
        working-directory: docs
        run: timeout 480 uv run sphinx-build -b html . _build/html

  ai-tests:
    name: Main Qualification / AI Tests (advisory)
    needs: [event-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/bootstrap-python
      - name: Run AI unit tests
        run: >-
          uv run pytest tests/unit/ai
          -o addopts="" -m "not requires_ollama"
          -vv -ra -l --tb=long --durations=0

  trivy-image:
    name: Main Qualification / Container Image Scan (advisory)
    needs: [event-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build babylon-pg with the shared GHA layer cache
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7
        with:
          source: .
          files: docker-compose.yml
          targets: babylon-pg
          load: true
          set: |
            babylon-pg.tags=babylon-pg:ci
            babylon-pg.cache-from=type=gha,scope=babylon-pg
      - name: Scan the built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: babylon-pg:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          cache: "true"
