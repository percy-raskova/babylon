name: Michigan Rollover Smoke

# ADR181 R3(i): the tick-52 year-rollover crash gate in ITS OWN lane. The
# phi_hour regression crashed every michigan seed at tick 52 for ~20 days,
# invisible because this gate was buried in a monolithic nightly that had
# been red 76/76 runs — its signal was indistinguishable from ambient red.
# Daily cron: this is the flagship-scenario crash canary, not a deep leg.
# BLOCKING: process exit is unambiguous, there is no noise to characterize.

on:
  schedule:
    - cron: "0 5 * * *"  # daily 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-michigan-smoke
  cancel-in-progress: false

jobs:
  michigan-smoke:
    name: qa:michigan-rollover-smoke (blocking — tick-52 year-rollover crash gate)
    if: vars.CI_REFDB_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
      - uses: ./.github/actions/bootstrap-python
      - uses: ./.github/actions/bootstrap-persistence
      - uses: ./.github/actions/postgres-up
      - uses: ./.github/actions/fetch-reference-db
      - name: Babylon runtime schema bootstrap (node_state et al.)
        run: mise run db:bootstrap
      - name: qa:michigan-rollover-smoke (60 ticks across the rollover)
        env:
          BABYLON_PG_DSN: "dbname=babylon_test host=localhost port=5433 user=test password=test"
        run: mise run qa:michigan-rollover-smoke
      - name: Stop Postgres
        if: always()
        run: tools/ci_postgres_compose.sh down
