name: Nightly — Security Audit

# ADR181 R3(ii): per-leg split of the monolithic nightly. Weekly tempo.

on:
  schedule:
    - cron: "0 6 * * 3"  # Wednesday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-security
  cancel-in-progress: false

jobs:
  security:
    name: Security Audit (pip-audit policy — blocking since item-41, dev HEAD)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - name: Materialize hypergraph-rs metadata stub (sibling repo, no remote)
        run: sh tools/ci_hypergraph_stub.sh
      - uses: ./.github/actions/bootstrap-python
      - name: pip-audit (policy wrapper — ignores carry reason + expiry)
        run: mise run security:pip-audit
