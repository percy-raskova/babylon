name: Release

# Program 15 Phase 8, owner ruling 4 (2026-07-11): releases are TAG-DRIVEN.
# Version bumps are a deliberate untagged commit on dev. After the qualified
# Director merge, `mise run release:tag -- --yes` attaches vX.Y.Z to main and
# pushes it to fire this workflow. The old push-to-main auto-bump is retired:
# with dev 762 conventional commits ahead, an unguarded ff would have
# auto-published a giant surprise release on arrival (the exact failure
# mode that stale-froze main last time).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to (re)publish a GitHub release for"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a canonical v* tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch protected release ancestry
        run: >-
          git fetch --no-tags origin
          +refs/heads/main:refs/remotes/origin/main
          +refs/heads/dev:refs/remotes/origin/dev

      - name: Verify tag is attached to main history
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python3 tools/check_release_tag.py --tag "$RELEASE_TAG"

      - name: Verify protected main returned to dev before publication
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          MAIN_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$MAIN_SHA" refs/remotes/origin/dev; then
            echo "::error::release main is absent from protected dev history"
            exit 1
          fi
          python3 tools/release_lineage.py verify \
            --ref refs/remotes/origin/dev \
            --tag "$RELEASE_TAG" \
            --main-sha "$MAIN_SHA"

      - name: Releases pin released infra (docs/versioning.md D5)
        run: ./tools/check_release_pins.sh

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      # Pinned to the version uv.lock resolves (bare pip install would
      # silently pull whatever is latest on PyPI at run time).
      - name: Install Commitizen
        run: pip install commitizen==4.15.1

      - name: Extract release notes for this tag
        id: notes
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          # The bump commit (made by `mise run release:bump` on dev) updated
          # CHANGELOG.md; extract this version's section for the release body.
          cz changelog "${TAG#v}" --dry-run > release-notes.md || {
            echo "::warning::cz changelog extraction failed — falling back to full CHANGELOG.md"
            cp CHANGELOG.md release-notes.md
          }
          head -5 release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
