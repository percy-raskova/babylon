name: Weekly — Postgres Integration

# ADR181 R3(ii): per-leg split of the monolithic nightly. Weekly tempo.
# The michigan rollover smoke that used to ride in this job now has its own
# daily lane (nightly-michigan-smoke.yml) — R3(i).

on:
  schedule:
    - cron: "0 6 * * 3"  # Wednesday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-pg-integration
  cancel-in-progress: false

jobs:
  exhaustive-legacy-adopter:
    name: Exhaustive Rust legacy adopter matrix (dev HEAD)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
      - uses: ./.github/actions/bootstrap-python
        with:
          gdal: "true"
          server: "true"
      - name: Install Rust toolchain (legacy adopter only)
        run: |
          CHANNEL="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust/rust-toolchain.toml)"
          rustup toolchain install "$CHANNEL" --profile minimal --no-self-update
      - name: Load persistence cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: >-
            legacy-adopter-${{ runner.os }}-v2-${{
            hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            legacy-adopter-${{ runner.os }}-v2-
      - name: Exhaustive adopter matrix and rollback proof
        timeout-minutes: 31
        run: mise run test:rust-legacy-adopter-pg

  postgres-integration:
    name: Postgres Integration (dev HEAD)
    if: vars.CI_REFDB_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
      - uses: ./.github/actions/bootstrap-python
        with:
          gdal: "true"
          server: "true"
      - uses: ./.github/actions/postgres-up
      - uses: ./.github/actions/fetch-reference-db
      # Engine-runtime tables (node_state et al.) are not Django's — the
      # canonical DDL apply is required on a fresh CI Postgres.
      - name: Babylon runtime schema bootstrap (node_state et al.)
        run: mise run db:bootstrap
      # Advisory until noise is characterized (audit 2026-07-16): per-system
      # wallclock vs the ratified spec-104 budget.
      - name: qa:tick-budget (advisory — per-system wallclock vs ratified budget)
        continue-on-error: true
        env:
          BABYLON_TEST_PG_DSN: "dbname=babylon_test host=localhost port=5433 user=test password=test"
        run: mise run qa:tick-budget
      - name: Stop Postgres
        if: always()
        run: tools/ci_postgres_compose.sh down
