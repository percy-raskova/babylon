name: Weekly — Postgres Integration

# ADR181 R3(ii): per-leg split of the monolithic nightly. Weekly tempo.
# The Michigan rollover smoke has its own daily lane
# (nightly-michigan-smoke.yml). This workflow owns only the exhaustive Rust
# live migration/adoption matrix.

on:
  schedule:
    - cron: "0 6 * * 3"  # Wednesday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-pg-integration
  cancel-in-progress: false

jobs:
  exhaustive-legacy-adopter:
    name: Exhaustive Rust legacy adopter matrix (dev HEAD)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
      - uses: ./.github/actions/bootstrap-persistence
      - name: Exhaustive adopter matrix and rollback proof
        timeout-minutes: 31
        run: tools/run_rust_legacy_adopter_pg.sh
