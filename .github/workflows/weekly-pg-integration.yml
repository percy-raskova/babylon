name: Weekly — Postgres Integration

# ADR181 R3(ii): per-leg split of the monolithic nightly. Weekly tempo.
# The Michigan rollover smoke has its own daily lane
# (nightly-michigan-smoke.yml). This workflow exercises every current Rust
# database, reference, reader, Archive and client contract against a fresh runtime.

on:
  schedule:
    - cron: "0 6 * * 3"  # Wednesday 06:00 UTC
  workflow_dispatch:
    inputs:
      focus:
        description: Run every database contract or focus on readers, statewide or organizer campaigns
        type: choice
        default: all
        options:
          - all
          - reader
          - statewide_qualified
          - organizer

permissions:
  contents: read

concurrency:
  group: nightly-pg-integration
  cancel-in-progress: false

jobs:
  runtime-contracts:
    name: Fresh Rust PostgreSQL (${{ matrix.focus }})
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: >-
        ${{ fromJSON(inputs.focus == 'statewide_qualified' &&
          '{"focus":["statewide_qualified"]}' ||
          inputs.focus == 'reader' && '{"focus":["reader"]}' ||
          inputs.focus == 'organizer' && '{"focus":["organizer"]}' ||
          '{"focus":["runtime_smoke","reference_integrity","runtime","archive",
          "reader","client","statewide_qualified","organizer"]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
      - uses: ./.github/actions/bootstrap-persistence
        id: persistence-cache
        with:
          cache-key: ${{ matrix.focus }}
      - uses: ./.github/actions/build-postgres
        id: postgres-image
      - name: Current Rust PostgreSQL contract
        timeout-minutes: 85
        env:
          BABYLON_POSTGRES_LIVE_FOCUS: ${{ matrix.focus }}
          BABYLON_POSTGRES_IMAGE_ID: ${{ steps.postgres-image.outputs.image-id }}
          BABYLON_TIMINGS: "1"
        run: tools/run_rust_postgres.sh

      - name: Save successful persistence cache
        if: >-
          success() && github.event_name != 'pull_request' &&
          (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') &&
          steps.persistence-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          key: ${{ steps.persistence-cache.outputs.cache-key }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            rust/target/.rustc_info.json
            rust/target/debug/.cargo-lock
            rust/target/debug/.fingerprint
            rust/target/debug/build
            rust/target/debug/deps
            rust/target/debug/babylon-runtime
            rust/target/debug/babylon-runtime.d
