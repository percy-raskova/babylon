name: Weekly — Python 3.13 Forward Compat

# ADR181 R3(ii): per-leg split of the monolithic nightly (the Sunday leg).

on:
  schedule:
    - cron: "0 4 * * 0"  # Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-py313
  cancel-in-progress: false

jobs:
  py313-forward-compat:
    name: Python 3.13 Suite (forward compat)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
      # Documented exception to the mise-pinned toolchain: this leg exists
      # precisely to run a DIFFERENT python (3.13) than .mise.toml pins.
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install dependencies on 3.13
        run: uv sync --frozen --extra ops --python 3.13
      # Max verbosity by owner ruling (2026-07-11): CI logs are agent-read.
      - name: Full suite on 3.13
        run: >-
          uv run --python 3.13 pytest tests --ignore=tests/unit/ai
          -o addopts="" -vv -ra -l --tb=long --durations=0
          -m "not red_phase and not requires_reference_db"
