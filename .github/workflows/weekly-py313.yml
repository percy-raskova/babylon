name: Weekly — Python 3.13 Forward Compat

# ADR181 R3(ii): per-leg split of the monolithic nightly (the Sunday leg).

on:
  schedule:
    - cron: "0 4 * * 0"  # Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-py313
  cancel-in-progress: false

jobs:
  py313-forward-compat:
    name: Python 3.13 Suite (forward compat)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 1
          persist-credentials: true
      - name: Fetch pinned Constitution predecessors (bounded)
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.version=2 fetch \
            --depth=1 --no-tags --prune --no-recurse-submodules origin \
            +3acd1089b6b4e68177c99b4f4cec245e7b74317c:refs/remotes/origin/constitution-v3.1 \
            +cbfc67921283ccb6e00c4b0278288a232281440a:refs/remotes/origin/constitution-v3.2
          test "$(git rev-parse 3acd1089b6b4e68177c99b4f4cec245e7b74317c:CONSTITUTION.md)" = \
            "a265b85120ed2a90be40c72e63ee5bf27fc6e703"
          test "$(git rev-parse cbfc67921283ccb6e00c4b0278288a232281440a:CONSTITUTION.md)" = \
            "e905e90d66bddc6e4eca36a3896428f5ce63de5b"
      # Documented exception to the mise-pinned toolchain: this leg exists
      # precisely to run a DIFFERENT python (3.13) than .mise.toml pins.
      - name: Install uv
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          install_args: uv
      - name: Install dependencies on 3.13
        run: uv sync --frozen --extra ops --python 3.13
      # Max verbosity by owner ruling (2026-07-11): CI logs are agent-read.
      - name: Full suite on 3.13
        run: >-
          uv run --python 3.13 pytest tests --ignore=tests/unit/ai
          -o addopts="" -vv -ra -l --tb=long --durations=0
          -m "not red_phase and not requires_reference_db"
