name: Weekly — Rebuild-Verify Reference DB

# ADR181 R3(ii): per-leg split of the monolithic nightly. Weekly tempo.
# The byte-identity contract is defined ONLY under the pinned sqlite (the
# builder hard-gates on PINNED_SQLITE_VERSION), so this leg runs inside the
# vendored flake's dataBuild devshell (environment-sovereignty ruling
# 2026-07-21; the nixpkgs-data input is the sole sqlite pinning authority,
# lockstep with tools/build_reference_db.py::PINNED_SQLITE_VERSION).

on:
  schedule:
    - cron: "0 6 * * 3"  # Wednesday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-rebuild-verify
  cancel-in-progress: false

jobs:
  rebuild-verify:
    name: Rebuild-Verify Reference DB (byte-identity, dataBuild devshell)
    if: vars.CI_REFDB_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The manifest-driven step of this action fetches every `artifacts:`
      # entry + schema.sql into their dist/ homes — exactly what
      # build_reference_db.py reads.
      - uses: ./.github/actions/fetch-reference-db
      - name: Rebuild under the pinned devshell + compare product sha
        run: |
          # Post-cutover the product block is load-bearing — its absence is a
          # manifest regression, not a pre-cutover state (III.11: fail loud).
          if ! grep -q '^product:' data-artifacts.yaml; then
            echo "::error::data-artifacts.yaml has no product block — manifest regression"
            exit 1
          fi
          nix develop .#dataBuild --command \
            python3 tools/build_reference_db.py --out /tmp/rebuilt.sqlite
          nix develop .#dataBuild --command python3 - <<'EOF'
          import hashlib
          import pathlib
          import sys

          import yaml

          want = yaml.safe_load(pathlib.Path("data-artifacts.yaml").read_text())["product"]["sha256"]
          got = hashlib.sha256(pathlib.Path("/tmp/rebuilt.sqlite").read_bytes()).hexdigest()
          print(f"registry={want}\nrebuilt ={got}")
          sys.exit(0 if want == got else 1)
          EOF
