name: Weekly — Frozen Python Reference Analysis

# Development observability only. Rust remains game-state authority; this
# workflow exercises the frozen p27-python-freeze transcription/reference.

on:
  schedule:
    - cron: "0 4 * * 1"  # Monday 04:00 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: Bounded frozen-reference workload profile
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - full

permissions:
  contents: read

concurrency:
  group: frozen-python-reference-analysis-${{ inputs.profile || 'weekly' }}
  cancel-in-progress: false

jobs:
  reference-analysis:
    name: Frozen Python Reference Analysis (${{ inputs.profile || 'weekly' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REFERENCE_ANALYSIS_PROFILE: ${{ inputs.profile || 'weekly' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
      - uses: ./.github/actions/bootstrap-python
      - name: Generate frozen Python reference-analysis artifacts
        shell: bash
        run: |
          case "$REFERENCE_ANALYSIS_PROFILE" in
            weekly|full) ;;
            *) echo "unsupported reference-analysis profile" >&2; exit 2 ;;
          esac
          mise run analysis:campaign -- "$REFERENCE_ANALYSIS_PROFILE"
      - name: Upload frozen Python reference-analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frozen-python-reference-analysis-${{ env.REFERENCE_ANALYSIS_PROFILE }}-${{ github.run_id }}
          path: reports/frozen-reference-analysis/
          retention-days: 90
