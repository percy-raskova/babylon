name: Weekly — Parameter Sweep Artifact

# ADR181 R3(ii): per-leg split of the monolithic nightly (the Sunday leg).

on:
  schedule:
    - cron: "0 4 * * 0"  # Sunday 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-sim-artifacts
  cancel-in-progress: false

jobs:
  sim-artifacts:
    name: Parameter Sweep Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
      - uses: ./.github/actions/bootstrap-python
      - name: Parameter sweep
        run: mise run sim:sweep 200
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sim-analysis-${{ github.run_id }}
          path: results/sweep.csv
          retention-days: 90
