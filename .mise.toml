# CI pytest flag rationale (both test:*-ci tasks):
#   -o addopts="" is LOAD-BEARING: pyproject addopts inject --cov-report=html,
#     and pytest-cov's clear-reports special case (--cov-report=) only fires
#     when it is the SOLE occurrence across addopts+CLI — without the strip,
#     every CI run silently writes htmlcov/. Wanted addopts are re-added below.
#   Maximum verbosity by owner ruling (2026-07-11): CI logs are read by AI
#     agents, so -vv/-ra/-l/--tb=long/--durations=0 — finest granularity wins.
#   No --color=yes: CI is non-TTY, so pytest emits plain text — ANSI codes
#     inside FAILED tokens break machine grep (bitten during Phase 0).
#   Coverage (owner ruling 2026-07-11): MEASURE the whole tree (term-missing
#     table + coverage.xml/json artifacts); GATE only engine/systems >= 80,
#     enforced by a report-time --include filter on the same .coverage data —
#     one pytest invocation, metrics and gate separated.
[tasks."test:unit-ci"]
description = "CI unit shard (program 15): xdist -n4 loadscope, max-verbosity output, full-tree coverage artifacts, excludes slow/red_phase/requires_reference_db, gates engine/systems cov >= 80"
run = """
set -e
mkdir -p reports/test-results/unit-ci
# timeout -s INT: a wedged run (2026-07-16 incident: worker crash + loadscope
# stranded its queue -> scheduler futex-wait at 99%) self-salvages with a full
# summary + junit instead of burning the job's timeout-minutes and dying mute.
# --max-worker-restart=2: repeated worker death fails the session loudly.
# tests/unit/ai is NOT ignored (2026-07-16 re-tier): the mock-based ai-suite
# tests run here in ~3s — the `ai` marker on them is taxonomy, not an
# LLM-server dependency; local test:unit always ran them, CI matches. The
# 2026-07-19 G6 entailment eval added the directory's FIRST genuinely
# live-LLM tests — those carry `requires_ollama` and are excluded from every
# fast gate (they run via `mise run test:ai` on a box with the daemon).
timeout --signal=INT --kill-after=120 15m \
uv run pytest tests/unit \
  -o addopts="" -vv -ra -l --tb=long --durations=0 \
  -m 'not red_phase and not slow and not requires_reference_db and not requires_ollama' \
  -n 4 --dist loadscope --max-worker-restart=2 \
  --cov=src/babylon \
  --cov-report=term-missing:skip-covered \
  --cov-report=xml:reports/test-results/unit-ci/coverage.xml \
  --cov-report=json:reports/test-results/unit-ci/coverage.json \
  --junit-xml=reports/test-results/unit-ci/junit.xml
echo '=== Coverage gate: src/babylon/engine/systems >= 80% ==='
uv run coverage report --include='src/babylon/engine/systems/*' --fail-under=80
"""

[tasks."test:rest-ci"]
description = "CI heavy shard (program 15): everything outside tests/unit, plus slow-marked tests/unit tests; excludes red_phase/requires_reference_db"
# NO coverage on this shard (program 15, 2026-07-11): pytest-cov under
# `-n 4` xdist instruments all of src/babylon in every worker, and stacked on
# the memory-heavy integration/property suites it OOM-killed a worker on the
# hosted runner — a silent SIGKILL ("sh exited with non-zero status: no exit
# status", no traceback), at a DIFFERENT test each attempt (cumulative memory,
# not a test bug: every test passes standalone). The coverage GATE is unaffected
# — it lives on the unit shard (test:unit-ci, engine/systems >=80). This shard's
# full-tree coverage was non-gating artifact only; restoring it needs a proper
# per-worker memory budget (owner item 54).
run = """
set -e
mkdir -p reports/test-results/rest-ci
# timeout -s INT + --max-worker-restart=2: wedge/crash-loop guards (2026-07-16
# incident — see test:unit-ci comment; loadscope does NOT redistribute a
# crashed worker's queued scopes, so a crash can hang the scheduler forever).
# CI sets the tight caps via env (sized under nightly's 35-min job budget);
# local defaults are generous — the dev box runs this shard in ~50-90 min
# (2026-07-16 benchmark) and the cap exists to kill WEDGES, not slowness.
# HYPOTHESIS_PROFILE: this is the only shard running tests/property — default
# to the registered 'ci' profile (500 examples); nightly overrides via env.
export HYPOTHESIS_PROFILE="${HYPOTHESIS_PROFILE:-ci}"
# R8 fix (2026-07-27): --ignore=tests/integration/web dropped — that
# directory no longer exists (Django test estate removal), so the flag was a
# dead no-op.
timeout --signal=INT --kill-after=120 "${BABYLON_REST_SHARD_TIMEOUT:-100m}" \
uv run pytest tests --ignore=tests/unit \
  -o addopts="" -vv -ra -l --tb=long --durations=0 \
  -m 'not red_phase and not requires_reference_db' \
  -n 4 --dist loadscope --max-worker-restart=2 \
  --junit-xml=reports/test-results/rest-ci/junit.xml
echo '=== slow-marked tests/unit tests (excluded from the test:unit-ci fast shard) ==='
timeout --signal=INT --kill-after=120 "${BABYLON_SLOWUNIT_TIMEOUT:-30m}" \
uv run pytest tests/unit --ignore=tests/unit/ai \
  -o addopts="" -vv -ra -l --tb=long --durations=0 \
  -m 'slow and not red_phase and not requires_reference_db' \
  -n 4 --dist loadscope --max-worker-restart=2 \
  --junit-xml=reports/test-results/rest-ci/junit-slow-unit.xml
"""

[tasks."security:pip-audit"]
description = "pip-audit through the expiring-ignores policy wrapper (program 15): security/pip-audit-ignores.toml entries need reason + expiry; expired entries hard-fail"
run = "uv run python tools/run_pip_audit.py"

[tasks."wt:new"]
description = "Git-doctrine item 2: create .claude/worktrees/NAME on a fresh wt/NAME branch off the current branch; prints the shadow-venv + lint-imports usage recipe (worktrees never get their own venv)"
usage = 'arg "<name>" help="Worktree slug: lowercase alnum segments joined by single hyphens"'
run = 'uv run python tools/worktree_tool.py new "$usage_name"'

[tasks."wt:done"]
description = "Git-doctrine item 2: retire .claude/worktrees/NAME — refuses unless the worktree is clean AND wt/NAME is fully merged into the current branch (pass --force to bypass); removes the worktree and deletes the branch"
usage = '''
arg "<name>" help="Worktree slug to retire"
flag "--force" help="Bypass the clean/merged checks (force-remove worktree, -D delete branch)"
'''
run = 'uv run python tools/worktree_tool.py done "$usage_name" ${usage_force:+--force}'

[tasks.commit]
description = "Hook-safe commit: pre-run hooks, re-stage fixes, retry on hook-rewrite, VERIFY HEAD moved. Pass - to read the message from stdin (multi-line bodies)."
usage = 'arg "<message>" help="Conventional commit message, or - to read from stdin"'
run = '''
set -euo pipefail
if git diff --cached --quiet; then
  echo "[commit] nothing staged — git add first"; exit 1
fi

# Capture the EXACT staged set and the pre-commit HEAD up front.
STAGED="$(git diff --cached --name-only)"
BEFORE="$(git rev-parse HEAD)"

# Message: literal arg, or stdin when "-" (the only way to pass a body with
# blank lines — a single `git commit -m` cannot, which is why callers used to
# bypass this task entirely and lose the HEAD verification below).
MSGFILE="$(mktemp)"
trap 'rm -f "$MSGFILE"' EXIT
if [ "$usage_message" = "-" ]; then
  cat > "$MSGFILE"
else
  printf '%s\n' "$usage_message" > "$MSGFILE"
fi

# Re-stage hook fixes for EXACTLY the staged set — never the whole tree,
# which would sweep up unrelated working-tree changes.
restage() {
  for f in $STAGED; do
    if [ -e "$f" ]; then git add -- "$f"; fi
  done
  true
}

# First pass absorbs the "files were modified by this hook" abort.
uv run pre-commit run || true
restage

# The commit re-runs hooks. If a hook rewrites a staged file DURING this run,
# git aborts while every hook prints Passed and HEAD silently does not move.
# Retry once after re-staging — the rewrite has already been applied by then.
if ! git commit -F "$MSGFILE"; then
  echo "[commit] first attempt aborted (hook rewrote a staged file) — re-staging and retrying"
  restage
  git commit -F "$MSGFILE"
fi

# THE ACTUAL VERIFICATION. Printing `git log` is not a check; comparing is.
AFTER="$(git rev-parse HEAD)"
if [ "$BEFORE" = "$AFTER" ]; then
  echo "[commit] FAILED: HEAD did not move ($(git rev-parse --short "$BEFORE")). NOTHING WAS COMMITTED."
  echo "[commit] Inspect 'git status --short' for MM entries (staged AND modified = hook rewrite)."
  exit 1
fi
echo "[commit] OK: HEAD $(git rev-parse --short "$BEFORE") -> $(git rev-parse --short "$AFTER")"
git log --oneline -1
git status --short | grep -v "^??" || true
'''

