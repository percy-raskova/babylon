# Mise Task Runner Configuration for Babylon
# https://mise.jdx.dev/
#
# Task Namespace Convention (ADR035):
#   check         - Non-mutating local gate (hosted static leaves + local contracts + unit tests)
#   ci:*          - Hosted-CI entry points and local runner adapters
#   dev:*         - Development environment diagnostics and maintenance
#   test:*        - Test runners by scope
#   sim:*         - Rust simulation execution and observability
#   qa:*          - Quality assurance and verification
#   demo:*        - Integration demos and persona testing
#   data:*        - Data pipeline operations
#   docs:*        - Documentation building
#   midi:*        - Music generation

# Hosted CI installs the current mise release through mise-action.
min_version = "2026.9.1"

[tool_config]
locked = true

[task_config]
includes = [
  ".mise/tasks/devtools.toml",
  ".mise/tasks/simulation.toml",
]

[tools]
python = "3.12.14"
uv = "0.9.8"
node = "22.22.2"

[env]
BABYLON_ENV = "development"
# Pin BLAS/OpenMP to 1 thread for every mise-run command. The engine's numpy/scipy
# economics spawns one OpenBLAS thread PER CORE (24 here) per process by default;
# under xdist / parallel runs that nested process x BLAS parallelism thrashed the
# box until the desktop froze (2026-07-12). xdist supplies the parallelism; nested
# BLAS threads are pure harm. Also removes non-deterministic FP reduction order
# (Constitution III.7). tests/conftest.py enforces the same for raw `uv run`.
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"
# W1.8: rustworkx centrality parallelizes via rayon above parallel_threshold
# (50 nodes) — same oversubscription hazard + parallel float-summation order
# (Constitution III.7). Rayon reads this once at pool init.
RAYON_NUM_THREADS = "1"
# Agent ergonomics: uncolored tool output (kills ANSI-strip pipelines)
NO_COLOR = "1"
# PER-286 replaces the old cross-repository sccache directory with the
# versioned PATH dispatcher in `.codex/host`. The dispatcher owns
# repository-local target/build roots and cache directory/socket. Four jobs
# remains the exact defense-in-depth ceiling for ordinary clones that have not
# installed the Codex dispatcher; managed Cargo accepts but cannot raise it.
CARGO_BUILD_JOBS = "4"
# Soundfont for MIDI conversion
SOUNDFONT = "/usr/share/sounds/sf2/FluidR3_GM.sf2"
MUSIC_DIR = "assets/music"

# =============================================================================
# INSTALLATION
# =============================================================================

[tasks."pr:merge"]
description = "the ONE sanctioned merge path: all-green + head-pin + Copilot advisory + unresolved review thread block + zero alert floor + stacked-PR guard"
run = "python3 tools/pr_merge.py"

[tasks."deps:conveyor"]
description = "serial Dependabot merge conveyor: classify + merge CLEAN PRs via pr:merge, request dependabot rebase for BEHIND branches, exit when queue empties"
run = "python3 tools/dependabot_conveyor.py"

[tasks."check:worktree-contract"]
description = "Validate the pinned worktree interpreter, staged dependency inputs and resolved dependency lock"
run = "python3 tools/check_worktree_contract.py"

[tasks."check:env-contract"]
description = "Verify the native project interpreter and isolated editable imports"
run = "uv run --frozen python tools/check_native_environment.py"

[tasks.install]
description = "Install all dependencies (from the committed lock — see deps:lock to re-resolve)"
# --frozen: install exactly uv.lock, never re-resolve. Changing dependencies?
# Edit pyproject.toml, then regenerate uv.lock with the pinned uv toolchain.
# Amendment AF (ADR186) deleted the babylon-tui wheel from the default
# dependency set — this sync no longer needs cargo/rustc on PATH.
run = "uv sync --extra ops --frozen"

[tasks.setup]
description = "One-shot bootstrap for a fresh clone: toolchain + deps + hooks + tuned PostgreSQL 17 + canonical schema (spec-087 FR-008)"
run = """
set -e
mise install --locked
rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy
uv sync --extra ops --frozen
uv run --frozen python tools/install_git_hooks.py
mise run db:up
(cd rust && CARGO_BUILD_JOBS=4 cargo build -p babylon-persistence --bin babylon-runtime --locked)
export PATH="$PWD/rust/target/debug:$PATH"
BABYLON_RUNTIME_DSN="host=127.0.0.1 port=5433 dbname=babylon_test user=test password=test" babylon-runtime bootstrap
if [ ! -f data/sqlite/marxist-data-3NF.sqlite ]; then
  echo "WARN: reference DB missing at data/sqlite/marxist-data-3NF.sqlite"
  echo "      (reference-data tooling needs it; see project/04-data-program-098.md)"
fi
echo ""
echo "Setup complete. Validate a disposable database with: mise run test:rust-postgres"
"""

# =============================================================================
# CODE QUALITY
# =============================================================================

[tasks.lint]
description = "Run ruff linter with auto-fix"
run = "uv run ruff check . --fix"

[tasks.format]
description = "Run ruff formatter"
run = "uv run ruff format ."

[tasks.fix]
description = "Explicit sequential Python rewrite: apply Ruff lint fixes, then format"
run = """
set -e
mise run lint
mise run format
"""

[tasks.typecheck]
description = "Run mypy type checker"
run = "uv run --frozen mypy src tools/devtools"

[tasks."lint:yaml"]
description = "Lint YAML files"
run = "uv run yamllint -c .yamllint.yaml ."

[tasks."lint:md"]
description = "Lint Markdown files"
run = "npx markdownlint --config .markdownlint.yaml '**/*.md' --ignore 'CHANGELOG.md' --ignore 'brainstorm/**' --ignore '.venv/**'"

[tasks.check]
description = "Canonical non-mutating local gate: hosted static checks plus governance, ADR catalog, and unit tests"
depends = ["check:static", "check:governance-mass", "check:adr-catalog", "test:unit"]

[tasks."check:static"]
description = "Hosted Fast Gate leaves, reusable locally without source rewrites or reference data"
depends = ["check:hygiene", "check:dynamic-linking-fence", "lint:check", "format:check", "typecheck", "check:lock"]

[tasks."check:full-local"]
description = "Canonical check plus workstation data-path and reference-catalog probes"
depends = ["check", "data:doctor"]

[tasks."data:doctor"]
description = "Loud data-pathway gate: trove mount + repo symlinks + Postgres bind on the data drive (clean skip off the dev box); heal = sudo tools/heal_data_mount.sh"
run = "tools/data_doctor.sh"

[tasks."check:quick"]
description = "Non-mutating quality gate without the test leg: lint + format + typecheck"
depends = ["lint:check", "format:check", "typecheck"]

[tasks."check:lock"]
description = "Verify uv.lock matches project metadata without frozen-mode masking"
run = "env -u UV_FROZEN uv lock --check"

[tasks."check:hygiene"]
description = "Repo-hygiene gate: root allowlist, ignore-consistency, blob sizes (program 14)"
run = "uv run --frozen python tools/check_repo_hygiene.py"

[tasks.adr]
description = "Rebuild and query the disposable local ADR catalog"
run = "uv run python tools/adr_catalog.py"

[tasks."check:adr-catalog"]
description = "Build and validate a temporary ADR catalog"
run = "uv run --frozen python tools/adr_catalog.py check"

[tasks."governance:mass"]
description = "Report ADR, plan-history, and repo-skill context mass as bounded JSON"
run = "uv run python tools/check_governance_mass.py"

[tasks."check:governance-mass"]
description = "Enforce repo-skill discovery/body budgets and query-first ADR routing"
run = "uv run --frozen python tools/check_governance_mass.py --check"

[tasks."check:dynamic-linking-fence"]
description = "R1.4 fence, static half: bevy/dynamic_linking never referenced in a workflow, never leaks out of the sanctioned rust:client-dev-dylib task, never a default feature (Director ruling 2026-08-18)"
run = "./tools/check_dynamic_linking_fence.sh"

[tasks."check:ceremony"]
description = "Baseline-ceremony gate (§6.5): commits touching tests/baselines/** must carry Baselines: blessed(<slug>)"
run = "python3 tools/check_baseline_ceremony.py --range origin/dev..HEAD"

[tasks."pr:body"]
description = "Generate a deterministic PR body from conventional commits + trailers (git doctrine §5.9 item 1)"
usage = '''
arg "[base]" help="Base ref to diff from" default="origin/dev"
arg "[head]" help="Head ref" default="HEAD"
'''
run = "uv run python tools/generate_pr_body.py --base ${usage_base} --head ${usage_head}"

[tasks.cap]
description = "Run a command under a HARD memory+CPU cgroup cap (can't freeze the machine). Use for any heavy run: mise run cap -- mise run test:unit"
run = "tools/capped.sh"

[tasks."test:capped"]
description = "test:unit under a 12G/8-core hard cap — the safe way to run the full suite locally"
run = "tools/capped.sh mise run test:unit"

[tasks."mcp:reap"]
description = "Reap leaked chroma-mcp servers (claude-mem backend leaks ~1GB each on long sessions; 77 = 28GB once nearly froze the box). Safe: Chroma data is on disk, a fresh server respawns on next use. Run when they pile up."
run = "tools/reap_chroma.sh"

[tasks."ci:local"]
description = "Run a GitHub Actions job locally via gh-act (program 15) — e.g. mise run ci:local -- -W .github/workflows/ci.yml -j fast-gate. Install once: gh extension install https://github.com/nektos/gh-act"
# Image + arch live in .actrc so raw `gh act` behaves identically.
# --apply-event-filters: CORRECTNESS — without it act ignores paths:/branches:
#   filters and can go green on a job GitHub would not even trigger.
# --reuse/--pull=false/--action-offline-mode: SPEED — keep the container and
#   cached actions between runs; do an occasional clean run without them.
run = "gh act --apply-event-filters --reuse --pull=false --action-offline-mode"

[tasks."lint:check"]
description = "Ruff lint, no fixes (CI parity; the auto-fixing variant is tasks.lint)"
run = "uv run --frozen ruff check ."

[tasks."format:check"]
description = "Ruff format check, no rewrites (CI parity; the rewriting variant is tasks.format)"
run = "uv run --frozen ruff format --check ."

[tasks."test:unit-ci"]
description = "Retained Python data and repository tooling unit contracts"
run = """
set -e
mkdir -p reports/test-results/unit-ci
uv run --frozen pytest tests/unit -o addopts="" -q -ra --tb=short --durations=20 \
  -m 'not slow and not requires_reference_db and not requires_ollama' \
  -n 4 --dist worksteal --max-worker-restart=2 \
  --junit-xml=reports/test-results/unit-ci/junit.xml
"""

[tasks."test:rest-ci"]
description = "Release remainder: non-unit contracts and slow units; reference-data contracts run separately"
run = """
set -e
mkdir -p reports/test-results/rest-ci
uv run --frozen pytest tests --ignore=tests/unit -o addopts="" -q -ra --tb=short --durations=20 \
  -m 'not requires_reference_db and not requires_ollama' \
  -n 4 --dist worksteal --max-worker-restart=2 \
  --junit-xml=reports/test-results/rest-ci/non-unit.xml
# Fast units already ran in ci.yml. This shard may be empty after retirement.
slow_unit_status=0
uv run --frozen pytest tests/unit -o addopts="" -q -ra --tb=short --durations=20 \
  -m 'slow and not requires_reference_db and not requires_ollama' \
  -n 4 --dist worksteal --max-worker-restart=2 \
  --junit-xml=reports/test-results/rest-ci/slow-unit.xml || slow_unit_status=$?
if [ "$slow_unit_status" -ne 0 ] && [ "$slow_unit_status" -ne 5 ]; then
  exit "$slow_unit_status"
fi
"""

[tasks."security:pip-audit"]
description = "pip-audit through the expiring-ignores policy wrapper (program 15): security/pip-audit-ignores.toml entries need reason + expiry; expired entries hard-fail"
run = "uv run python tools/run_pip_audit.py"

[tasks.commit]
description = "Hook-safe commit: pre-run hooks, re-stage fixes, retry on hook-rewrite, VERIFY HEAD moved. Pass - to read the message from stdin (multi-line bodies)."
usage = 'arg "<message>" help="Conventional commit message, or - to read from stdin"'
run = '''
set -euo pipefail
# A pending merge can add ancestry even when its tree equals HEAD.
if git diff --cached --quiet && ! git rev-parse --verify --quiet MERGE_HEAD >/dev/null; then
  echo "[commit] nothing staged — git add first"; exit 1
fi

# Capture the EXACT staged set and the pre-commit HEAD up front.
STAGED="$(git diff --cached --name-only)"
BEFORE="$(git rev-parse HEAD)"

# Message: literal arg, or stdin when "-" (the only way to pass a body with
# blank lines — a single `git commit -m` cannot, which is why callers used to
# bypass this task entirely and lose the HEAD verification below).
MSGFILE="$(mktemp)"
trap 'rm -f "$MSGFILE"' EXIT
if [ "$usage_message" = "-" ]; then
  cat > "$MSGFILE"
else
  printf '%s\n' "$usage_message" > "$MSGFILE"
fi

# Re-stage hook fixes for EXACTLY the staged set — never the whole tree,
# which would sweep up unrelated working-tree changes.
restage() {
  for f in $STAGED; do
    if [ -e "$f" ]; then git add -- "$f"; fi
  done
  true
}

# First pass absorbs the "files were modified by this hook" abort.
uv run pre-commit run || true
restage

# The commit re-runs hooks. If a hook rewrites a staged file DURING this run,
# git aborts while every hook prints Passed and HEAD silently does not move.
# Retry once after re-staging — the rewrite has already been applied by then.
if ! git commit -F "$MSGFILE"; then
  echo "[commit] first attempt aborted (hook rewrote a staged file) — re-staging and retrying"
  restage
  git commit -F "$MSGFILE"
fi

# THE ACTUAL VERIFICATION. Printing `git log` is not a check; comparing is.
AFTER="$(git rev-parse HEAD)"
if [ "$BEFORE" = "$AFTER" ]; then
  echo "[commit] FAILED: HEAD did not move ($(git rev-parse --short "$BEFORE")). NOTHING WAS COMMITTED."
  echo "[commit] Inspect 'git status --short' for MM entries (staged AND modified = hook rewrite)."
  exit 1
fi
echo "[commit] OK: HEAD $(git rev-parse --short "$BEFORE") -> $(git rev-parse --short "$AFTER")"
git log --oneline -1
git status --short | grep -v "^??" || true
'''

# =============================================================================
# TESTING (Namespaced)
# =============================================================================

# -----------------------------------------------------------------------------
# Verbose machine-readable test runs.
# Every test:* task writes JUnit XML + JSON + self-contained HTML to
# reports/test-results/<task>/ for AI-agent and tool consumption.
# Verbose flags (per pytest C7 docs, max standard expressiveness):
#   -vv                      full assertion diffs (no truncation)
#   --tb=long                long tracebacks
#   --showlocals             include local variables in tracebacks
#   --show-capture=all       captured stdout/stderr/log on failure
#   --capture=tee-sys        capture stdout/stderr AND pass through to console
#   -r aR                    summary of all outcomes (incl. xfailed/xpassed reasons)
#   --durations=25           top 25 slowest tests
# JUnit XML config (pyproject.toml [tool.pytest.ini_options]):
#   junit_family=xunit2, junit_logging=all, junit_log_passing_tests=true,
#   junit_duration_report=call, junit_suite_name="babylon"
# See CLAUDE.md "Test Reports for AI Agents" section for the JSON schema.
# -----------------------------------------------------------------------------

[tasks."test:unit"]
description = "Unit tests (fast gate — excludes slow-marked; those run in test:slow locally and CI's test:rest-ci) → reports/test-results/unit/"
run = """
mkdir -p reports/test-results/unit
uv run --frozen pytest tests/unit -m 'not red_phase and not slow and not requires_ollama' \
  -n 4 --dist loadscope --max-worker-restart=2 \
  -vv --tb=long --showlocals --show-capture=all --capture=tee-sys -r aR --durations=25 \
  --junit-xml=reports/test-results/unit/junit.xml \
  --json-report --json-report-file=reports/test-results/unit/report.json --json-report-indent=2 \
  --html=reports/test-results/unit/report.html --self-contained-html
"""

[tasks."test:fast"]
description = "Unit tests excluding slow-marked → reports/test-results/fast/"
run = """
mkdir -p reports/test-results/fast
uv run pytest tests/unit -m 'not slow and not requires_ollama' \
  -vv --tb=long --showlocals --show-capture=all --capture=tee-sys -r aR --durations=25 \
  --junit-xml=reports/test-results/fast/junit.xml \
  --json-report --json-report-file=reports/test-results/fast/report.json --json-report-indent=2 \
  --html=reports/test-results/fast/report.html --self-contained-html
"""

[tasks."test:slow"]
description = "Slow-marked tests only → reports/test-results/slow/"
run = """
mkdir -p reports/test-results/slow
uv run pytest -m 'slow' \
  -vv --tb=long --showlocals --show-capture=all --capture=tee-sys -r aR --durations=25 \
  --junit-xml=reports/test-results/slow/junit.xml \
  --json-report --json-report-file=reports/test-results/slow/report.json --json-report-indent=2 \
  --html=reports/test-results/slow/report.html --self-contained-html
"""

[tasks."test:int"]
description = "Integration tests (mechanics & systems) → reports/test-results/int/"
run = """
mkdir -p reports/test-results/int
# -p no:randomly: shared-Postgres/state suites are order-sensitive by nature;
# random shuffling here produces unreproducible cross-test interference
# (audit Phase D — matches test:int-pg's existing setting).
uv run pytest tests/integration -p no:randomly \
  -vv --tb=long --showlocals --show-capture=all --capture=tee-sys -r aR --durations=25 \
  --junit-xml=reports/test-results/int/junit.xml \
  --json-report --json-report-file=reports/test-results/int/report.json --json-report-indent=2 \
  --html=reports/test-results/int/report.html --self-contained-html
"""

[tasks."test:all"]
description = "All non-AI tests → reports/test-results/all/"
run = """
mkdir -p reports/test-results/all
uv run pytest \
  -vv --tb=long --showlocals --show-capture=all --capture=tee-sys -r aR --durations=25 \
  --junit-xml=reports/test-results/all/junit.xml \
  --json-report --json-report-file=reports/test-results/all/report.json --json-report-indent=2 \
  --html=reports/test-results/all/report.html --self-contained-html
"""

[tasks."test:cov"]
description = "Tests + coverage (XML + JSON + HTML) → reports/test-results/cov/"
run = """
mkdir -p reports/test-results/cov
uv run pytest \
  -vv --tb=long --showlocals --show-capture=all --capture=tee-sys -r aR --durations=25 \
  --cov=src/babylon --cov-branch \
  --cov-report=xml:reports/test-results/cov/coverage.xml \
  --cov-report=json:reports/test-results/cov/coverage.json \
  --cov-report=html:reports/test-results/cov/htmlcov \
  --cov-report=term-missing:skip-covered \
  --junit-xml=reports/test-results/cov/junit.xml \
  --json-report --json-report-file=reports/test-results/cov/report.json --json-report-indent=2 \
  --html=reports/test-results/cov/report.html --self-contained-html
"""

[tasks."test:q"]
description = "Quiet scoped pytest for the inner loop (kept cache => --lf works); use: mise run test:q -- <paths>"
run = "uv run pytest -q --no-header -r fEX -o cache_dir=.pytest_cache/q"

[tasks."test:failed"]
description = "Re-run only the failures recorded by the last test:q run (no-op when all green)"
run = '''
code=0
uv run pytest -q --no-header -r fEX -o cache_dir=.pytest_cache/q --lf --lfnf none || code=$?
if [ "$code" -eq 5 ]; then echo "(no failures recorded — nothing to re-run)"; exit 0; fi
exit "$code"
'''

[tasks."test:clean"]
description = "Wipe test artifacts: reports/, .pytest_cache, htmlcov, .coverage*, __pycache__ (idempotent)"
run = """
# Test reports + per-task subdirectories
rm -rf reports/test-results
# Pytest's own cache
rm -rf .pytest_cache
# Coverage HTML + state files (.coverage and .coverage.<host>.<pid>.<rand>)
rm -rf htmlcov
rm -f .coverage .coverage.*
# Bytecode caches across the project — but NOT inside .venv (preserves
# venv-compiled stdlib/dep bytecode so the next test run isn't slow)
find . -type d -name __pycache__ \
  -not -path './.venv/*' \
  -not -path './node_modules/*' \
  -not -path './src/frontend/node_modules/*' \
  -exec rm -rf {} + 2>/dev/null || true
# Recreate the reports root for next run
mkdir -p reports/test-results
echo "Cleaned: reports/test-results/, .pytest_cache/, htmlcov/, .coverage*, __pycache__/ (excluding .venv, node_modules)"
echo "Preserved: .hypothesis/ (counterexample DB), .mypy_cache, .ruff_cache (use 'mise run clean' for those)"
"""

[tasks."test:show"]
description = "Open the most recent HTML test report in the default browser"
run = """
report=$(ls -t reports/test-results/*/report.html 2>/dev/null | head -1)
if [ -z "$report" ]; then
  echo "No HTML report found. Run mise run test:unit (or another test:* task) first." >&2
  exit 1
fi
xdg-open "$report" 2>/dev/null || open "$report"
"""

[tasks."test:summary"]
description = "Print a one-screen text summary of the most recent JSON test report"
run = """
report=$(ls -t reports/test-results/*/report.json 2>/dev/null | head -1)
if [ -z "$report" ]; then
  echo "No JSON report found. Run mise run test:unit first." >&2
  exit 1
fi
uv run python -c "
import json, sys
r = json.load(open('$report'))
s = r.get('summary', {})
print(f\\"Report:   $report\\")
print(f\\"Created:  {r.get('created', 'unknown')}\\")
print(f\\"Duration: {r.get('duration', 0):.2f}s\\")
print(f\\"Exitcode: {r.get('exitcode', '?')}\\")
print(f\\"Counts:   pass={s.get('passed', 0)}  fail={s.get('failed', 0)}  skip={s.get('skipped', 0)}  xfail={s.get('xfailed', 0)}  xpass={s.get('xpassed', 0)}  err={s.get('error', 0)}\\")
fails = [t for t in r.get('tests', []) if t.get('outcome') in ('failed', 'error')]
if fails:
    print(f'\\\\nFailures ({len(fails)}, showing up to 10):')
    for t in fails[:10]:
        print(f\\\"  {t['outcome']:7s} {t['nodeid']}\\\")
"
"""

# =============================================================================
# QA (Namespaced)
# =============================================================================

[tasks."qa:schemas"]
description = "Validate JSON schemas"
run = "uv run python tools/validate_schemas.py"

[tasks."qa:security"]
description = "Run security audit on dependencies"
run = "uv run pip-audit"

[tasks."qa:hexagon-isolation"]
description = "Verify hexagon UI isolation from database layer (SC-002)"
run = "uv run python tools/verify_hexagon_isolation.py --ci"

[tasks."qa:patterns"]
description = "Run semgrep architectural pattern checks (ERROR severity)"
run = "uv run pre-commit run semgrep --all-files"

[tasks."qa:patterns-strict"]
description = "Run semgrep pattern checks (ERROR only, CI mode)"
run = "uv run pre-commit run semgrep --all-files"

[tasks."qa:deps"]
description = "Run dependency audit (security + outdated + dead code)"
run = """
echo "=== Security Scan ==="
uv run pip-audit || true
echo ""
echo "=== Outdated Packages (top 30) ==="
uv pip list --outdated | head -30
echo ""
echo "=== Dead Code Check (confidence >= 80%) ==="
uv run vulture src/babylon --min-confidence 80 | head -20 || true
echo ""
echo "Audit complete. Run quarterly or after major dependency changes."
"""

# =============================================================================
# DEMO (Namespaced)
# =============================================================================

[tasks."data:query"]
description = "Open SQLite CLI for 3NF database"
run = "sqlite3 data/sqlite/marxist-data-3NF.sqlite"

[tasks."data:db-init"]
description = "Initialize SQLite database schema"
run = "uv run python tools/init_db.py"

[tasks."data:bea-load"]
description = "Ingest BEA national I-O tables (spec-068). Years 2010-2024 default."
usage = '''
arg "[years]" help="Year range as START-END" default="2010-2024"
flag "--rollback" help="Truncate fact_bea_* tables to empty pre-spec-068 state"
flag "--dry-run" help="Parse and validate but do not write to DB"
flag "--reload-concordance" help="Force re-population of bridge_naics_bea"
'''
run = """
uv run python tools/load_bea_io.py \\
  --years ${usage_years} \\
  ${usage_rollback:+--rollback} \\
  ${usage_dry_run:+--dry-run} \\
  ${usage_reload_concordance:+--reload-concordance}
"""

[tasks."data:qcew"]
description = "Rebuild fact_qcew_annual 2010-2024 from staged BLS singlefiles with suppression imputation (spec-086)"
usage = '''
arg "[years]" help="Year range as START-END or comma list" default="2010-2024"
flag "--dry-run" help="Full pipeline + validation, no writes"
flag "--apply" help="Staged build + validated atomic swap (keeps __pre_086 backup)"
flag "--restart" help="Drop staging tables + v086 checkpoints before loading"
flag "--rollback-from-backup" help="Restore the __pre_086 tables to canonical"
flag "--drop-backup" help="Remove the __pre_086 backups after verification"
'''
run = """
uv run python -m babylon_data.qcew \\
  --years ${usage_years} \\
  ${usage_dry_run:+--dry-run} \\
  ${usage_apply:+--apply} \\
