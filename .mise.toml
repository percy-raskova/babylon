# Mise Task Runner Configuration for Babylon
# https://mise.jdx.dev/
#
# Task Namespace Convention (ADR035):
#   check         - Non-mutating local gate (hosted static leaves + local contracts + unit tests)
#   ci:*          - Hosted-CI entry points and local runner adapters
#   test:*        - Test runners by scope
#   sim:*         - Simulation execution and analysis
#   tune:*        - Parameter optimization
#   qa:*          - Quality assurance and verification
#   demo:*        - Integration demos and persona testing
#   data:*        - Data pipeline operations
#   docs:*        - Documentation building
#   mutate:*      - Mutation testing
#   midi:*        - Music generation

# The vendored Nix shell currently provides this floor. Hosted CI installs the
# exact current release separately through mise-action.
min_version = "2025.11.7"

[tools]
python = "3.12"
uv = "0.9.8"  # single-lock fork (ADR095 D3, ruling U); uv2nix consumes this same lock

[env]
PYTHONPATH = "src"
BABYLON_ENV = "development"
# Pin BLAS/OpenMP to 1 thread for every mise-run command. The engine's numpy/scipy
# economics spawns one OpenBLAS thread PER CORE (24 here) per process by default;
# under xdist / parallel runs that nested process x BLAS parallelism thrashed the
# box until the desktop froze (2026-07-12). xdist supplies the parallelism; nested
# BLAS threads are pure harm. Also removes non-deterministic FP reduction order
# (Constitution III.7). tests/conftest.py enforces the same for raw `uv run`.
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"
# W1.8: rustworkx centrality parallelizes via rayon above parallel_threshold
# (50 nodes) — same oversubscription hazard + parallel float-summation order
# (Constitution III.7). Rayon reads this once at pool init.
RAYON_NUM_THREADS = "1"
# Agent ergonomics: uncolored tool output (kills ANSI-strip pipelines)
NO_COLOR = "1"
# PER-286 replaces the old cross-repository sccache directory with the
# versioned PATH dispatcher in `.codex/host`. The dispatcher owns
# repository-local target/build roots and cache directory/socket. Four jobs
# remains the exact defense-in-depth ceiling for ordinary clones that have not
# installed the Codex dispatcher; managed Cargo accepts but cannot raise it.
CARGO_BUILD_JOBS = "4"
# Soundfont for MIDI conversion
SOUNDFONT = "/usr/share/sounds/sf2/FluidR3_GM.sf2"
MUSIC_DIR = "assets/music"
AUDIO_OUTPUT_DIR = "assets/audio"

# =============================================================================
# INSTALLATION
# =============================================================================

[tasks."nix"]
description = "Run any command inside the vendored devshell and pass through trust for this already-trusted project root, including nested mise tasks."
# Force Git's tracked-files accessor. Older Nix installations can classify a
# linked worktree's .git file as path:, copying untracked rust/target into the
# store before the flake fileset can filter it.
run = 'MISE_TRUSTED_CONFIG_PATHS="${MISE_PROJECT_ROOT:-$PWD}" nix develop "git+file://${MISE_PROJECT_ROOT:-$PWD}" --command'

[tasks."pr:merge"]
description = "the ONE sanctioned merge path: all-green + head-pin + Copilot advisory + unresolved review thread block + zero alert floor + stacked-PR guard"
run = "python3 tools/pr_merge.py"

[tasks."check:worktree-contract"]
description = "worktree contract (ADR181 R9c): venv interpreter pin, ops extra, data/ symlinks, .env, uv.lock unmodified"
run = "python3 tools/check_worktree_contract.py"

[tasks."check:env-contract"]
description = "devshell environment contract: no PYTHONPATH leaks from python-built packages (default/dataBuild)"
run = """
#!/usr/bin/env bash
set -euo pipefail
# The devshells provide TOOLS, not python imports: nixpkgs' python setup
# hooks export tool site-packages onto PYTHONPATH, shadowing the repo venv
# (git-hook mypy crash, 2026-07-20 — the `env -u PYTHONPATH git` era). Each
# shellHook unsets it; this proves the contract for every shell the flake
# exports. Workstation-run (shells are realized here); run after any flake
# edit.
for shell in default dataBuild; do
  # shellHooks echo greetings to stdout — extract the marker-delimited
  # value instead of trusting raw captured output.
  raw="$(nix develop "${MISE_PROJECT_ROOT:-$PWD}#${shell}" --command bash -c 'printf "PYPC<[%s]>PYPC" "${PYTHONPATH:-}"')"
  leaked="$(printf '%s' "$raw" | sed -n 's/.*PYPC<\\[\\(.*\\)\\]>PYPC.*/\\1/p')"
  if [ -n "$leaked" ]; then
    echo "env-contract: ${shell} devshell leaks PYTHONPATH:" >&2
    printf '%s\\n' "$leaked" | tr ':' '\\n' | sed 's/^/  /' >&2
    exit 1
  fi
  echo "env-contract: ${shell} clean"
done
"""

[tasks.install]
description = "Install all dependencies (from the committed lock — see deps:lock to re-resolve)"
# --frozen: install exactly uv.lock, never re-resolve. Changing dependencies?
# Edit pyproject.toml, then regenerate uv.lock with the pinned uv toolchain.
# Amendment AF (ADR186) deleted the babylon-tui wheel from the default
# dependency set — this sync no longer needs cargo/rustc on PATH.
run = "uv sync --extra ops --frozen"

[tasks.setup]
description = "One-shot bootstrap for a fresh clone: toolchain + deps + hooks + tuned PostgreSQL 17 + canonical schema (spec-087 FR-008)"
run = """
set -e
mise install
uv sync --extra ops --frozen
uv run pre-commit install --hook-type commit-msg --hook-type pre-commit --hook-type pre-push
mise run db:up
(cd rust && CARGO_BUILD_JOBS=4 cargo build -p babylon-persistence --bin babylon-runtime --locked)
export PATH="$PWD/rust/target/debug:$PATH"
BABYLON_RUNTIME_DSN="host=127.0.0.1 port=5433 dbname=babylon_test user=test password=test" babylon-runtime bootstrap
if [ ! -f data/sqlite/marxist-data-3NF.sqlite ]; then
  echo "WARN: reference DB missing at data/sqlite/marxist-data-3NF.sqlite"
  echo "      (reference-data tooling needs it; see project/04-data-program-098.md)"
fi
echo ""
echo "Setup complete. Smoke-test with: mise run test:int-pg"
"""

