[tasks."rust:check-no-docs"]
description = "Canonical Rust gate: format, all-target Clippy, one reported test pass, doctests and BSL sentinels. Full workspace tests by default; --dev selects the inexpensive suites and current integration boundaries. Sequential; no documentation generation."
usage = 'flag "--dev" help="Select dev integration contracts; full workspace tests are the default"'
dir = "rust"
run = """
set -e
cargo fmt --all -- --check
# cognitive_complexity (threshold owned in rust/clippy.toml, Director ruling
# 2026-08-15) is the Rust radon-equivalent: denied workspace-wide here. The
# six formerly scoped pedantic packages inherit workspace lint policy from
# their manifests, so this single pass preserves that package boundary.
cargo clippy --workspace --all-targets --locked -- -D warnings -D clippy::cognitive_complexity
# nextest owns ordinary test execution and stable JUnit. It cannot execute
# doctests, so the following Cargo leg is a distinct compile-fail/doc contract,
# not a duplicate package test pass.
set --
if [ "${usage_dev:-false}" = true ]; then
  set -- --dev
fi
python3 ../tools/rust_test_report.py run --profile ci --workspace "$@"
cargo test --workspace --doc --locked
# Explicit non-Clippy/test exception: bsl-lint checks repository relationships
# (frozen citations, namespaces, authority, and non-authorability) that Cargo's
# workspace compilation cannot express.
cargo run -p bsl-lint --locked -- all
"""

