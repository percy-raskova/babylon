# Development-only Python analysis of the frozen reference engine. These tasks
# are not game-state authority and are not packaged in the Babylon wheel.

["reference:python-smoke"]
description = "Frozen Python reference-engine one-tick smoke test"
run = "uv run python -m babylon"

["analysis:sweep"]
description = "Run a bounded one-dimensional parameter sweep"
usage = 'arg "[ticks]" help="Maximum ticks per trial" default="5200"'
run = """
mkdir -p results
uv run python -m tools.devtools.sim_analysis sweep \
  --param "economy.extraction_efficiency=0.05:0.50:0.05" \
  --max-ticks ${usage_ticks} \
  --output-csv results/sweep.csv --report
"""

["analysis:sweep-custom"]
description = "Run the parameter sweep with a custom extraction-efficiency range"
usage = '''
arg "[start]" help="Range start" default="0.05"
arg "[end]" help="Range end" default="0.50"
arg "[step]" help="Range step" default="0.05"
'''
run = 'uv run python -m tools.devtools.sim_analysis sweep --param "economy.extraction_efficiency=${usage_start}:${usage_end}:${usage_step}" --report'

["analysis:landscape"]
description = "Run a bounded two-dimensional parameter grid"
usage = '''
arg "[param1]" help="First parameter path" default="economy.extraction_efficiency"
arg "[range1]" help="Range as start:end:step" default="0.1:0.9:0.1"
arg "[param2]" help="Second parameter path" default="economy.comprador_cut"
arg "[range2]" help="Range as start:end:step" default="0.5:1.0:0.1"
arg "[ticks]" help="Maximum ticks per trial" default="5200"
'''
run = """
mkdir -p results
uv run python -m tools.devtools.sim_analysis sweep \
  --param "${usage_param1}=${usage_range1}" \
  --param2 "${usage_param2}=${usage_range2}" \
  --max-ticks ${usage_ticks} \
  --output-csv results/landscape.csv
"""

["analysis:monte-carlo"]
description = "Run bounded Monte Carlo uncertainty analysis"
usage = '''
arg "[samples]" help="Number of samples" default="100"
arg "[seed]" help="Random seed (optional)"
'''
run = """
mkdir -p results
uv run python -m tools.devtools.sim_analysis monte-carlo \
  --n-samples ${usage_samples} \
  ${usage_seed:+--seed ${usage_seed}} \
  --csv-path results/monte_carlo.csv
"""

["analysis:optuna"]
description = "Run Carceral Equilibrium optimization with Optuna TPE"
usage = '''
arg "[trials]" help="Number of optimization trials (maximum 384 at the fixed 5200-tick horizon)" default="100"
arg "[name]" help="Study name for resumption" default="babylon_carceral"
'''
run = """
uv run python -m tools.devtools.sim_analysis bayesian \
  --n-trials ${usage_trials} \
  --study-name ${usage_name} \
  --storage sqlite:///optuna.db
"""

["analysis:dashboard"]
description = "Launch the Optuna Dashboard for a local SQLite study, including a campaign study.sqlite3"
usage = 'arg "[database]" help="Local SQLite database path" default="optuna.db"'
run = 'uv run optuna-dashboard "sqlite:///${usage_database}"'

["analysis:campaign"]
description = "Generate a bounded, non-authoritative frozen-Python reference-analysis report"
usage = 'arg "[profile]" help="Exact workload profile: weekly or full" default="weekly"'
run = 'uv run python -m tools.devtools.reference_analysis_campaign --profile "${usage_profile}"'

["analysis:sensitivity"]
description = "Screen 8 curated parameters with Morris, then run Sobol on its top 4"
usage = '''
arg "[trajectories]" help="Morris trajectories (minimum 2, maximum 64)" default="8"
arg "[samples]" help="Sobol base samples (bounded by total workload)" default="64"
arg "[ticks]" help="Maximum ticks per trial (maximum 5200)" default="2600"
arg "[parameters]" help="Comma-separated parameter paths (maximum 16)" default="economy.base_subsistence,economy.extraction_efficiency,economy.comprador_cut,economy.super_wage_rate,economy.trpf_coefficient,consciousness.sensitivity,solidarity.scaling_factor,carceral.enforcer_fraction"
'''
run = """
mkdir -p results
uv run python -m tools.devtools.sim_analysis sensitivity --method both \
  --param-names "${usage_parameters}" \
  --trajectories ${usage_trajectories} --samples ${usage_samples} \
  --max-ticks ${usage_ticks} --output-dir results
"""

["analysis:morris"]
description = "Run bounded Morris screening over an explicit parameter subset"
usage = '''
arg "[trajectories]" help="Number of trajectories (minimum 2, maximum 64)" default="8"
arg "[ticks]" help="Maximum ticks per trial (maximum 5200)" default="2600"
arg "[parameters]" help="Comma-separated parameter paths (maximum 16)" default="economy.base_subsistence,economy.extraction_efficiency,economy.comprador_cut,economy.super_wage_rate,economy.trpf_coefficient,consciousness.sensitivity,solidarity.scaling_factor,carceral.enforcer_fraction"
'''
run = """
mkdir -p results
uv run python -m tools.devtools.sim_analysis sensitivity --method morris \
  --param-names "${usage_parameters}" \
  --trajectories ${usage_trajectories} --max-ticks ${usage_ticks} \
  --morris-output results/morris.json
"""

["analysis:sobol"]
description = "Run bounded Sobol decomposition over an explicit parameter subset"
usage = '''
arg "[samples]" help="Base sample size (bounded by total workload)" default="64"
arg "[ticks]" help="Maximum ticks per trial (maximum 5200)" default="2600"
arg "[parameters]" help="Comma-separated parameter paths (maximum 16)" default="economy.base_subsistence,economy.extraction_efficiency,economy.comprador_cut,economy.super_wage_rate,economy.trpf_coefficient,consciousness.sensitivity,solidarity.scaling_factor,carceral.enforcer_fraction"
'''
run = """
mkdir -p results
uv run python -m tools.devtools.sim_analysis sensitivity --method sobol \
  --param-names "${usage_parameters}" \
  --samples ${usage_samples} --max-ticks ${usage_ticks} \
  --sobol-output results/sobol.json
"""

["analysis:test"]
description = "Run focused behavioral contracts for the dev-only analysis suite"
run = "uv run pytest tests/unit/tools/sim_analysis -q"
