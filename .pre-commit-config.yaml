# Pre-commit hooks for Babylon
# Install: mise run hooks
# Run manually: uv run pre-commit run --all-files

minimum_pre_commit_version: "4.6.2"
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  # ==========================================================================
  # WORKTREE ENVIRONMENT CONTRACT - first and fail_fast: verify the pinned
  # interpreter, staged dependency inputs and resolved lock before other hooks.
  # Dataset and operator prerequisites belong to the tools that consume them.
  # ==========================================================================
  - repo: local
    hooks:
      - id: worktree-contract
        name: worktree environment contract
        entry: python3 tools/check_worktree_contract.py
        language: system
        pass_filenames: false
        always_run: true
        fail_fast: true

  # Keep path filters honest. These meta hooks would have rejected the four
  # dead src/frontend hooks left behind by the Bevy cutover.
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

  # ==========================================================================
  # RUFF - Linting and Formatting
  # ==========================================================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep the commit hook on the same patch release as the uv-locked CI tool.
    rev: v0.16.6
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
        # Policy v11 is an immutable cross-repository byte contract. Its exact
        # inventory, hashes, syntax, and behavior have their own executable law.
        exclude: ^\.codex/host/
      - id: ruff-format
        name: ruff (format)
        exclude: ^\.codex/host/

  # ==========================================================================
  # MYPY - Type Checking
  # ==========================================================================
  - repo: local
    hooks:
      - id: mypy
        name: mypy (typecheck, CI parity)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: '^(src/.*\.py|pyproject\.toml)$'

  # ==========================================================================
  # SEMGREP - Architectural Pattern Enforcement
  # ==========================================================================
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.165.0
    hooks:
      - id: semgrep
        name: semgrep (patterns)
        args: [--config, .semgrep.yml, --severity, ERROR, --error, --quiet, src/]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # R9a (ADR181): the wall-clock-test ban lives in its own config so the
      # architectural rules above never start matching tests/ by accident.
      - id: semgrep
        name: semgrep (test-estate process rules)
        args: [--config, .semgrep-tests.yml, --severity, ERROR, --error, --quiet, tests/]
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ==========================================================================
  # RUST - the engine estate (Amendment AE). Dev CI and ordinary pre-push use
  # rust:check-no-docs --dev; full release CI uses ci:rust. Pre-push stops before Rustdoc because
  # repository law prohibits local documentation generation. fmt runs at
  # commit time on staged Rust source or formatter/toolchain policy. At
  # pre-push, pre-commit supplies the exact remote..local refs. Its filename
  # classifier removes deleted paths, so the range runner re-diffs those refs
  # and keeps deletions without another fetch or a dev-specific merge-base
  # guess. Both modes retain all-target Clippy, doctests and repository sentinels.
  # Dev selects integration targets; full release CI adds all tests and Rustdoc.
  # ==========================================================================
  - repo: local
    hooks:
      - id: rust-fmt-check
        name: cargo fmt --check (Rust source and formatting policy)
        entry: bash -c 'cd rust && cargo fmt --all -- --check'
        language: system
        pass_filenames: false
        files: '^(rust/.*\.rs|rust/rustfmt\.toml|rust/rust-toolchain\.toml)$'

      - id: rust-dev-gate
        name: rust:check-no-docs --dev (local Rust dev gate, pre-push)
        entry: python3 tools/run_pre_push_gate.py rust-dev-gate
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # bsl-lint also owns two repository relationships outside rust/: ADR
      # namespace uniqueness and the exact retired Python authority paths.
      # Rust changes already select rust-dev-gate, so this lighter hook covers
      # only those non-Rust inputs without duplicating the Cargo gate.
      - id: bsl-repo-sentinels
        name: bsl-lint repository sentinels (non-Rust inputs, pre-push)
        entry: python3 tools/run_pre_push_gate.py bsl-repo-sentinels
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ==========================================================================
  # COMMITIZEN - Conventional Commits
  # ==========================================================================
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        name: commitizen (commit message)
        stages: [commit-msg]

  # ==========================================================================
  # BASELINE CEREMONY - §6.5 Provenance & Ceremony (owner ruling 2026-07-20)
  # Commits touching tests/baselines/** must declare their ceremony with a
  # `Baselines: blessed(<slug>)` trailer. The commit-msg leg is best-effort
  # (an --amend or pathspec commit can slip past it, since it only inspects
  # the index at commit time). The pre-push leg below closes that gap
  # locally by re-running the CHECKER'S OWN --range MODE against the
  # upstream ref, mirroring the CI ceremony-gate job (which diffs the PR's
  # base..head) so a slipped amend is caught before it ever leaves the box —
  # not a substitute for the CI leg, which stays authoritative.
  # ==========================================================================
  - repo: local
    hooks:
      - id: baseline-ceremony
        name: baseline ceremony declaration (§6.5)
        entry: python3 tools/check_baseline_ceremony.py --commit-msg-file
        language: system
        always_run: true
        stages: [commit-msg]

      - id: baseline-ceremony-range
        name: baseline ceremony range check (§6.5, pre-push CI mirror)
        entry: >-
          bash -c 'set -euo pipefail;
          git fetch -q origin dev 2>/dev/null || true;
          base="$(git merge-base HEAD origin/dev 2>/dev/null || git merge-base HEAD dev 2>/dev/null || echo "")";
          if [ -z "$base" ]; then exit 0; fi;
          python3 tools/check_baseline_ceremony.py --range "${base}..HEAD"'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

  # ==========================================================================
  # GENERAL HYGIENE
  # ==========================================================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        # tests/**/__snapshots__/**/*.raw: pytest-textual-snapshot goldens are
        # Rich-exported SVG (ADR097/ADR099 snapshot lanes, III.13 determinism).
        # Rich's own SVG template bakes in a fixed blank-with-spaces line (the
        # title-bar gap) that is identical on every render — trimming it in the
        # committed golden desyncs it from the live re-render `snap_compare`
        # always produces, permanently red-gating the test (discovered
        # independently by WO-16, WO-17, AND the ADR097 render seam; the
        # pre-existing county golden has this same untrimmed line, silently
        # relying on no hook having touched it since P1 keel). Broadest variant
        # kept at the Wave-1 merge: integration-tier goldens live under
        # tests/integration/**/__snapshots__/ too. Excluded, not fixed: these
        # are generated artifacts, not hand-authored text.
        #
        # rust/crates/babylon-md/: the vendored tui-markdown fork (ADR150) —
        # upstream's bytes carry trailing whitespace, including inside insta
        # .snap goldens where trimming desyncs the byte-exact match (same
        # failure class as the .raw goldens above). The fork's diff-vs-upstream
        # must stay the two declared patches, not a whitespace normalization.
        # openwiki/: generated by the OpenWiki engine (hand-editing prohibited,
        # CLAUDE.md) — normalizing its bytes makes every daily regen PR fight
        # this hook.
        # reports/ is historical evidence and is not normalized in place.
        exclude: ^(tests/.*/__snapshots__/.*\.raw$|rust/crates/babylon-md/|openwiki/|reports/)
      - id: end-of-file-fixer
        # Same vendored-fork + generated-openwiki rationale as above. The two
        # legacy vectors are NUL-framed byte contracts; appending a text newline
        # changes their digest and makes the Python source-drift guard fail.
        # Agent and host bundles are provider-managed, mounted read-only in
        # governed worktrees, and validated by their own executable contracts.
        exclude: ^(\.agents/|\.codex/|rust/crates/babylon-md/|openwiki/|reports/|rust/crates/babylon-persistence/tests/fixtures/legacy_(schema_ddl_v1|migrations_0010_0044_v1)\.bin$)
      - id: check-yaml
        args: [--unsafe]  # Allow custom tags in GitHub Actions
      - id: check-json
        # These paths are tracked Git LFS pointers in an ordinary checkout, not
        # materialized JSON. lfs-pointer-check owns their integrity pre-push.
        exclude: ^\.understand-anything/(fingerprints|knowledge-graph)\.json$
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1024']
        # uv.lock: single-lock fork (ADR095 D3) — uv's lock format embeds wheel
        # hashes per-platform (301 resolved packages), landing ~1030 KB, just over
        # the 1024 KB gate; poetry.lock was ~808 KB for the same dependency set.
        # Generated + regenerated by `uv lock`, never hand-edited.
        # county_atlas.bin: the Program 28 B1 county map — Amendment AF ships a
        # pure Rust binary, so the geometry has to arrive as a committed asset.
        # 1.64 MB of 3,222 quantized TIGER 2024 counties + CSR adjacency, budget
        # recorded in tools/build_county_atlas.py, regenerable via
        # `mise run data:county-atlas`; the Bevy client include_bytes!s it, so an
        # LFS pointer would hand the reader 130 bytes of text where it expects
        # geometry.
        # The two embedded theme renders keep a separate 2 MiB check below.
        # Their exact source, render recipe and bytes are pinned in
        # assets/audio-renders.json; this changes no licensing decision.
        # The other 34 authored music tracks have their own exact-path 12 MiB
        # check. The longest MIDI lasts 435.337 seconds; at the existing Phi
        # render rate it would need about 8.23 MB before musical density varies.
        # The captured statewide road paths are 1.18 MB compressed (6.26 MB
        # decoded). New Campaign needs their pinned bytes without an external
        # network fetch. The same 2 MiB publication bound below covers this
        # named artifact; the source manifest and runtime also verify its hash
        # and decoded-content bound.
        exclude: ^tests/baselines/.*\.json$|^src/babylon/data/game/balkanization/seed_influences\.json$|^uv\.lock$|^assets/map/county_atlas\.bin$|^assets/music/babylon_theme_(phi|panopticon)\.ogg$|^content/scenarios/michigan/statewide-physical\.json\.gz$|^assets/music/(?:ambient/01_history_breathing|crisis/(?:01_wages_falling|02_the_squeeze|03_material_disruption)|endgame/(?:01_red_dawn|02_the_long_winter|03_iron_consolidation|04_dual_power|05_shattered_map)|entity/(?:01_beast_engine|02_tribute_bleed|03_dissection|04_the_mask)|fascist/(?:01_the_void|02_scapegoat|03_the_rally|04_blood_and_soil|05_the_purge|06_false_order|07_the_apparatus|08_economic_crisis|09_juggling_act)|periphery/(?:01_unequal_exchange|02_superwage)|revolutionary/(?:01_the_spark|02_solidarity_rising|03_class_awakening|04_the_internationale|05_rupture)|rift/(?:01_overshoot|02_the_silent_spring)|superstructure/(?:01_the_ballot|02_the_reform_ceiling|03_officeholder))\.ogg$
      - id: check-added-large-files
        name: check bounded game assets (2 MiB per named artifact)
        args: ['--maxkb=2048', '--enforce-all']
        files: ^assets/music/babylon_theme_(phi|panopticon)\.ogg$|^content/scenarios/michigan/statewide-physical\.json\.gz$
      - id: check-added-large-files
        name: check authored soundtrack renders (12 MiB per named track)
        args: ['--maxkb=12288', '--enforce-all']
        files: ^assets/music/(?:ambient/01_history_breathing|crisis/(?:01_wages_falling|02_the_squeeze|03_material_disruption)|endgame/(?:01_red_dawn|02_the_long_winter|03_iron_consolidation|04_dual_power|05_shattered_map)|entity/(?:01_beast_engine|02_tribute_bleed|03_dissection|04_the_mask)|fascist/(?:01_the_void|02_scapegoat|03_the_rally|04_blood_and_soil|05_the_purge|06_false_order|07_the_apparatus|08_economic_crisis|09_juggling_act)|periphery/(?:01_unequal_exchange|02_superwage)|revolutionary/(?:01_the_spark|02_solidarity_rising|03_class_awakening|04_the_internationale|05_rupture)|rift/(?:01_overshoot|02_the_silent_spring)|superstructure/(?:01_the_ballot|02_the_reform_ceiling|03_officeholder))\.ogg$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: forbid-new-submodules
        # There is intentionally no current gitlink for check-hooks-apply to
        # match; run the cheap guard so the first attempted one is refused.
        always_run: true
      - id: no-commit-to-branch
        args: [--branch, main, --branch, dev]

  # ==========================================================================
  # SECRETS - Gitleaks
  # ==========================================================================
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # ==========================================================================
  # YAML LINTING - Advanced YAML validation
  # ==========================================================================
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        name: yamllint (yaml lint)
        args: [-c, .yamllint.yaml]

  # ==========================================================================
  # DOCUMENTATION LINTING - RST and Markdown
  # ==========================================================================
  - repo: https://github.com/rstcheck/rstcheck
    rev: v6.2.5
    hooks:
      - id: rstcheck
        name: rstcheck (rst syntax)
        additional_dependencies:
          - rstcheck[sphinx,toml]
        args: [--config, pyproject.toml]

  - repo: https://github.com/PyCQA/doc8
    rev: v2.0.0
    hooks:
      - id: doc8
        name: doc8 (rst style)

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: markdownlint (md lint)
        args: [--config, .markdownlint.yaml]
        exclude: |
          (?x)^(
            \.serena/.*|
            \.specify/.*|
            specs/.*|
            openwiki/.*|
            design/mockups/SKILL\.md|
            CONSTITUTION\.md
          )$

  # ==========================================================================
  # WORKFLOW / SHELL / DOCKER LINTING
  # ==========================================================================
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        files: '\.sh$'
        # Policy v11 is an immutable cross-repository byte contract. Its exact
        # inventory and hashes, POSIX syntax, and executable behavior are
        # enforced by test_rust_host_policy_contract.py. The Spec Kit shell
        # bundle is integration-managed and recorded in its manifest; audit it
        # when its provider is updated, not as Babylon-owned shell.
        exclude: '^(\.codex/host/|\.specify/scripts/bash/)'

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint-docker
        files: 'Dockerfile'
        # Same threshold as CI's hadolint job: warnings visible, errors block.
        args: [--failure-threshold, error]

  # ==========================================================================
  # GIT LFS - Pointer integrity (pre-push; catches accidentally-materialized
  # LFS-tracked blobs before they hit the remote)
  # ==========================================================================
  - repo: local
    hooks:
      - id: lfs-pointer-check
        name: git-lfs pointer integrity
        entry: git lfs fsck --pointers
        language: system
        pass_filenames: false
        stages: [pre-push]
