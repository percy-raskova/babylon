        - sequential_rule_execution
        - detached_whole_tick_working_copy
        - buffered_event_publication
        - atomic_audit_receipt_publication
        - tick_increment_after_success
      limitation: >-
        This crate remains database-free and publishes atomically in memory.
        babylon-persistence composes its identified result into the durable
        marker-last transaction and restart boundary.
      evidence:
        - rust/crates/babylon-tick/src/session.rs

    canonical_graph_hash:
