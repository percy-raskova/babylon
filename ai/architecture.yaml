    bsl_pipeline:
      status: implemented_current
      scope:
        - parser
        - vocabulary_and_type_checking
        - evaluator
        - content_digests
        - anchor_validation
        - executable_phase_anchor_total_order
        - pre_hydration_phase_composition
        - mandatory_rule_role_and_evidence
        - governed_production_rule_attribution_manifest
        - restricted_role_effect_authorization
        - rank_aware_same_tick_composition_refusals
        - graph_execution
      execution_truth: >-
        The tick compiles rules onto the governed 34-system causal spine.
        Namespace homes and explicit boundaries determine position; rule-ID
        bytes break same-position ties only. Same-position rules execute
        sequentially and later rules observe earlier working-copy writes. The
        ranked analyzer rejects a non-rule form, an AST/supplied-ID mismatch,
        or a duplicate ID before computing same-tick findings. A
        built-in rule's declared role and evidence must match the independent
        governed production attribution manifest; unknown mod and fixture IDs
        remain self-declared.
        Rules then execute against one detached working graph and buffer events
        plus identity-free event-then-write AuditReceipts. Graph, events, and
        receipts publish only after every rule and both hash boundaries succeed.
      production_attribution:
        manifest: causal_contract::GOVERNED_RULE_ATTRIBUTIONS
        row_type: GovernedRuleAttribution
        row_fields:
          - rule_id
          - role
          - evidence
          - owner
          - date
          - adr
        adr_value: ADR224
        known_id_drift: uncoded_typed_ContractError_GovernedAttributionMismatch
        production_corpus_completeness: ci_exact_set_equality
        unknown_mod_and_fixture_ids: self_declared
      restricted_effect_allowances:
        manifest: causal_contract::GOVERNED_EFFECT_ALLOWANCES
        production_footprint_contract: exact_set_equality_per_non_mechanic_rule
        allowance_keys: unique
        dead_permissions: refused_by_ci_sentinel
      limitation: >-
        ExternalEvent and Intent roles have no governed effect allowances, so
        executable shocks and player intents remain absent until Gates 4 and 5.
        Durable subject-level provenance beyond the committed typed state remains
        part of the Gate 3 decision-loop work.
      absent_from_current_content:
        - executable_shocks
        - executable_player_actions
      evidence:
        - rust/crates/babylon-bsl/src/lib.rs
        - rust/crates/babylon-bsl/src/causal_contract.rs
        - rust/crates/babylon-tick/src/lib.rs

    rust_tick_session:
