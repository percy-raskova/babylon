ADR160_p26_international_trade_charter:
  status: "accepted"
  date: "2026-07-27"
  title: >
    Program 26 — International Trade: charter (Director reopening 2026-07-27).
    Supersedes the 2026-07-20 deferral whose preconditions were already satisfied
    (Vol I + Vol II merged 2026-07-21 via the five-lane cascade; Vol III 2026-07-19;
    ADR090/ADR098 landed) — only the "kickoff proposal to the owner" step remained,
    and the Director's directive IS that kickoff.
  context: |
    Audit of record (three read-only agents, 2026-07-27, tree 56d34bd3):
    spec-101's trade activation is live ONLY on the headless-runner batch path —
    game/session.py (the playable Archive campaign) seeds no external nodes, never
    populates the four phi-distribution TickContext keys (silent no-op), runs the
    spec-057 Leontief pipeline as a zero stub (no ServiceContainer overrides), and
