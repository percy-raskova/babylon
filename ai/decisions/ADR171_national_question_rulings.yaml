  decision: |
    The Director ruled the four governing questions (2026-07-28):
    - OQ0 TERRITORY: the MIM + MLP side IS the line — the oppressed
      nations are real and NON-CONTIGUOUS; incidence is people-attached;
      the map's center of gravity is the urban mass. CAP/Haywood/
      Comintern territorial nationhood is carried as historical record,
      not as the operative partition.
    - OQ1 PARTITION (was blocking): B + C + I named nations — Black +
      Chicano + Indigenous, matching MIM's and ERoL's named nations and
      the live COLONIAL_AXIS CommunityTypes — with a DECLARED overlap
      policy: per-pole counts sum as published by the census race
      iterations; the intersection double-count is measured where
      computable and DISCLOSED in the artifact metadata, never silently
      netted. The T-H racial residual is demoted to instrument
      validation only (MIM's own "not a 'race'" sentence).
    - OQ10 RENDERING: E (extensive deprivation mass, persons) is the
      PRIMARY channel — the nation where it lives now; Lambda
      (per-capita intensity) is the toggled secondary; the bribe
      channel Omega-hat ships alongside (without it the lens is a
      poverty map any liberal could read); the legend states which
      question each channel answers.
    - EXECUTION: Phase 0 + Phase 1 authorized. Phase 0 = the per-county
      x pole incidence artifact + data program (FIPS vintage crosswalk
      for the 13 recoverable absences — Pine Ridge's total absence
      stays declared; small-count damping law; ACS-suppression policy;
      zero-denominator ABSENCE law — 0.0 on a diverging ramp is a
      fabricated data point; ratio-of-sums law; the artifact declared a
      SECOND-ORDER product with its own disposition, resolving the
      ADR098 circularity explicitly). Phase 1 = the M5 map surface
      carries the axis as a DECLARED STATIC REFERENCE OVERLAY entered
      by contract amendment (never a fourth lens — the lens enum is
      closed; the overlay is labelled a reference layer per Amendment
      V/II.8 because it is identical at tick 1 and tick 520 until the
      engine transport exists).
    Defaults taken on the remaining open questions (conservative,
    Director-overridable, full text in the proposal SS5): OQ2 the H
    settler reference stands with an ADR167-class proxy disclosure;
    OQ3 flat 0/1 nation weights (no domestic outflow series exists —
    w_dom is a data-acquisition question); OQ4 Puerto Rico as a
