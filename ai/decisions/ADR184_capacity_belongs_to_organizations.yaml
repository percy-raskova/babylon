ADR184_capacity_belongs_to_organizations:
  status: "accepted"
  date: "2026-07-30"
  title: >
    Capacity belongs to organizations. Repression and revolutionary action are
    the SAME allocation under different budgets; the class difference lives
    entirely in replenishment. StateFinance and RevolutionaryFinance are one
    construct under two names and do not both survive the port.
  context: |
    Lane A's heat reformulation (ADR180 R3-R7, reports/heat-system-dossier.md
    §5.1) split the indicted [0,1] heat scalar into L (the state's dossier),
    K (capacity) and X (derived exposure). K shipped 2026-07-30 as
    rust/crates/babylon-graph/src/capacity.rs and merged in PR #454.

    As shipped, K had no owner. `Capacity` was a bare
    `BTreeMap<String, u64>` of instrument budgets; the module doc said "the
    state" eleven times; and `Candidate` carried `instrument`, `mode`,
    `target`, `expected_yield`, `cost` — a target and NO ACTOR. An action
    aimed at someone, proposed by nobody.

    The Director put the question directly ("Capacity belongs to Organizations
    right?") and confirmed the ruling the same session.

    Three facts made the answer unambiguous, all verified before ruling:

    (1) "The state" IS NOT A NODE TYPE. models/enums/topology.py's NodeType
        vocabulary has ORGANIZATION ("a collective actor that observes and
        acts" — what OODA runs over), INSTITUTION ("a durable apparatus
        housing organizations") and SOVEREIGN ("a political authority claiming
        territories"). A budget owned by "the state" is owned by nothing that
        exists in the ontology.

    (2) THE FROZEN ENGINE ALREADY BUILT THE SAME CONSTRUCT TWICE.
        models/entities/state_finance.py:      treasury / police_budget +
          social_reproduction_budget / tax_rate + tribute_income / debt_level
        models/entities/revolutionary_finance.py: war_chest / operational_burn
          / dues_income + expropriation_income + donor_income / (no debt)
        Same shape — a stock, a per-tick spend, replenishment sources — under
        two vocabularies. models/entities/organization.py already carries
        `budget: Currency` (:164), `violence_capacity` (:298) and
        `surveillance_capacity` (:302).

    (3) ADR180 DID NOT PIN OWNERSHIP. Its rulings speak of the L/K/X split and
        of organizational structure; nothing in it assigns K to a state actor.
        This ADR fills a gap rather than amending a ratified decision.

  decision: |
    R1. CAPACITY BELONGS TO ORGANIZATIONS. `Capacity` carries an `owner:
        NodeId` and has no `Default` — an unowned budget is the error this
        ADR removes, so the type must not be constructible without an owner.

    R2. A CANDIDATE HAS AN ACTOR. `Candidate.actor: NodeId` names the
        organization proposing the action, whose budget pays and over whose
        Dossier the yield was computed. `Capacity::allocate` REJECTS a
        candidate whose actor is not the owner (loud GraphError, III.11) —
        never silently funds another organization's action from this pool.

    R3. REPRESSION AND REVOLUTIONARY ACTION ARE THE SAME ALLOCATION. A union
        local and a political police force both rank what they could do by
        yield per unit spent and fund down the list until the money runs out.
        Neither side gets a privileged mechanic. The allocator cannot tell a
        police budget from a strike fund, and that is the point — pinned by
        `the_same_allocation_serves_a_movement_and_a_police_force`.

    R4. THE CLASS DIFFERENCE LIVES IN REPLENISHMENT, NOT IN ALLOCATION. Tax
        and tribute on one side, dues and expropriation on the other. The
        historical asymmetry between a state and a movement is the SIZE of
        the budget and the RELIABILITY of its sources — never a special rule
        in the ranking.

    R5. Φ MAY FUND CAPACITY (currency -> currency). The heat dossier §6 risk 1
        and the 2026-07-30 design dossier's emergence audit (item 8) PROHIBIT
        coupling imperial rent to `expected_yield`: bridging currency-per-
        labour-hour to a dimensionless component fraction needs a conversion
        nobody can derive. That prohibition STANDS. But StateFinance's
        `tribute_income` is documented as "Imperial rent from CLIENT_STATE
        relationships" — Φ -> REPLENISHMENT is currency to currency, needs no
        conversion and invents no coefficient. This is the legitimate path
        for the colonial/racial severity gradient the audit had just declared
        mechanism-less, and it exists only because capacity now has an owner
        who can be funded. The Fundamental Theorem does mechanical work:
        imperial rent buys the repressive budget.

    R6. DO NOT TRANSCRIBE `RevolutionaryFinance.heat`. The field ("State
        attention level [0,1]. Higher = more surveillance") is the indicted
        scalar, keyed to the movement's own conduct, sitting on the movement's
        own finance model. It is exactly the object L/K/X replaced. Goes on
        the ai/bsl-architecture-standard.md §5.4 do-not-transcribe list.

    R7. STATEFINANCE AND REVOLUTIONARYFINANCE COLLAPSE TO ONE CONSTRUCT AT
        THE PORT. Per ADR183, the frozen engine is a contract source for
        structure and ordering, not a correctness oracle: it having built the
        construct twice is a defect to repair at the port, not a shape to
        reproduce. §5.4 row.

  consequences: |
    IMMEDIATE (this ADR's PR):
    - Capacity gained `owner` + `owner()`, lost `Default`.
    - Candidate gained `actor`; allocate() gained the owner check.
    - Module doc rewritten off "the state" onto "an actor".
    - Two tests added: an_organization_spends_only_its_own_means,
      the_same_allocation_serves_a_movement_and_a_police_force.
    - Free of cost: the whole Lane A estate still has ZERO external callers,
      so re-homing K broke nothing. Deferring it past first use would not
      have been free.

    OPEN — carried, not closed here:
    - UNIT RECONCILIATION. `Capacity.budgets` is u64 capacity units;
      `Organization.budget` and `tribute_income` are Currency (fixed-point
      i128 micro-units). R5's Φ -> replenishment path needs these to
      reconcile. This is a units question INSIDE one dimension (money), not
      a cross-dimensional conversion — tractable, but it must be decided and
      not assumed, and it sits adjacent to the Director's reserved question
      on whether a measured historical constant may anchor an emergent
      quantity.
    - A DECLINE IS STILL UNOBSERVABLE. babylon-graph depends only on
      babylon-kernel; babylon-bsl depends on babylon-graph. So capacity.rs
      cannot emit into the ADR182 write log without a dependency cycle — and
      a decline is not a mutation, which the write log's own discipline
      excludes independently. Which candidate an actor could NOT afford is
      the mechanism's most important observable and needs its own typed
      return (AllocationOutcome { funded, declined }). Not built here.
    - Does the MOVEMENT get a Dossier too? The anti-omniscience contract is
      stated for the state, and R3's symmetry argument suggests it cuts both
      ways. Not ruled; flagged.

  supersedes: []
  related:
    - ADR180_lane_rulings
    - ADR182_derivation_inspector_rulings
    - ADR183_get_it_right_in_rust
    - ADR172_program_27_refoundation
