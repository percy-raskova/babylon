      behind it FascistFaction / Allegiance / Electoral (ADR202 R6).
      Still held: Contradiction's national-opposition axis (R4 memo
      owed), Community floors + ReserveArmy valve (R2 dedicated rulings
      owed), TickDynamics' reserved trio (R13, next sitting).
    - T7's entire B-construction train unblocks (R18); the (r,l,f) spec
      train charters (R12); the food-security design train charters
      (R11); the .bscn chapter (R22), the T2 `the` widening (R21), and
      the ε-gate micro-train (R23) all start.
    - WS3 stays parked until 13/13 Material Base systems exist as .bsl
      (R14); ai/state.yaml:3660 corrected in this train's commit.
    - Decision memos owed for the NEXT sitting: the chauvinism score
      table (R4), the floor table with provenance (R2), the border-valve
      mechanism spec (R2), TickDynamics' reserved trio posed precisely
      (R13).
    - The Sakai/MIM fascist-base dossier (in flight at
      reports/fascist-base-dossier-2026-08-17.md) is DESIGN INPUT to
      the FascistFaction port and R1's parameter rows — its
      parameterization choices return to the Director as option spaces.
    - Bookkeeping executed with this record: ruling comments on #589,
      #564, #546, #590, #563, #557, #572, #522, #594, #529, #527, #379,
      #382; #566 closed; #335 closed + Bevy-lane re-charter filed; the
