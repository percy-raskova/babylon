ADR210_checkpoint_a_campaign_rulings:
  status: "accepted"
  date: "2026-08-17"
  title: >
    The Checkpoint A campaign rulings — four same-day sittings (the second
    through fifth of 2026-08-17, following ADR208's docket sitting)
    clearing every Director gate on the seven unported Material Base
    systems: the Community floors RE-DERIVE FROM #334 (the incidence
    artifact promoted to the campaign critical path; the five
    "estimated"-provenance rows never transcribe); the ReserveArmy border
    valve HELD OUT of the first landing under a D-record; the TickDynamics
    reserved trio ruled OPTION C (dossier-then-session) and the session
    then HELD SAME DAY over the delivered dossier — the bifurcation
    scalar RETIRED in favor of the ported ternary readout (D1-B, mooting
    D2/D3), the five class shares ruled MEASURED MEMBERSHIPS with the
    percentile-band descriptions dying and bootstraps surviving as seeds
    (D4-B), the ~66 transition-engine coefficients ruled named BSL
    defconsts (D5-C), the Φ→savings→LA-mobility coupling RATIFIED and
    homed in fundamental-theorem.bsl (D6-A), the cascade baseline ruled
    CUMULATIVE on the p7-persist-baselines pattern (D7-A); the STANDING
    THEORY RULING that the revolutionary term's structural zeroing under
    no-SOLIDARITY-seeding is a FEATURE — revolutionary crisis direction is
    EARNED BY ORGANIZING, fascism is the default drift of unorganized
    crisis; the 0.40 LA bootstrap, 5/10/15pp milestones and
    highest-milestone-only semantics CONFIRMED; and #491's three rulings —
    the open top bracket's midratio declared as the cited
    Pareto-consistent conditional mean, the level sets assigned
    (mortality = s_bio, acquiescence = s_bio + s_class, divergence D-row
    owed), κ homed as a .bscn defconst with a DERIVED default.
  context: |
    The Director set the session goal the same morning: Checkpoint A —
    all 13 Material Base systems live as .bsl (definition ruled in
    ADR208 R14; 6/13 ported at goal-set). The campaign's opening wave
    produced the decision memos and dossiers ADR208 had queued, and the
    Director ruled each interactively as it landed — four sittings in
    one sitting-day, the ADR202/ADR208 pattern compressed.

    Sitting 2 (the R2 memos, reports/register-memos/
    r2-floors-and-valve-2026-08-17.md): the 14-row SUBSTRATE_FLOOR_DEFAULTS
    table (models/entities/consciousness.py:356-455) was presented with
    its provenance — five rows (WOMEN, TRANS, DISABLED, QUEER,
    UNDOCUMENTED) carry confidence=LOW with the literal source
    "estimated" — and the hard-ratchet application mechanism
    (formulas/consciousness.py:97-107); the border valve was presented as
    what it is (reserve_army.py:123-147, reserve_ratio *= (1 − border), a
    pure policy-overlay state coupling with no coefficient, carrying two
    blockers of its own beyond #491).

    Sitting 3 (the trio memo, reports/register-memos/
    tickdynamics-reserved-trio-2026-08-17.md): the three reserved
    TickDynamics surfaces posed precisely per ADR208 R13, with the
    engineering half's charter output delivered alongside
    (reports/t6-tickdynamics-dormancy-reread-2026-08-17.md — the
    ServicesProtocol boundary re-counted at 33 fields, all but two typed
    Any; dormancy wiring-driven).

    Sitting 4 (the #491 plan's flags): the rung-ladder build plan
    surfaced OQ-G as the train's one hard stop, the ADR202 R1a rider as
    a genuine theory question ("does the historically-determined social
    component of the value of labour power kill?"), and the design doc's
    κ-home claim as factually wrong (a GameDefines κ moves defines_hash
    and owes a §6.5 ceremony).

    Sitting 5 (the delivered trio dossier,
    reports/tickdynamics-trio-dossier-2026-08-17.md): the first
    read-through of the transition engine's 1,476 lines found NO imposed
    functional forms (ADR172 r5 satisfied as-is) but real findings — the
    frozen scalar IS ADR016 in closed form and the law is already ported
    richer as consciousness/p6-route; the shares are literally percentile
    arithmetic; accumulation applies the savings rate twice (wage·s²);
    the cascade's per-boundary baseline caps decline at ~2.5pp, half the
    smallest milestone. Seven decision surfaces, ruled in two rounds.
  decision: |
    THE RULINGS (Director, sittings 2-5, 2026-08-17; each also posted as
    a ruling comment on its gate issue the same hour).

    R1 (sitting 2, #564 row 13): COMMUNITY FLOORS — RE-DERIVE FROM #334
      FIRST. The frozen floor table does NOT transcribe; the floors enter
      BSL content only re-derived from the #334 per-county × pole
      incidence artifact. Consequences: #334 is on the Checkpoint A
      critical path (its build train chartered the same hour); the floor
      VALUES return to the Director as an option space once computed
      (the plan's T7 memo — noting the artifact reaches 4 of 14
      CommunityTypes and INCARCERATED is unreachable in principle from
      B17001, so the remaining rows will need their own disposition at
      that sitting).

    R2 (sitting 2, #564 row 20): BORDER VALVE — HELD OUT of ReserveArmy's
      first landing. The first reserve_army .bsl ships without the valve
      under a D-record naming its two blockers (no BSL home for the
      untyped policy_overlays side-channel; CLAIMS edge-attr ranking
      reads); a follow-up micro-train wires it when both exist. The
      settler-wing wage bargain's absence is recorded, never silent.

    R3 (sitting 3, #563): THE TRIO — OPTION C, dossier-then-session
      (executed same day as R6-R10 below).

    R4 (sitting 3, STANDING THEORY RULING): the bifurcation score's
      revolutionary-term zeroing under the no-SOLIDARITY-seeding policy
      is a FEATURE — revolutionary crisis direction must be EARNED BY
      ORGANIZING; SOLIDARITY edges exist only when organizing creates
      them in play; fascism is the default drift of unorganized crisis.
      The asymmetry between the (−) solidarity term and the (+) burden
      term is the theory, not a defect.

    R5 (sitting 3, confirmations): the 0.40 LA bootstrap share (the
      starting pedagogy of the dispossession arc), the 5pp/10pp/15pp
      cascade milestones, and highest-milestone-only event semantics are
      all CONFIRMED as intended.

    R6 (sitting 5, dossier D1): THE SCALAR RETIRES (Option B). ADR016's
      law keeps ONE expression — the ported consciousness/p6-route; the
      county bifurcation readout becomes the population-weighted mean of
      (f − r) over the landed ternary. Four defines collapse to one;
      zero intrinsics; zero golden cost. D2 (the node.id/FIPS-disengaged
      legitimation blend) and D3 (the w_s/w_b pair) are MOOT.

    R7 (sitting 5, dossier D4 ★): THE FIVE CLASS SHARES ARE MEASURED
      MEMBERSHIPS (Option B). The percentile-band DESCRIPTIONS (every
      bootstrap value is percentile arithmetic — 0.40 ≡ 0.90 − 0.50) are
      the defect and die; the confirmed bootstrap values survive as
      SEEDS. ADR070's emergent partition remains the post-cutover target
      exactly as previously ruled.

    R8 (sitting 5, dossier D5): the ~66 hardcoded transition-engine
      coefficients port as NAMED BSL DEFCONSTS (Option C) — declared,
      moddable, hash-covered content; no defines.yaml churn; no §6.5
      ceremony.

    R9 (sitting 5, dossier D6): the Φ → savings → LA-mobility coupling
      is RATIFIED as explicit law, homed in fundamental-theorem.bsl,
      with phi_cap promoted to a define. The wage·s² double-application
      defect repairs at the port via the defect ledger (below).

    R10 (sitting 5, dossier D7): the cascade baseline becomes CUMULATIVE
      on the landed p7-persist-baselines pattern, with the divergence
      D-row from the frozen previous-boundary read — the only reading
      under which R5's confirmed constants function (the frozen read's
      per-boundary ceiling is ~2.5pp, proved analytically).

    R11 (sitting 5): the dossier's 14-row defect ledger (incl. the
      wage·s² double savings-rate application, the _normalize
      degenerate branch's bare target/3 constant) disposes AS A CLASS
      per ADR183's repaired-at-the-port doctrine — each repair carries
      its D-row at the TickDynamics landing, no per-defect sitting.

    R12 (sitting 4, #491 OQ-G): the open top bracket's midratio is
      DECLARED as the county-level Pareto-consistent conditional mean
      implied by the ACS aggregate-income tables, published with source
      and derivation — never a fallout of the arithmetic. Discharges the
      build train's one hard stop.

    R13 (sitting 4, ADR202 R1a's rider): LEVEL SETS ASSIGNED — mortality
      reads s_bio (the biological floor kills); acquiescence reads
      s_bio + s_class (compliance buys reproduction at the class's own
      standard). "Two readings" means two genuine level sets. The
      divergence D-row from the frozen s_bio + s_class death threshold
      is owed at the landing (ADR183: the frozen engine is a structure
      contract, not a threshold oracle).

    R14 (sitting 4, #491 κ): κ lives as a .bscn DEFCONST — scenario
      content, no defines_hash movement, no ceremony; its default value
      is DERIVED with the derivation recorded, not picked.
  consequences: |
    - Every one of the seven unported Material Base systems now has a
      cleared or scheduled path: Solidarity + Decomposition/ControlRatio
      ungated (trains staged/running); TickDynamics fully unblocked by
      R3-R11 (port plan commissioned); ReserveArmy unblocked at the
      ruling level by R2/R12-R14 (blocked only on the #491 BUILD, whose
      train is staged); Community blocked on #334 (chartered, running) +
      #576 (staged) + the #536 riders; ImperialRent on #576 with its
      exp/log dependency UNVERIFIED — to be settled at its own train's
      archaeology (it may decouple).
    - The campaign's Director-pending residue: the floor VALUES option
      space (#334 T7); the Solidarity inflate-vs-displace note
      (non-blocking); the fascism-lane 13 questions (gate only the
      faction generalization, never ports).
    - reports/ graduations landing with this record: the trio dossier,
      the T6 dormancy re-read, the trio memo, the R2 floors/valve memo.
    - The retirement of the bifurcation scalar (R6) retires four defines
      with it at the TickDynamics landing; the memberships ruling (R7)
      rewrites the ClassDistribution model's field DESCRIPTIONS, not its
      values; R10 earns its divergence D-row, and NO baseline ceremony is
      EXPECTED — the cascade emits in ZERO committed artifacts, the
      michigan_canada_e2e baseline included (where the transition engine
      IS live) — but that is an expectation, not a law: if R10's landing
      drifts the michigan E2E baseline, the standard §6.5 ceremony
      applies at that landing.
