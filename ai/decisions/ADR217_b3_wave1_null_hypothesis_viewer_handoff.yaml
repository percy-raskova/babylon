    The asymmetry between the two stories' RuledAbsent counts (2/11 for counties vs. 14/29
    for carceral) is itself a finding, not noise: `ui::admin::refresh_admin_panel`'s raw
    `graph.all_attributes()` dump is a genuine fallback home for EVERY `territory/*` field on
    a `MapBinding::Fips` story (it is keyed off `EngineSession::roster`, the FIPS-territory
    roster), so counties' only true gaps are the two `vitality.bsl` fields the death guard
    writes to `social-class/*` nodes the admin dump's territory-keyed fallback cannot reach.
    Carceral has NO equivalent raw-dump fallback — `ui::roster_panel`'s
    `SOCIAL_CLASS_FIELDS`/`INSTITUTION_FIELDS` are curated, fixed lists (§2.11), not a raw
    dump keyed off `EngineSession::full_roster` the way the admin panel is keyed off
    `roster` — so every carceral field the two curated lists omit is a genuine gap with no
    safety net. This is a real, useful wave-2 candidate (a carceral-story raw admin dump),
    named here rather than silently discovered later.

    **11. ADR number verification (this document's own).** The plan's own §9.2 projected
    ADR215 at planning time, explicitly flagged as a projection to VERIFY, not assume, citing
    the known #334 train's then-unpushed ADR214 claim. At this ADR's own landing:
    `origin/dev` (fetched fresh, tip `87d5056a`, 2026-08-18) has merged THROUGH ADR215
    (`ADR214_national_incidence_artifact_train`, `ADR215_entity_voice_suite` both present in
    `origin/dev:ai/decisions/index.yaml`) — this branch's own local `ai/decisions/` still
    tops at ADR213 because this worktree has not merged `dev`'s intervening 30 commits.
    `gh pr list --state open` was checked for every open PR's own diff for a new
    `ai/decisions/ADR2*.yaml` file: PR #672 (`feature/491-language-and-units`, #491 PR A, base
    `dev`) adds `ai/decisions/ADR216_kind_straddle_repair_ceremony.yaml`; PRs #673, #674, #675
    (the #491 stack's PRs B/C and the unrelated #675 sentinels-registry PR) add no ADR files.
    **ADR217 — this document's own number — is therefore the first genuinely-free number**,
    verified against both dev's merged state (tops at 215) and every open PR's own claim
    (216 claimed by #672, unmerged). This numbering-collision lesson is a named failure class
    in this repo (`index.yaml`'s own meta-block ADR108/109 three-way-collision history); this
    ADR's own verification is recorded here so a future reader does not have to re-derive it.
