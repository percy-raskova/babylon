  consequences: |
    - Product decisions now optimize for an emergent, entertaining, expressive
      game while retaining evidence discipline and the reserved theoretical
      line.
    - Historical cases validate causal signatures, heterogeneity, hysteresis,
      and counterfactual response; they no longer demand a reenacted path.
    - Exact action vocabularies, formulas, UI bindings, data catalogs,
      deployment choices, and roadmap order are governed at their natural rate
      of change instead of bloating the Constitution.
    - A player-facing visualization without a DecisionSurfaceContract cannot
      count toward a gameplay milestone. Admin/debug exemptions are explicit
      and visible.
    - Every old dotted citation has an auditable disposition. Historical ADRs
      and documents remain unchanged, and their versioned claims remain true of
      the time at which they were written.
