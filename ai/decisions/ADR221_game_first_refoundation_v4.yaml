ADR221_game_first_refoundation_v4:
  status: "accepted"
  date: "2026-08-22"
  title: "Amendment AH — Game-First Refoundation: Constitution v4.0.0 makes emergent entertainment, expressive player agency, declared design liberties, decision-useful presentation, and behavioral historical benchmarks the governing product law while preserving the complete v3.1/v3.2 transition record"
  context: |
    The v3 Constitution accumulated ten articles, thirty-two registered
    amendments, implementation bindings, content vocabulary, deployment
    details, and a 418-line synchronization report. Its live product promise
    still said collapse was predetermined and historical reproduction was the
    test, even though later decisions had already moved the project toward a
    playable Bevy client, emergent outcomes, and a Rust/BSL engine.

    The Director explicitly ruled that Babylon is an entertainment-first,
    expressive political-economy game. It remains disciplined by evidence and
    revolutionary theory, but it is not a forecast or scientific reproduction.
    Historical cases test causal signatures and counterfactual response; they
    do not supply a script. The same ruling made every player-facing
    visualization answer a decision question and made the semantic Archive part
    of the decision loop.

    Two predecessor snapshots must be preserved. The requested v3.1.0 text is
    Git blob a265b85120ed2a90be40c72e63ee5bf27fc6e703. The immediate v3.2.0
    text, which added Amendment AG, is Git blob
    e905e90d66bddc6e4eca36a3896428f5ce63de5b. Mapping only v3.1 would silently
    erase AG. Amendment AB never existed in the v3.2 registry; its absence is
    historical fact, not an omitted row. Every registered amendment is mapped
    below.

    The immediate v3.2 primitive was `D = (A, Ā, w, T, s)`. Amendment N had
    reserved sigma for its unequal-exchange spectrum and renamed the dialectic's
    sublation predicate to `s`. The Director's v4 ruling restores sigma to the
    dialectic. That is an explicit AH change, not a claim that v3.2 already used
    sigma.
  decision: |
    Amendment AH ratifies Constitution v4.0.0 as eight named articles:
    Purpose and Player Promise; Theoretical Commitments; Emergence and Agency;
    Evidence and Design Liberties; Deterministic Architecture;
    Political-Economy Circuit; Player Knowledge and Presentation; and
    Behavioral Validation and Governance.

    The live Constitution is law, not an encyclopedia. Detailed equations,
    content vocabularies, implementation bindings, deployment choices, and
    work sequencing move to their governed standards, registries, ADRs, and
    roadmap. Re-homed does not mean discarded: the cited destination continues
    the authority at the correct rate of change. Retired means the former rule
    no longer governs. Rewritten means its valid concern survives under a
    materially changed law. Retained means v4 carries the substance directly.

    Amendment AG survives through a rewritten constitutional core and its exact
    recording ADR. Attributed membership remains a first-class, typed,
    hash-covered element, and content may declare instances of the existing
    lattice/adjunction schema while new mathematical kinds stay amendment-gated.
  transition:
    sources:
      v3_1:
        version: "3.1.0"
        blob: "a265b85120ed2a90be40c72e63ee5bf27fc6e703"
        note: "Requested AF-era predecessor snapshot."
      v3_2:
        version: "3.2.0"
        blob: "e905e90d66bddc6e4eca36a3896428f5ce63de5b"
        note: "Immediate predecessor and source of Amendment AG authority."
    citation_resolution:
      dotted_clauses: >
        A pre-AH unversioned dotted-clause citation resolves against the pinned v3.2
        snapshot through transition.clauses.
      named_sections: >
        A pre-AH unversioned named or undotted section citation resolves against the
        pinned v3.2 snapshot through transition.undotted_sections.
      amendments: >
        A pre-AH unversioned amendment citation resolves against the pinned v3.2
        snapshot through transition.amendments. Amendment AB has no row because it
        was never registered.
      post_ah: >
        Post-AH living authority cites a named v4 article or an exact governed
        destination from its transition row. A versioned historical citation keeps
        its stated version; no reader invents a decimal translation.
    primitive_notation:
      v3_2: "D = (A, Ā, w, T, s)"
      v4: "D = (A, Ā, w, T, σ)"
      ruling: >
        Amendment AH restores sigma as the dialectic's sublation predicate. This
        ruling does not rewrite the immediate v3.2 text, which used `s`; content
        descended from Amendment N must use a qualified spectrum name rather than
        reserve the constitutional glyph.
