ADR295_native_readiness_proof_fence:
  status: accepted
  date: '2026-11-10'
  title: Native readiness precedes a private authenticated period proof fence
  issue: PER-364
  authority: Director-approved positive-period readiness repair and architecture record
  evidence_class: Designed
  context: |
    Ordinary PlayerKnowledge readiness and complete private material evidence
    serve separate consumers. Starting the private fold before the installed
    ordinary frame and actionable organizer status couples their schedules.
    This decision records the bounded live-close schedule. It does not establish
    a measured speedup, native qualification or a scientific or mechanical claim.
  decision: |
    For an audited positive live close, manual Step and bounded Play first
    install the actual ordinary restricted PlayerKnowledge frame. The driver
    retains one explicit accepted strictly actionable organizer status, then
    requests the private await_period_proof control. One existing observation
    task slot performs the private material/Aid fold while the independent
    Archive worker can progress. No additional reader pool, runtime command,
    database grant, visible debug control or telemetry backend is introduced.

    Bind the compact installed witness and private candidate to the exact
    campaign, epoch, foundation, policy, generation, world, marker, envelope,
    original Advance request and accepted-command custody revision. Join the
    exact candidate and matching accepted Archive completion through the
    existing commit path. Publish material and its referencing Advance, then
    install live custody and the authenticated cursor before acknowledging
    successful local try_send queue acceptance. This does not attest peer receipt.
    Pending or refused proof cannot admit another qualified source. Quit refuses
    publication and drains the task before qualified AppExit; clocks do not reset.

    Qualified KnownPreview reads leave the cache-owned FullObserver admission
    owner and private cursor untouched on success, error or stale results. The
    private proof extends the contiguous authenticated prefix. P0, every cold
    opening and reopen retain full authentication. Ordinary, unbounded and
    unaudited play retain their existing behavior. No game authority or mechanic
    changes.

    Both trace consumers require cause, unique accepted strictly actionable
    status and matching successful fence in causal sequence. Count accepted
    statuses before validating identity and absence of proof. Enqueue-to-commit
    must fit the original close-to-ready interval. Enqueue-to-commit plus Archive
    must fit the later close-to-fence interval. Keep the whole clock and every
    independent Archive, storage, decision and restart join. The existing
    TIMINGS qualified_period_proof_candidate event records archive_accepted at
    candidate collection. Both positive arrival orders require actual native
    acceptance; one synthetic order or local source gate cannot establish it.

    Inherit ADR294's both-required serial normal_play and memory_capture gate,
    with the same decisions and path, separate walk timing and all three cold
    segments. Keep contracts/national_storage_qualification_v6.json byte-identical
    (SHA-256 2f7a92f6e464e38c22f884300381da8386087d8cc3c3b771c604061504c1574b).
    Its Designed limits remain cold/reopen below 180 seconds, advance at most
    120 seconds, Archive/production reads at most 180 seconds, focused controls
    at most 60 seconds and the whole two-period smoke at most 900 seconds.
    await_period_proof uses the existing finite 900-second long-operation
    watchdog, not the focused-control deadline. Memory retains full creation,
    period and recovery coverage, source/process admission, RSS plus hugetlb at
    most 10,000,000,000 bytes and sample gaps at most five seconds. Raw captured
    phase times remain diagnostic; never subtract freezes or fabricate zeros.
    Actual measured timings are Observed evidence, not new policy limits.
  interfaces: |
    Private startup, input, response and trace are v5. NativeRunEvidence and its
    result are v6 with scope native_material_timing_recovery_join_v6.
    CompletedMember v1, NativePairEvidence v1, final report v8, material v5,
    Advance v1 and recovery v2 remain unchanged. The single RUN_PARENT resolver
    places members at qualification-11/<workload>/<mode> and the unpaired SQL
    fixture at qualification-11/sql-01. Preserve earlier namespaces, source and
    binaries. Unsupported old native inputs refuse before writes; no
    compatibility path is added.

    Current method: docs/concepts/architecture.rst and
    docs/how-to/debug-simulation-outcomes.rst.
    Client: rust/crates/babylon-client/src/observer_io/qualification/proof.rs,
    observer_io/runtime.rs and organizer/qualification_input.rs.
    Driver and joins: tools/devtools/national_windowed_qualification.py,
    national_native_evidence.py, national_native_runner.py and
    wayne_qualification_storage.py.
  consequences: |
    The ordinary readiness endpoint remains distinct from private publication
    and independent qualification. Actual normal and memory smoke/walk runs,
    positive publication and queue acceptance, both arrival orders, rendered
    input behavior and an uncoached human session need their own evidence.
    Source review and local gates do not establish those results or completion
    within the unchanged limits. Reports and Linear retain actual acceptance.
  related:
    - ADR294_native_timing_and_memory_qualification
