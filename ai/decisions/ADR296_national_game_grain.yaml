ADR296_national_game_grain:
  status: accepted
  date: '2026-11-10'
  title: Generate a Designed national economy before live economic expansion
  issue: PER-364
  authority: Director approval of national game-grain work and bounded delivery
  evidence_class: Designed
  context: |
    National coverage and international trade are required. The old national
    opening expands 60,634 sites and about 2.17 million relation-row occurrences.
    Its late detail partition only classifies that full opening. Preserving all
    current financial and supplier constraints offers no demonstrated exact
    actor quotient. The game needs less generated live state and a usable turn.
  decision: |
    Keep current county source contributions and geography, detailed Wayne and
    Cook principals, twelve foreign groups, six dependencies and finite trade.
    After source household/workforce allocation and exact aid preparation, fold
    background contributions before constructing economic actors or relations.
    Use state and captured FAF membership, protected/special-access singletons,
    and deterministic capacity-aware subdivisions anchored in real counties.
    Optimistic local food output gives an import lower bound; first-fit bins
    cannot exceed the original elected hub lane on that check. Retain original
    over-capacity counties as explicitly scarce singletons. A fitting lower
    bound does not establish whole-chain viability. Shared downstream pools,
    service jurisdiction and actual stock, cash and time stay binding.
    Distinguish reserve positions, source ownership/function/kind, household
    budget keys and financial domains. Background source principals become
    immutable provenance; new representative principals own current budgets,
    stocks and time. There is no duplicate fine runtime or compatibility mode.
    Sum original per-source opening endowments after their floors, never move
    those floors after grouping. Preserve people, classes, units and exact
    micros. Capture deterministic membership and its source/policy digest once;
    regenerate/authenticate it on restart, not in each state and receipt.
    For finite source-to-representative assignment q, additive pushforward
    preserves sums and composition. These are tested accounting laws, not
    old/new transition congruence or an invented aggregation adjunction.
    Report catchment outcomes as Designed representation, never individual
    county observations. Exact known aid budgets, consent, reports and timing
    retain their current independent authority.
  qualification: |
    One initial candidate and one corrective iteration after measured failure.
    Reuse the completed sole baseline profile and retained comparable P0/P1/P2
    boundaries. Require fewer actual principals/sites and relations, smaller
    canonical states and receipts, and three individually bounded ordinary
    Advance-to-useful-brief samples of at most ten seconds. Do not call three
    samples p95. Report packed bytes, resident memory and recovery separately.
    Both national native timing and full-memory smoke/walk members, the real
    ten-period funded loop, frame/input checks, uncoached human acceptance and
    exact-head publishing remain required. Existing caps are not enlarged.
    This decision does not assert implementation, performance or game acceptance.
  related:
    - ADR248_finite_material_transition_kernels
    - ADR258_authored_campaign_parameters
    - ADR293_wayne_resource_allocations
    - ADR294_native_timing_and_memory_qualification
