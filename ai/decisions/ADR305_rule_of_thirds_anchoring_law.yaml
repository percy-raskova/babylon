ADR305_rule_of_thirds_anchoring_law:
  title: Adopt the rule of thirds as the anchoring law for the opening split of household wealth
  date: '2026-11-19'
  status: accepted
  issue: PER-366
  evidence_class: Designed
  authority:
    - >-
      Director, 2026-11-19: "lets also consider as an anchoring law the generalized
      rule of thirds: 1% of the pops owns 1/3 of the wealth, 1-10% own next third,
      10-50% own last third, >50% have net zero wealth".
    - >-
      Director, 2026-11-19, on the same law: it "can eventually of course
      fluctuate due to stochasticity or class struggle", because classes fight over
      taking slices of each other's wealth.
    - Owner ruling of 2026-07-16 on empirical laws (see the test-estate audit).
  context: |
    The Director gave the class-agents lane a law for how household wealth is
    split. The project holds evidence for it. United States wealth shares in 2024
    were 34.8%, 34.8%, 29.5% and 1.0%, and the lower half held between -1.8% and
    3.7% of all wealth from 1913 to 2024 (reports/test-estate-audit-2026-07-16.md).
    The County Review holds no household wealth and no rule that reads it.
  decision: |
    R1. THE LAW. In a population the top one hundredth holds a third of the
    wealth. The next nine hundredths hold a third. The next two fifths hold a
    third. The lower half holds nothing net.

    R2. WHAT IT BINDS. The author holds the law back from this slice (see calls).
    It binds no rule of the County Review slice. Nothing in
    that slice reads or writes household wealth. It binds the opening split of a
    county's household wealth in the next slice, when positions hold accounts of
    their own. The split is a declared split with its source named.

    R3. AFTER THE OPENING. The split moves only by what households earn, spend,
    win and lose. It is measured each period and never pulled back toward the
    thirds. This is the form the owner ruled in July: an opening contract without
    condition, and during a run only the reverse test, that a distribution outside
    the band has a rupture in its history. Stochasticity and class struggle may
    move it, as the Director said.

    R4. THE FIRST TASK. In Wayne the two budget groups with business ownership
    are 70,060 of 700,583 households, about one tenth. The share of household
    wealth they hold can be measured from the engine's accounts as they are and
    set beside the two thirds the law gives the top tenth. That measurement is
    the first task of the next slice. It is the author's call.
  calls:
    - 'The law changes nothing in this slice and binds the opening split of wealth in the next (design section 2, call 23; section 11).'
    - 'The measurement in R4 as the first task of the next slice (design 11).'
    - 'Reading "net zero wealth" as a lower half that holds nothing net.'
  alternatives_rejected:
    - 'Enforcing the thirds each period. It would pull a measured outcome back by hand.'
    - 'Building the law into this slice. The slice has no wealth to split.'
  verification: |
    This slice: confirm that no rule reads household wealth. Next slice: the
    opening contract splits wealth by R1 with its source named, and the run
    applies only the reverse test of R3.
  related:
    - ADR194_director_rulings_batch2_2026_08_11
    - ADR301_county_review_session
    - ADR302_household_roster_and_counting
