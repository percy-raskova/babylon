ADR313_the_national_economy_opens_in_balance:
  title: The national economy opens in balance, with twelve trades, observed pay, tiers and benefits
  date: '2026-11-20'
  status: accepted
  issue: PER-371
  evidence_class: Designed
  authority:
    - >-
        Director, 2026-11-20, on the record of the nationwide collapse: "this
        sounds like we need some kind of financial system and credit and loans
        and a financial market and all that stuff, volumes 2 and 3".
    - >-
        Director, 2026-11-20: "then consumers need to be demand, as do foreign
        corporations because unequal exchange means that the imperialist core
        sells back capital to the periphery, high labor inputs from periphery,
        high capital intensive exports from core. also households are part of
        the consumer economy. workers spend their wages. there also needs to be
        capital for expansion like investments, construction, production,
        ramping up production, etc."
    - >-
        Director, 2026-11-20: "make it interesting enough for a video game, the
        goal is entertainment not scientific explanation, the goal is to make
        the game engaging and dynamic and emergent".
    - >-
        Director, 2026-11-20, in four rounds of answers: money left after needs
        is spent tier by tier; the consumer tier is consumer goods and a luxury
        product; each trade in each place pays its observed average wage;
        recipes and prices come from the national accounts; two new trades are
        cut from the jobs data; the consumer expenditure survey sizes the tiers;
        in a short market money decides; the luxury trade is leisure and
        hospitality; every place's earners are split by band; a laid-off worker
        has an unemployment benefit for 26 weeks.
    - >-
        Director, 2026-11-20, on households with no earner: "public benefits,
        cut when taxes fall, the benefits and state services and disability
        pension etc can become a site of struggle eventually and be modified,
        tweaked, increased, etc thru the political/electoral system".
    - >-
        Director, 2026-11-20, on the design
        (`docs/superpowers/specs/2026-11-20-the-opening-of-the-national-economy-design.md`):
        "Approve: plan and build".
  context: |
    The national scenario opens far out of balance. Measured on 20 November
    2026 (`reports/economy-repair-2026-11-20/`): households lack 80% of their
    food by period 5; over 110 million of 161 million workers are laid off in
    period 2; twelve candidate repairs of the scenario's numbers were run for 34
    periods and none holds. Three causes are beyond numbers. The designed
    recipes need about a quarter of the workforce. Households with no earner
    (22.5% of households, 27.6% in Wayne) have no income. A business counts an
    order stuck behind a full route as arriving.

    A household buys one fixed basket whatever it earns. Every job pays $24 an
    hour. A public body's payments are capped at the opening's figure while its
    receipts are not, so public cash grows from $1.3 trillion to $7.6 trillion
    over 34 periods.

    This record is steps 1 and 2 of the order agreed that day: an opening that
    runs, and households that spend. Credit, different techniques in core and
    periphery, and the debts that follow are later steps.
  decision: |
    O1. TWELVE TRADES. Consumer goods (apparel, footwear, furniture, textile
    products, miscellaneous goods, motor vehicles with bodies and parts, audio
    and video equipment, household appliances) and leisure and hospitality
    (arts, entertainment and recreation; restaurants and hotels) are cut out of
    today's ten. Each trade makes one product. The designed cross-border claims
    on Wayne's and Canada's plants follow the car plants.

    O2. PAY. A workplace pays the observed average wage of its trade in its
    place: annual pay over jobs over 2,080 hours. A withheld figure takes the
    state's wage for the trade, then the nation's. A foreign region pays a
    designed fraction of the United States wage of the same trade. Withheld
    jobs in a finer industry share what is left of the published figure above
    them, by their establishments.

    O3. THE ACCOUNTS. One committed, coarse table of the twelve trades, from
    the 2024 national input-output tables and the jobs data, sets the
    scenario's numbers once through a builder. Nothing in play reads it.

    O4. EVERY OBSERVED JOB IS NEEDED AT THE OPENING. A trade's hours for a unit
    are its observed hours over what the game's buyers take from it.

    O5. EVERY TRADE COVERS ITS COST. A product opens at its cost price plus its
    trade's margin. A workplace's price follows its own wage. A scenario in
    which a private product opens under its cost at the nation's average wage
    is refused.

    O6. FOUR BALANCES AT ZERO AT THE OPENING. Households spend what they
    receive. Public bodies pay out what they collect. What is sold abroad pays
    for what is bought abroad. What businesses keep of their profit is what
    they spend on equipment. Each closes within one percent of its flow.

    O7. HOUSEHOLDS BUY IN TIERS, AND A TIER IS A BASKET. Needs: the least of
    every necessity, 40% of a person's average spending. Comforts: consumer
    goods and more housing, services, food and energy, the next 60%. Luxuries:
    leisure and more of everything again, the next 150%. Money left after the
    last tier is kept. Only an unmet need is going without.

    O8. COMFORTS AND LUXURIES BID IN THE SAME MARKETS AS NEEDS. A household bids
    for a thing with the money it does not need, at posted prices, for the
    things ahead of it in its list that it has still to buy this period.
    The tax it owes on the period's wages is ahead of its comforts and
    luxuries. Between households money decides, at one price for all.

    O9. DISTRIBUTION IS THE SHOP: its workers are the hours of retail on the
    goods households buy.

    O10. BUILDINGS AND SOFTWARE ARE BOUGHT AS INPUTS. Only equipment is bought
    as equipment.

    O11. TRADE BY PRODUCT. Each product has its own share bought abroad and its
    own volume sold abroad. A foreign region's mix of jobs is computed so that
    the region is in balance.

    O12. BENEFITS, from one national fund that takes a share of both taxes
    everywhere. A household with no earner is paid, for each person, enough for
    the needs at the opening's prices; it is covered by what it was at the
    opening, owner or not. A worker laid off in play is paid half the pay of
    the job lost for 26 weeks, six periods in full and half of the seventh; the
    last laid off are taken back first. Each kind is a named row of the
    scenario with its own rate and people.

    O13. PUBLIC MONEY IS SPENT, AND CUT WHEN IT RUNS SHORT. A public body pays
    its programs in full while it has the cash. When it is short, the programs
    of one rank are cut in the same proportion.

    O14. EQUIPMENT WEARS OUT A LITTLE EVERY PERIOD. A workplace opens with
    machines of every age, and with machines for its whole workforce.

    O15. THE MAP'S PLACES STAY. The food figures that fold the counties into
    187 places are written down as the map's own basis. Airports' room is
    raised so that the opening's flows fit.

    O16. ON ASKING. The rebuilt scenario is `schema_version = 8`, carries the
    order of paying, and compiles as `national-world-v13`. Household units are
    `national-world-v14`. Earlier schemas compile to the bytes of today.

    O17. BANDS IN EVERY PLACE. The households that earn are three pooled
    accounts: the bottom half, the next 40% and the owners. A place's jobs are
    ranked by pay; the owners' earners hold the best paid, the bottom half the
    least, each band with jobs in proportion to its households.
  amends:
    - >-
        ADR312 P2: a household's bid has a rung for each tier, each with the
        money that tier may use.
    - >-
        ADR312 P7: consumer goods and leisure join the order of paying; a
        household's list goes by tier first, and by that order inside a tier.
    - >-
        ADR312's authority recorded the Director's earlier choice that wages
        stay during the repair. The rulings above replace it.
  calls:
    - >-
        A tier is a basket, sized 40%, 60% and 150%, read from the survey's
        incomes per person by tenth (design 9).
    - >-
        Wages are pay without the employer's benefits. That money stays with the
        business and reaches households as profit paid out and as public
        benefits, so the game's incomes are less equal than the country's.
    - 'Before banks, the tiers are sized for the top to spend nearly all it earns at the opening.'
    - >-
        The rent that home owners are counted as paying themselves is left out;
        every household buys housing.
    - 'Public schools and hospitals stay with household services and are paid for by households.'
    - 'Trade is balanced in money at the opening.'
    - 'One national fund pays benefits, not each place.'
    - 'Each band holds jobs in proportion to its households.'
    - >-
        Those looking for work at the opening keep county support; the
        unemployment benefit is for a job lost in play.
    - 'Abroad the tiers apply and the benefits do not.'
    - >-
        Withheld jobs are placed to set a trade's pay in its county; where
        residents work is decided as today (made plain on 2026-11-20 while
        planning stage 2).
    - 'Bands are dealt county by county; a place''s accounts are the sums over its counties.'
    - >-
        The County Review's floor follows the wage: two hours at Wayne's average
        pay, about $74, where the earlier ruling named $48 (two hours at $24).
    - 'The City PD pays the wage of its one payroll workplace.'
    - >-
        The wage tax is ahead of comforts and luxuries. Measured on the small
        world with a fund on 2026-11-21: with the tax collected after the
        buying, households spent its money on comforts and 280 of 640 was
        collected. A need still bids with the whole purse.
  alternatives_rejected:
    - 'Changing the numbers of today''s table. Measured: twelve candidates, none holds.'
    - >-
        Designed recipes priced at cost plus one rate of profit. Every trade
        covers its cost and the layoffs stay.
    - >-
        The accounts at their full detail of 71 industries. Six times the
        trades, and nothing the player would see for it.
    - 'Tiers of one product each. Housing and health care would have far more workers than customers.'
    - >-
        Each place paying its own benefits. Poor places would cut from the first
        period and rich ones would hoard.
  open_questions:
    - >-
        Whether the engine's own rules hold a balanced economy steady. A small
        hand-built world is run for 34 periods before the country is rebuilt.
        Stabilizers are measured one at a time and brought to the Director.
    - 'Tax-paid schooling and health care as a rule of their own.'
    - 'Freight as a trade, with the transport program.'
    - 'How politics and elections change the rates of benefits and services.'
  verification: |
    The builder's balance sheet. The opening's own report, read before any
    period runs. A quiet run of 34 periods across the country and abroad: at
    least 90% of the opening's jobs, at least 95% of every need met, no product
    under its cost at more than one seller in twenty, money conserved. Three
    pushed runs that must show, spread and not collapse. Wayne played for
    twelve periods in the real client.
