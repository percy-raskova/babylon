  decision: >
    Rust owns authoritative game-managed PostgreSQL connections, migration
    authority, committed-tick transactions, checkpoint hydration, H3 codecs,
    and compatibility views after one-way cutover. Python retains data builds,
    external APIs, AI/Ollama, document/wiki/vault work, and CLI periphery;
    transition observers are read-only.
  identity_contract: >
    CampaignId(UUID) is durable ledger identity; deterministic Rust SessionId
    remains a separate RNG namespace and is never derived from the UUID.
    RNG seed, ContentDigest, and ref_digest are separate replay inputs.
    ReplayIdentityHash, GraphStateHash, and TickContentHash remain distinct;
    a complete TickContentHash is a writer-cutover gate.
  migration_contract: >
    Freeze both ordered legacy DDL sets — POSTGRES_SCHEMA_DDL and SQL migrations
    0010-0044 — with their UTF-8-plus-NUL digests and shared advisory lock;
    adopt them from Rust, then use one Rust-owned append-only version/checksum
    ledger. There is no dual-writer or dual-migrator interval.
  current_reality: >
    Python remains the sole live runtime writer and migrator. The Rust
    contract crate opens no database and cannot write a campaign.
  next: >
    Land the separate PER-21 H3 identity contract, then the read-only
    legacy schema adopter and census.
