    (8 international + rest_of_usa, Canada as first-class per Constitution
    IV.1 R4 amendment), and a conservation audit log with per-tick SHA-256
    determinism hash (GATE-1 / Constitution III.7).

    Delivered: 6 Postgres migrations (0010-0015), 9 Pydantic models,
    SubstrateSystem at pipeline slot 2.5, ConservationAuditor +
    ConservationAuditQuery, ImmutableReferenceLookup with FR-016/041 clamp
    behaviour, BoundaryFlowRegister with hex-pair discriminator schema,
    distribute_phi_week_to_counties helper, distribution.split_surplus_to_pirt,
    PostgresRuntime.persist_tick_atomic + get_last_committed_tick, ADR040,
