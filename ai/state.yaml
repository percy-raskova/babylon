      dim_county_geometry.area_sq_km. energy_per_hex uses pop_factor;
      raw_material_per_hex uses area_factor. Graceful T067 fallback
      when area data missing.

    Cascade fixes surfaced during implementation:
    - hex_hydrator wages query gained the ownership_id=1 filter to
      mirror the new employment_proxy filter (avoids ownership-rollup
      double-counting in v).
    - consciousness.routing_scale bumped 0.1 → 0.2 (FR-027 + Phase 0 R4)
      for measurable consciousness drift visibility.
    - dynamic_relationship_state CHECK constraint mismatch: bridge
      now UPPERCASES edge_type before persisting (StrEnum.value is
      lowercase but migration 0024 requires uppercase).
    - test_state_rate_of_profit_in_relaxed_band band widened from
      [0.05, 0.50] to [0.05, 0.80] to accommodate the un-doubled v.
    - test_tick_over_tick_evolution loosened to "any column changes"
      (the strict ≥5% threshold is validated by the 520-tick slow-gate
      test_consciousness_evolution.py).

  previous_sprint_2: "064-headless-sim-runner (Complete; 67/70 tasks done, 3 deferred — see specs/064-headless-sim-runner/tasks.md and ADR041)"
  spec_065_summary: |
    Engine-bridging — real per-tick state behind the headless runner.
    Replaces spec-064's no-op carry-forward virtualization with a real
    WorldStateBridge that hydrates per-county SocialClass entities,
    persists per-tick subsystem rows (consciousness, demographics,
    employment), and produces trace.csv values that vary per-county
    from real BEA/QCEW/FCC reference data.

    Delivered: WorldStateBridge (hydrate_initial + persist_tick +
    poll_endgame); babylon.persistence.county_aggregation (4 pure
    derivation helpers: aggregate_survival, aggregate_consciousness,
    fetch_population, fetch_employment_proxy); hex hydrator rewrite
    (real BEA GDP × intermediate-inputs-fraction for c, QCEW for v,
    GDP-residual for s, capital-output-ratio for k, FCC + coercive
    infrastructure for surveillance/internet); FR-022 reference-data
    window preflight (silent/warn-and-clamp/hard-refuse three-mode
    policy); --strict CLI flag that aborts on alarm-severity audit
    rows; --endgame-detector CLI flag with importlib resolution;
    EventCapture wiring into summary.events; aggregate_external_node_flows
    pulling per-node summaries from boundary_flow_register table;
    SocialClass.county_fips optional FIPS attribution field; bridge
    mapping IdeologicalProfile(cc, ni) → TernaryConsciousness(r, l, f)
    that's simplex-preserving by construction.

    4 new Postgres migrations (0020-0023): dynamic_consciousness_state,
    dynamic_demographics_state, dynamic_employment_state plus the
    recreated view_runtime_trace_emission that JOINs them. The 22-column
    external trace contract is preserved; previously-NULL columns now
    flow from real engine state + reference data.

    1500+ unit tests + 15 integration tests across persistence/models/
    engine.headless_runner/integration. 1 xfail (T028 SC-004 tick-over-tick
    variance) documents that full SimulationEngine integration is
    deferred to a follow-up spec — the bridge + persistence layers are
    ready, but the 15-system engine wiring is large enough to deserve
    its own session.

    Reconciliation note: the original spec contract referenced WorldState
    fields (consciousness_simplex, demographics_per_county,
    employment_per_county) that don't exist on the model. Research.md
    §R10 documents the 2026-05-15 reconciliation that replaced those
    flat field reads with derivation/aggregation helpers and added a
    single optional SocialClass.county_fips field. Per Constitution II.6,
    per-county aggregates are derived state and belong on the trace view
    (where they already lived), not on WorldState.
  spec_064_summary: |
    Headless Postgres-backed simulation runner — canonical CLI surface
    for end-to-end Babylon runs. A single `mise run sim:e2e-michigan`
    bootstraps Postgres, hydrates hex state, runs a tick loop, and emits
    an LLM-parseable artifact bundle (trace.csv + summary.json +
    manifest.json with input_hash determinism fingerprint).

    Delivered: babylon.engine.headless_runner package (8 modules:
    runner, argparse_cli, scopes, models, trace_emitter, run_summary,
    manifest, __main__). Postgres migration 0019_trace_emission_view.sql
    establishes view_runtime_trace_emission as the II.11-compliant
    declared cross-subsystem read interface. 6 in-scope tools
    (audit_simulation, monte_carlo, parameter_analysis,
    sensitivity_analysis, profiler, landscape_analysis) refactored to
    route through tools/shared.py:run_simulation; SC-007 import audit
    enforces the no-legacy-engine boundary at CI time. ADR041, baseline
    snapshot, qa:e2e-regression mise gate.

    Three tasks deferred: T024a + T033 (end-game detection), and a
    future-spec recovery of full result-dict fidelity in tools/* once
    real engine systems are wired into the headless tick loop. The MVP
    runner carries hex state forward unchanged; richer per-tick
    advancement lands in a follow-up spec.
  spec_062_summary: |
    Cross-scale value, substrate, and tick propagation engine. Codifies the
    two-phase persistence boundary (SQLite-as-fixture / Postgres-as-runtime),
    per-tick transactional atomicity (FR-008a), hex resolution 7 as the only
    persisted source-of-truth for c/v/s/K/biocapacity (FR-018/FR-019),
    year-scoped coefficient lookups with slowly-varying vs event-discrete
