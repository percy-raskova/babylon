# =============================================================================
# MONTE CARLO UNCERTAINTY QUANTIFICATION
# =============================================================================

monte_carlo:
  philosophy: "Capture stochastic variance via N-sample replication"
  location: "tools/devtools/sim_analysis/monte_carlo.py (subcommand: monte-carlo)"
  added: "2026-01-01"
  mise_task: "analysis:monte-carlo"

  purpose: |
    StruggleSystem has stochastic EXCESSIVE_FORCE probability. Single
    simulation runs don't capture variance. Monte Carlo replication
    provides confidence intervals on outcomes.

  features:
    - "N-sample replication with configurable seed"
    - "Sequential execution (simpler code per user preference)"
    - "Per-sample metrics: ticks_survived, outcome, max_tension, final_wealth"
    - "Aggregate statistics: mean, std, 95% CI via t-distribution"
    - "CSV output + strict-JSON replay-input manifest + markdown report"

  cli_usage:
    basic: "mise run analysis:monte-carlo 100"
    with_seed: "mise run analysis:monte-carlo 1000 42"
    with_param: "uv run python -m tools.devtools.sim_analysis monte-carlo --param economy.extraction_efficiency=0.5"

  statistics:
    confidence_interval:
      method: "t-distribution"
      level: 0.95
      requires: "scipy>=1.11.0"

    reported_metrics:
      - "n_samples, n_survived, n_died, survival_rate"
      - "ticks_mean, ticks_std, ticks_ci_lower, ticks_ci_upper"
      - "tension_mean, tension_std"
      - "wealth_mean, wealth_std"
      - "objective_mean, objective_std"

  output:
    csv: "results/monte_carlo.csv"
    columns: "sample_id, seed, defines_hash, ticks_survived, outcome, max_tension, final_wealth, objective_score"
    manifest: "results/monte_carlo.manifest.json"
    manifest_contract: "Full validated defines once, overrides, seeds, outputs, aggregate statistics, and verification receipts"

  sample_size_guidance:
    exploratory: "100 samples (fast, rough estimate)"
    standard: "1000 samples (good precision)"
    maximum: "10000 samples (the command's hard safety limit)"

  references:
    - "NIST Monte Carlo Guidelines"
    - "Modern Monte Carlo Methods for Efficient Uncertainty Quantification (Zhang 2021)"

# =============================================================================
# GLOBAL SENSITIVITY ANALYSIS (SALib)
# =============================================================================

sensitivity_analysis:
  philosophy: "Quantify parameter importance via variance decomposition"
  location: "tools/devtools/sim_analysis/sensitivity.py (subcommand: sensitivity)"
  added: "2026-01-01"
  mise_tasks:
    - "analysis:sensitivity"
    - "analysis:morris"
    - "analysis:sobol"

  purpose: |
    Identify which GameDefines parameters most strongly affect simulation
    outcomes. Uses two-stage protocol from JASSS best practices:
    1. Morris screening (fast) - rank parameters by importance
    2. Sobol analysis (thorough) - quantify variance decomposition

  methods:
    morris:
      name: "Morris Elementary Effects"
      purpose: "Fast screening for parameter importance ranking"
      outputs:
        mu_star: "Mean absolute elementary effect (importance)"
        sigma: "Std dev of effects (non-linearity/interaction indicator)"
      default_workload: "8 trajectories over 8 explicit parameters = 72 evaluations"
      usage: "mise run analysis:morris"
      interpretation: |
        High mu* = important parameter
        High sigma / mu* = non-linear or interacts with others

    sobol:
      name: "Sobol Variance Decomposition"
      purpose: "Quantitative variance attribution"
      outputs:
        S1: "First-order index (main effect of single parameter)"
        ST: "Total-order index (main + all interaction effects)"
        S2: "Second-order index (pairwise interactions)"
      default_workload: "64 base samples over 8 explicit parameters = 1152 evaluations"
      combined_workload: "64 base samples over the Morris top 4 = 640 evaluations"
      usage: "mise run analysis:sobol"
      interpretation: |
        Sum(S1) = variance explained by main effects
        Sum(ST) - Sum(S1) = variance from interactions

  default_parameters:
    - "economy.base_subsistence"
    - "economy.extraction_efficiency"
    - "economy.comprador_cut"
    - "economy.super_wage_rate"
    - "economy.trpf_coefficient"
    - "consciousness.sensitivity"
    - "solidarity.scaling_factor"
    - "carceral.enforcer_fraction"

  safety_bounds:
    max_parameters: 16
    max_evaluations: 2048
    max_evaluation_ticks: 5000000
    max_artifact_bytes: 8388608
    default_max_ticks: 2600

  workflow:
    discovery: |
      1. Run the bounded two-stage campaign: mise run analysis:sensitivity
      2. Inspect the Morris mu* ranking and the top-four Sobol S1/ST results
      3. Pass another explicit comma-separated parameter subset when needed
      4. Use S1/ST to quantify main versus interaction effects
      5. Focus Optuna tuning on high-ST parameters

  output:
    morris: "results/morris.json"
    sobol: "results/sobol.json"
    contract: "Versioned strict JSON with base defines, parameter bounds/types, exact sample vectors, native overrides, outputs, seeds, and verification receipts"

  dependencies:
    SALib:
      package: "SALib"
      version: ">=1.5.2,<2.0.0"
      group: "dev"
      methods_used: "morris.sample, sobol.sample, morris.analyze, sobol.analyze"

  references:
    - "SALib Documentation: https://salib.readthedocs.io/"
    - "JASSS: Which Sensitivity Analysis Method Should I Use?"
    - "Saltelli et al., Global Sensitivity Analysis: The Primer (2008)"

# =============================================================================
# REGRESSION TESTING
# =============================================================================

regression_testing:
  philosophy: "Detect formula drift via baseline comparison"
  location: "tools/regression_test.py"
  added: "2026-01-01"
  mise_tasks:
    - "qa:regression"
    - "qa:regression-generate"

  purpose: |
    Store expected simulation outputs as JSON baselines. After code
    changes, compare current output against baselines to detect
    unintended formula drift. Critical for maintaining mathematical
    correctness during refactoring.

  scenarios:
    imperial_circuit:
      description: "4-node default scenario"
      file: "tests/baselines/imperial_circuit.json"
    two_node:
      description: "Minimal worker vs owner"
      file: "tests/baselines/two_node.json"
    starvation:
      description: "Low extraction efficiency stress"
      file: "tests/baselines/starvation.json"
    glut:
      description: "High extraction with metabolic overshoot"
      file: "tests/baselines/glut.json"
    fascist_bifurcation:
      description: "Consciousness routing to national identity"
      file: "tests/baselines/fascist_bifurcation.json"
    single_county:
      description: "Wayne-seeded minimal county and Volume III financial layer"
      file: "tests/baselines/single_county.json"
    mitterrand:
      description: "Reform-in-office forced-austerity scenario"
      file: "tests/baselines/mitterrand.json"
    syriza:
      description: "Captured-governance capitulation scenario"
      file: "tests/baselines/syriza.json"
    weimar:
      description: "Fascist consolidation through the ballot"
      file: "tests/baselines/weimar.json"
    debs:
      description: "Independent-line FPTP scenario"
      file: "tests/baselines/debs.json"
    bernie_valve:
      description: "Entryism and disillusion routing scenario"
      file: "tests/baselines/bernie_valve.json"
    org_probe:
      description: "Two-organization byte-gate anchor"
      file: "tests/baselines/org_probe.json"

  checkpointed_metrics:
    per_tick:
      - "p_w_wealth, p_c_wealth, c_b_wealth, c_w_wealth"
      - "imperial_rent_pool"
      - "exploitation_tension"
      - "p_w_consciousness"
      - "p_w_p_revolution"
    checkpoint_interval: 10
    final: "outcome (SURVIVED/DIED/etc.)"

  tolerance: 1e-5

  workflow:
    after_intentional_changes: |
      1. Make intentional formula changes
      2. Run: mise run qa:regression-generate
      3. Review generated baselines
      4. Commit baselines with code changes

    in_ci: |
      1. CI runs: mise run qa:regression
      2. If baselines differ, CI fails
      3. Developer investigates: intentional or bug?

    investigating_drift: |
      1. Review failing baseline comparison
      2. If intentional: regenerate baselines
      3. If unintentional: fix the regression

  defines_hash:
    purpose: "Detect GameDefines parameter changes"
    algorithm: "SHA256 of JSON-serialized defines"
    warning: "Baseline may need regeneration if defines changed"

