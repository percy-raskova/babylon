---
meta:
  name: Babylon v4 behavioral tuning standard
  version: "4.0.0"
  updated: "2026-08-22"
  authority: CONSTITUTION.md v4.0.0 Articles I, III, IV, and VIII
  purpose: >-
    Tune a legible and entertaining causal simulation without prescribing a
    terminal outcome or disguising design choices as empirical observations.

provenance_classes:
  - Observed
  - Derived
  - Calibrated
  - Designed

provenance_rules:
  Observed: measured directly in a named source artifact
  Derived: computed from declared observed inputs and a reproducible method
  Calibrated: inferred to reproduce a bounded causal signature or operating range
  Designed: chosen for pacing, legibility, expression, or play
  substantive_value_rule: every_substantive_value_declares_one_class
  designed_liberty_rule: >-
    Designed choices are valid when declared, causally coherent, and in service
    of play. They must not be presented as observations.

outcome_policy:
  predetermined_outcomes: forbidden
  historical_trajectory: not_prescribed
  stable_or_surviving_run: valid_if_causally_produced

tuning_targets:
  form: plausible_operating_range_or_causal_signature
  permitted:
    - bounded_pacing_window
    - signal_legibility
    - decision_feedback_timing
    - heterogeneous_sector_response
    - heterogeneous_geographic_response
    - persistent_post_shock_effect
    - counterfactual_sensitivity
  prohibited:
    - mandatory_terminal_outcome
    - mandatory_empire_death
    - death_at_a_prescribed_tick
    - objective_weights_for_death_timing
    - pruning_a_run_only_because_it_stays_stable

validation_contract:
  dimensions:
    - conservation
    - deterministic_replay
    - control_shock_twins
    - counterfactual_responsiveness
    - mutation_tests
    - heterogeneous_effects
    - hysteresis
    - direct_write_audits
  interpretation:
    conservation: declared stocks and flows close within their exact contract
    deterministic_replay: identical inputs produce byte-identical state
    control_shock_twins: the shock run diverges from its matched control
    counterfactual_responsiveness: changed capacities or actions change results
    mutation_tests: severing a causal link removes its downstream signature
    heterogeneous_effects: effects vary across relevant territories and sectors
    hysteresis: some consequences persist after the exogenous shock ends
    direct_write_audits: shocks never author prohibited downstream outcomes

benchmark_horizons:
  covid_e0:
    status: planned
    gate: G4
    owner: PER-8
    tick_unit: week
    weeks: 104
    runs:
      - no_shock_control
      - historical_envelope_shock
      - strong_capacity_counterfactual
      - weak_capacity_counterfactual
    checkpoints:
      - onset
      - peak
      - shock_end
      - week_52
      - week_104
    note: >-
      These are planned acceptance criteria. Their presence here does not claim
      that the benchmark, hydration, or executable shock exists.
  full_circuit_covid:
    status: planned
    gate: G7
    horizon_rule: scenario_specific
  systemic_credit_2008:
    status: planned
    gate: G8
    horizon_rule: scenario_specific

change_control:
  balance_change_requires:
    - provenance_review
    - scoped_behavioral_contract
    - deterministic_regression_evidence
    - declared_baseline_ceremony_when_bytes_move
  failure_rule: >-
    Diagnose the shared causal machinery before changing a target. Do not tune
    toward a desired historical winner.
