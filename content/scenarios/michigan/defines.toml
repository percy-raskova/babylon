KILOGRAM_GRAMS_PER_UNIT = 1000
PANEL_GRAMS_PER_UNIT = 10000
SUBASSEMBLY_GRAMS_PER_UNIT = 20000

[staffing]
WORK_HOURS_PER_PERSON_WEEK = 40 # Positive integer, at most 168 hours.

