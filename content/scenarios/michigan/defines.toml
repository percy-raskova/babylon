# One Designed regional freight allotment; not a physical road or border.
[shared_freight]
AMPLE_UNITS_PER_WEEK = 200 # 800 kg per 28-day period.
CONSTRAINED_UNITS_PER_WEEK = 40 # 160 kg per 28-day period.

# Statewide physical catalogue. All coefficients and stocks below are Designed.
# QCEW establishments qualify a template; observed jobs never set these amounts.
[statewide]
EVIDENCE_CLASS = "Designed"
FINITE_ORDER_PERIODS = 4
TERMINAL_ATTACHMENT_LIMIT_METERS = 50000

[statewide.EXPERIMENT]
FREIGHT_CAPACITY_KEY = "mackinac-bridge-freight"
CONSTRAINED_GRAMS_PER_PERIOD = 1000000 # Designed 1 tonne per 28-day period.
FOOD_PROCESS_KEY = "26097-31-33-prepared_food" # Mackinac County manufacturing.
PACKAGING_GOOD_KEY = "paper_packaging"
SHORTAGE_OPENING_UNITS = 80 # kg; the baseline opening stock is 160 kg.

[transport]
EVIDENCE_CLASS = "Designed"
ROAD_TRAVEL_PERIODS = 1 # One journey stage, irrespective of its physical edge count.
TRUCK_GROSS_WEIGHT_KG = 40000
TRUCK_HEIGHT_MM = 4000
TRUCK_WIDTH_MM = 2550
TRUCK_LENGTH_MM = 16500
DEFAULT_MAXHEIGHT_MM = 4000 # Designed bound for OSM maxheight=default; not measured clearance.
ROAD_CAPACITY_GRAMS_PER_PERIOD = 100000000
EXTRACTION_BUFFER_DEGREES_E7 = 100000 # 0.01 degree angular clipping buffer.

[merchant]
EVIDENCE_CLASS = "Designed"
HANDLING_GRAMS_PER_PERIOD = 5000000
LABOR_HOURS_PER_KG = 1
LABOR_HOURS_PER_ITEM = 10
EMPLOYED_PEOPLE = 20
RESERVE_PEOPLE = 4

# One bounded Wayne service provider. QCEW qualifies activity, not these values.
# Whole jobs grant expiring next-period batches; service is not a stored good.
[maintenance]
EVIDENCE_CLASS = "Designed"
CONSUMER_OPENING_METAL_STOCK = 2560 # kg; common across all four maintenance runs.
OPENING_SERVICE_BATCHES = 16
PROVIDER_OPENING_SPARE_PARTS = 256 # kg metal_parts.
SHORTAGE_OPENING_SPARE_PARTS = 0
SPARE_UNITS_PER_JOB = 1 # kg per completed job.
LABOR_UNITS_PER_JOB = 10 # current person-hours per completed job.
ENABLED_BATCHES_PER_JOB = 1
MAXIMUM_JOBS_PER_PERIOD = 16
EMPLOYED_PEOPLE = 1
RESERVE_PEOPLE = 0
SHORTAGE_EMPLOYED_PEOPLE = 0
SHORTAGE_RESERVE_PEOPLE = 1
REPLENISHMENT_ORDER_UNITS = 256 # Finite local order, allocated after maintenance.

