# Designed Michigan material parameters. Existing campaigns retain their stored values.
# One simulation period is four weeks; weekly rates are multiplied once when a campaign starts.
SCHEMA_VERSION = 4
TICK_DURATION_DAYS = 28 # Fixed supported interval.
HORIZON_PERIODS = 16 # Campaign stop bound: 1..=16 four-week periods.

