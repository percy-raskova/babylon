# Designed first national/world campaign policy. These are gameplay units,
# not source-derived production, subsistence thresholds or a forecast.
# Every price is millionths of one common currency unit; no exchange rates.
schema_version = 1
evidence_class = "Designed"
period_days = 28
work_hours_per_person = 160
default_wage_micros_per_hour = 24000000
opening_pantry_periods = 1
opening_input_periods = 2
working_capital_periods = 2
retailer_buffer_periods = 2
resource_reserve_output_periods = 1040
handling_hours_per_unit = 1
missing_peer_weight_per_establishment = 1 # Designed allocation points, never observed jobs.
household_enterprise_function = "household_services"

[markets]
foreign_procurement_bps = 2500 # A sourcing cap, not a promised realized flow.
journey_timing = "slowest_profile" # Administrative hops do not add 28-day delays.
service_reach = "same_state_or_own_counterpart"

[financial]
wage_tax_bps = 1500
operating_income_tax_bps = 1500
private_distribution_bps = 5000
reserve_food_support_periods = 1
cross_border_ownership_bps = 2000

[equipment]
batches_per_unit_per_period = 40
service_batches_per_unit = 4000
installation_hours_per_unit = 32
installation_inputs = { materials = 4 }
installation_workforce_hours_bps = 625
expansion_earnings_fraction_bps = 2500
opening_remaining_service_bps = [2500, 5000, 7500, 10000]

# Prices change through existing inspectable responsive market policies.
# Public grants pay provider costs; the small posted public fee is separate.

[commodity.food]
label = "Food for one person for 28 days"
unit_label = "person-period food parcel"
kind = "storable"
cargo_class = "general"
grams_per_unit = 14000
opening_price_micros = 280000000
minimum_price_micros = 70000000
maximum_price_micros = 1120000000
price_step_micros = 7000000

