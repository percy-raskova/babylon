[process.food]
output = "food"
output_units_per_batch = 16
labor_hours_per_batch = 16
inputs = { materials = 1, utility = 1, business_services = 1 }

[process.extraction]
output = "resources"
output_units_per_batch = 8
labor_hours_per_batch = 16
inputs = { resource_deposit = 8, utility = 1, business_services = 1 }

[process.energy_utilities]
output = "utility"
output_units_per_batch = 160
labor_hours_per_batch = 16
inputs = { resources = 8 }

[process.manufacturing]
output = "materials"
output_units_per_batch = 8
labor_hours_per_batch = 16
inputs = { resources = 8, utility = 2, business_services = 1 }

[process.capital_goods]
output = "equipment"
output_units_per_batch = 1
labor_hours_per_batch = 16
inputs = { resources = 8, materials = 4, utility = 2, business_services = 1 }

[process.construction_housing]
output = "housing"
output_units_per_batch = 16
labor_hours_per_batch = 16
inputs = { materials = 1, utility = 1 }

[process.household_services]
output = "household_services"
output_units_per_batch = 8
labor_hours_per_batch = 160
inputs = { materials = 1, utility = 1 }

[process.business_services]
output = "business_services"
output_units_per_batch = 16
labor_hours_per_batch = 160
inputs = { materials = 1, utility = 1 }

[process.public_provisioning]
output = "public_provision"
output_units_per_batch = 160
labor_hours_per_batch = 160
inputs = { materials = 1, utility = 1 }

[[household_needs]]
good = "food"
basis = "persons"
units_per_basis = 1

[[household_needs]]
