meta:
  contract: ArchiveFoundationGrantsV1
  version: 1
  issue: PER-23
  digest: SHA-256 diagnostic; exact bytes govern retry equality

production_decoder: prohibited

authority:
  owner: Rust persistence foundation grant seeder (ADR249 R3)
  purpose: >-
    Foundation knowledge-grant census seeded at campaign foundation from the
    pinned spatial reference products and the pinned glossary concept fixture,
    before any committed tick. The grant set is the fog floor: every
    public-reference subject is known at the cursory public-record keys, while
    the four public QCEW 2024 county baseline keys are granted with pinned
    artifact citations. Other composition and magnitude keys remain earned.
  classifications:
    grant_key_set: Designed
    grant_tick: Designed
    grant_row_set: Derived
    provenance_citations: Observed
  invariants:
    - Counties are the 83 Michigan public-reference counties of the pinned
      spatial products fixture (GEOID prefix 26, excluding the 999 statewide
      residual pseudo-county), granted subject + identity + containment at
      tick 0.
    - County public QCEW baseline grants cover establishments, annual-average
      employment, total annual wages, and average weekly wages. They are
      observed 2024 records, never current production or median wages.
    - Places are all 745 Michigan places of the pinned spatial products
      fixture, granted subject + identity + containment at tick 0; identity
      and containment rows carry their own pinned artifact citations.
    - Concepts are exactly the eight glossary fixture concepts, granted
      subject + identity at tick 0 with the glossary fixture citation.
    - Magnitude and composition keys (median-wage, phi-hour,
      class-composition, employment) are never seeded; they are earned,
      never granted at foundation.
    - Every insert is idempotent with an exact-reconcile refusal, so an exact
      retry reports the same census and a drifted row refuses loudly.
    - The independent verifier reassembles the grant rows from the pinned
      fixture bytes and recomputes semantic_sha256 over the canonical
      sorted (subject_kind, subject_id, grant_key) encoding.

constants:
  grant_tick: 0
  county_grant_keys:
    - subject
    - identity
    - containment
  county_qcew_grant_keys:
    - qcew-establishments
    - qcew-employment
    - qcew-total-annual-wages
    - qcew-average-weekly-wage
  qcew_source_id: qcew-county-economics-v1
  qcew_locator_prefix: qcew_county_economics_mi_2024.csv.gz#county_geoid=
  qcew_artifact_path: src/babylon/data/reference/economy/qcew_county_economics_mi_2024.csv.gz
  qcew_artifact_sha256: 116affb2998c6c0259d5bf14840f99f835d7e0733aa0b4f4c60a257b2723cd16
  place_grant_keys:
    - subject
    - identity
    - containment
  concept_grant_keys:
    - subject
    - identity
  county_source_id: h3-estate-contract-v1
  county_locator_prefix: dim_county.parquet#fips=
  place_identity_source_id: census-place-authority-v1
  place_identity_locator_prefix: census_place_identity_mi_2023.csv.gz#place_geoid=
  place_containment_source_id: county-place-h3-overlap-v1
  place_containment_locator_prefix: census_county_place_h3_land_overlap_mi_2023.parquet#place_geoid=
  concept_source_id: glossary-concepts-v1
  concept_locator_prefix: contracts/fixtures/glossary_concepts_v1.jsonl#concept_id=
  michigan_geoid_prefix: "26"
  statewide_residual_county_fips: "999"
  expected_counties: 83
  expected_places: 745
  expected_concepts: 8
  expected_grant_rows: 2832
  spatial_fixture_digest: dea8a368d5b7c5a0f1263af2945ffdd94e3914394ec579ca28508661e4464454
  glossary_fixture_path: contracts/fixtures/glossary_concepts_v1.jsonl
  glossary_fixture_sha256: f47e289dc4e7a11c595f0e42643e352e255775c77dde3a7ed35a91de8d84d85a
  semantic_domain_ascii_nul: babylon.archive-foundation-grants.v1
  semantic_sha256: 9bb3cdda37dc3dee59242fcfe08f6c3f5bac01ff433988383d459fa0df9dfc65

bounds:
  contract_bytes: 32768
  grant_rows: 4096
  grant_key_bytes: 128
  citation_source_id_bytes: 128
  citation_locator_bytes: 4096
  spatial_fixture_bytes: 4194304
  glossary_fixture_bytes: 65536
  qcew_artifact_bytes: 1048576

layouts:
  grant_row_v1:
    fields:
      - subject_kind
      - subject_id
      - grant_key
      - citation_source_id
      - citation_locator
      - grant_tick
    order: sorted by (subject_kind, subject_id, grant_key)
    subject_kind_domain:
      - county
      - place
      - concept
  semantic_encoding_v1:
    domain: semantic_domain_ascii_nul plus one trailing NUL byte
    row_prefix: u64 big-endian grant row count
    per_row: five length-prefixed UTF-8 fields then one u64 big-endian grant tick
    digest: SHA-256 over the concatenation
  spatial_fixture_v1:
    framing: >-
      16-byte magic, u32 big-endian version 1, 32-byte reference digest,
      seven u32 big-endian section counts
    counties_row: >-
      u32 county_id, 5-byte geoid, u16 state_id, 3-byte fips,
      u8-length-framed name
    places_row: >-
      7-byte geoid, 2-byte state_fips, 5-byte place_fips, 8-byte place_ns,
      u8-length-framed name, u8-length-framed name_lsad, 2-byte lsad,
      2-byte class_fp, 1-byte principal_city_indicator, 5-byte mtfcc,
      1-byte functional_status

vector_kinds:
  required: []
