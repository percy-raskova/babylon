  compensation_tag: {wage: 1, working_owner: 2, unpaid_family: 3}
  ordering:
    families: Tags 1 through 32 appear exactly once in declared order, including empty families.
    original_families: Preserve deterministic encounter order from babylon_material_circuit::advance_material_circuit.
    handling: Strict increasing unique site_id_and_tagged_outbound_order.
    local_fulfillment: Strict increasing unique order_id.
    local_transfer: Strict increasing unique order_id.
    money_transfers: Preserve deterministic chronological execution order; do not sort by principal or purpose.
    wage_accruals: Preserve attendance execution order with unique shift identities; hashed shift IDs are not sorted.
    labor_use: Strict increasing unique site_id_and_unit_id.
    staffing_members: Strict increasing pool_id_and_member_id with globally unique member IDs.
    member_labor_use: Strict increasing site_id_unit_id_member_id with globally unique member IDs.
    household_demand: Strict increasing unique principal_good_unit; quoted order identities are unique.
    household_consumption: Strict increasing unique principal_good_unit.
    procurement: Strict increasing unique buyer_supplier_good_unit; quoted order identities are unique.
    production_plans: Strict increasing unique process_id.
    prices: Strict increasing unique site_good_unit.
    income: Strict increasing unique account.
    installation: Strict increasing process_id and installation_id.
    equipment_wear: Strict increasing process_id and cohort_id.
    investment: Strict increasing process_id.
    service_performance: Strict increasing unique order_id.
    household_services: Strict increasing unique principal_good_unit.
    service_markets: Strict increasing unique site_good_unit.
    service_outputs: Strict increasing unique site_good_unit.

  validation:
    - Installation and wear belong to resolve_tick and prove exact remaining-work, service-life and carrying partitions.
    - Installation completion grants only checked next-period usability; full wear exhaustion leaves zero carrying cost.
    - Investment admits no more than requested quantities and actual captured free cash can fund at its positive quote.
    - Equipment receipt equations cannot authenticate absent state policies, cohort identities or balances.
    - Member opening and closing employed plus reserve equal the immutable member force; transfers conserve persons.
    - Each member next hours equals closing employed times captured schedule, with checked integer arithmetic.
    - Available hours equal planned plus unplanned; planned equals attended plus unattended for each member.
    - Attended hours equal production plus handling plus maintenance plus installation plus idle hours.
    - Wage mode has positive rate and exact earned/use amounts; non-wage modes require zero rate and wage amounts.
    - Aggregate labor is the exact sum of member receipts; paid and unpaid idle hours remain distinct.
    - Every positive employee attendance has one exact member-domain wage accrual with matching principals and amount.
    - Where both families are present, staffing and attendance member identities, payees and opening hours agree.
    - Reject wrong domain, version, family tag, truncation or trailing bytes.
    - Produced batches cannot exceed planned batches.
    - Staged dispatch quantity is positive and final arrival is later than resolve_tick.
    - Loss, physical arrival, delivery, realization and local transfer quantities are positive.
    - Local final fulfillment quantity is positive; zero fulfillment has no positive movement row.
    - Handling refuses period_service identities; services never use freight or merchant handling mass.
    - Handling permits completed zero but handled_quantity cannot exceed feasible_quantity.
    - Used hours cannot exceed needed hours and both quantity-hour pairs agree on zero.
    - The exact quantity-hour cross-products agree in u128 arithmetic.
    - Local internal supplier and buyer must be distinct.
    - Maintenance is absent without a binding; a bound completed-zero close retains its row.
    - Maintenance coefficients are positive and spare and labor units differ.
    - The maintenance period equals the resolve tick and next service belongs to its checked successor.
    - Opening service equals consumed plus expired service and does not exceed the checked ceiling.
    - Available parts equal opening parts plus due freight arrivals; local credits are excluded.
    - Requested jobs equal prospective batches divided by enabled batches with ceiling rounding.
    - Completed jobs equal the minimum request, job ceiling, parts quotient and labor quotient.
    - Checked products prove exact spare and labor debits and the following service grant.
    - A maintenance request whose labor product overflows is refused even if parts or labor are absent.
    - Every money debit is negative and credit positive; checked signed addition must equal zero.
    - Every purpose requires the corresponding cash/reserve endpoint shapes and matching order or shift identities.
    - Cash transfers use distinct account identities; tagged owner namespaces remain distinct.
    - Unknown tags and nonzero unused subtype or identity padding are refused.
    - Wage accrual has distinct parties, positive hours and amount, and period equal to resolve_tick.
    - Labor use belongs to resolve_tick; checked available equals planned plus unplanned,
      planned equals funded plus unfunded, and funded equals used plus paid idle.
    - Duplicate wage shift IDs and duplicate or unsorted labor site-unit identities are refused.
    - All recurring rows belong to resolve_tick; production plans target its checked successor.
    - Household required quantity is positive; desired covers at least required minus opening stock.
    - Requested cannot exceed desired; admitted cannot exceed requested; fulfilled plus expired equals admitted.
    - Purchase unit prices are positive and admitted quantity times price fits signed micro-currency.
    - Consumption is the minimum of actual available stock and required quantity.
    - Checked consumed plus unmet equals required; consumed plus closing equals available.
    - Procurement has distinct parties; checked on-hand plus outstanding inbound determines stock position.
    - Desired procurement cannot exceed target minus position; admitted cannot exceed desired.
    - Checked dispatch plus unshipped plus buffer determines target output; closing stock reduces wanted output.
    - Planned batches are zero exactly when wanted output is zero and cannot exceed wanted units.
    - Exact batches need the absent positive output-per-batch coefficient; a standalone row cannot prove it.
    - Old and next prices are positive; fixed or hold decisions retain the same price.
    - Unserved-demand decisions require unserved quantity and cannot reduce price; ceilings can retain it.
    - Excess-stock decisions require zero unserved quantity and positive stock and cannot raise price.
    - Goods cost basis is unavailable with zero quantity and zero amounts,
      or produced or released with positive quantity.
    - Produced cost cannot include handling wages; every amount is nonnegative and checked total cost fits currency.
    - Cost-pressure decisions require exact rounded-up unit cost above the old quote and cannot reduce price.
    - Hold and excess-stock decisions cannot override an observed cost shortfall; fixed offers can disregard it.
    - Unknown price reasons and duplicate or noncanonical recurring keys are refused.
    - Income rows have unique canonical account order and period equal to resolve_tick.
    - Income flows are nonnegative; net income and retained earnings are signed exact micro-currency.
    - Net income includes sales, wages, tax, operating transfers and distributions less COGS and named expenses.
    - Capital contributions and productive capitalization are not income or current expenses.
    - Closing retained earnings equal opening retained earnings plus net income less distributions paid.
    - Closing contributed capital equals opening contributed capital plus contributions received.
    - Financial receipts use exact current periods, closed tags, nonnegative partitions and canonical unique keys.
    - Tax assessment equals floor of captured taxable amount times the rate; collected plus uncollected equals
      assessment.
    - Each distribution issuer group proves share totals, common declared amount and exact stable remainder allocation.
    - Financial receipt payment totals exactly match their corresponding cash transfer purpose and account pair.
    - Standalone receipts do not prove absent policy caps, cash floors, ownership claims or tax eligibility.
    - Service receipts belong to resolve_tick; service market next_period is its checked successor.
    - Service prices are positive; admitted-price products fit exact signed currency.
    - Service admitted does not exceed requested; performed plus expired equals admitted; used plus unused equals
      performed.
    - Household service satisfaction equals minimum required and acquired, with exact unmet and unused partitions.
    - Service produced quantity equals allocated plus expired; nonnegative expired cost cannot exceed direct cost.
    - Zero output has zero direct cost; zero expiry has zero expired cost; full expiry takes all direct cost.
    - Service market performance cannot exceed admission or captured native capacity; decisions follow their
      declared direction.
  service_price_decision_tag: {fixed: 1, hold: 2, funded_unmet: 3, cost_pressure: 4, spare_capacity: 5}
  interpretation:
    native_quantity: Identified good-unit quantity; gram reservations use the captured mass coefficient.
    handling_need: Resource-feasible work before opening labor limits actual outbound movement.
    final_fulfillment: A finite demand-account credit, without a freight lot or claim of actual consumption.
    local_transfer: One supplier debit and buyer credit, without physical arrival or staged-dispatch receipts.
    maintenance: Next-period service is neither a commodity shipment nor bankable inventory.
    money_transfers: >-
      A reserve is the single money principal; reservation is not sales revenue and arrival authorizes settlement.
    wage_accruals: >-
      The obligation is separate from payment and actual production; paying a prior unpaid shift creates no new accrual.
    labor_use: >-
      Unplanned hours are outside scheduled attendance; unfunded hours remain unperformed planned employee work.
      Funded plus non-wage attendance equals used plus paid idle plus unpaid idle hours.
      Employment stocks remain graph-owned and are separate from funded attendance.
    recurring: >-
      Household need, desired purchases, funded admission, fulfillment and consumption are distinct.
      Procurement, production caps and next prices explain decisions without promising execution.
      Receipt validation alone cannot authenticate policy targets, prices, recipe coefficients,
      opening cash or inventory against an absent state.
      Goods cost is a committed per-good posting claim, not a value theory or guaranteed margin.
      Produced and released bases are exclusive; released carrying includes unsold seller-owned transit.
      A consumer joins native quantities and actual handling wages to physical and member receipts.
      Account-wide COGS alone cannot prove exact carrying attribution among mixed goods; those joins must
      preserve that proof boundary rather than duplicate the historical-cost allocator.
    income: >-
      Historical transaction-cost bookkeeping, not a measurement of surplus value or social labor.
      Standalone rows prove their equations; account net assets and physical carrying keys require the complete state.
    services: >-
      Provider-expired output cost is included in direct cost; unused acquired service has the buyer purchase basis.
      No service receipt claims durable stock. Standalone market rows cannot establish absent recipe or policy values.
    authentication: Register and receipt identity, coefficient and account joins are verified before disclosure.
  maximum_rows_per_family: 65536
  maximum_handling_rows: 131072
  handling_bound: >-
    At most N first-pass orders plus N new procurement orders after generated retail principals retire.
    Delivery principals remain live through both passes, so dispatch and local-transfer families retain N.
  maximum_member_and_wage_accrual_rows: 131072
  maximum_money_transfer_rows: 1441792
  maximum_service_performance_rows: 196608
  money_transfer_bound: >-
    3M covers prior and current member payroll. 16N covers purchase, household, procurement,
    service, public-budget, tax, distribution contribution and equipment purchase movements. M is the member limit;
    N is the ordinary state-family limit. State and aggregate byte ceilings remain independent.
  maximum_complete_bytes: 67108864
persistence:
  material_rows: babylon_state.material_tick_v3
  marker: babylon_state.tick_commit_with_envelope_layout_version_3
  marker_order: Final durable statement, after full checkpoint, material rows and Archive outbox.
  success: Acknowledgement only after COMMIT or exact reconciliation of the same committed candidate.
  restart: Verify contiguous V3 markers, full eight-family envelope, captured foundation and combined world hash.
  incompatible_campaign: Refuse reopening without changing stored data; no implicit material or content upgrade.
  material_campaign: Cannot receive a graph-only V2 marker.
related_contracts:
  - contracts/material_circuit_v3.yaml
  - contracts/material_world_register_v4.yaml
  - contracts/nominal_material_world_v3.yaml
  - contracts/material_campaign_foundation_v3.yaml
