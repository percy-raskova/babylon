meta:
  contract: CommittedTickEnvelopeV1
  version: 1
  issue: PER-20
  byte_order: big-endian
  digest: SHA-256 diagnostic; exact bytes govern retry equality

production_decoder: prohibited

authority:
  owner: Rust persistence boundary
  purpose: complete database-free payload for one future marker-last tick transaction
  classifications:
    layout_version: Designed
    domain_tags_and_order: Designed
    row_family_partition: Designed from ADR220 mandatory outputs
    cumulative_bounds: Designed from existing identity aggregate and section ceilings
    fixture_values: Designed
  invariants:
    - Every envelope contains all five live row-family sections.
    - Archive dirty receipt is singular and mandatory; every other live family is sparse.
    - Each family uses exact nonempty canonical key bytes in strict ascending order.
    - A family body has at least nine bytes for every declared row.
    - Row payload bytes remain owned by the typed producer for that row family.
    - The kernel-owned TickContentHashV1 remains distinct from the envelope diagnostic.
    - A retry is idempotent only when the claim and every canonical envelope byte match.

constants:
  domain_ascii_nul: babylon.committed-tick-envelope.v1
  layout_u32: 1
  claim_tag_u8: 1
  claim_bytes: 93
  family_count: 5
  row_length_field_bytes: 4
  fixed_envelope_bytes: 182
  max_envelope_bytes: 335544502

bounds:
  schema_bytes: 65536
  vector_rows: 64
  vector_line_bytes: 16384
  vector_object_fields: 64
  vector_family_rows: 64
  aggregate_rows: 1048576
  family_body_bytes: 67108864

layouts:
  claim_link_v1:
    owning_type: babylon_persistence::tick_commit_claim::TickCommitClaimV1
    fields: [claim_tag_u8_1, claim_length_u32_93, exact_claim_bytes93]
  row_v1:
    fields: [key_length_u32, nonempty_exact_key_bytes, payload_length_u32, exact_payload_bytes]
    order: strict ascending exact key bytes within family
    duplicate_keys: prohibited
  family_section_v1:
    fields: [family_tag_u8, row_count_u32, body_length_u32, exact_ordered_rows]
    empty_encoding: tag plus zero row count plus zero body length
  committed_tick_envelope_v1:
    fields:
      - domain_ascii_nul
      - layout_u32_1
      - claim_link_v1
      - graph_section
      - state_section
      - event_section
      - checkpoint_section
      - archive_dirty_receipt_section
    key: [campaign_id, resolve_tick]

row_families:
  - {name: graph, tag_u8: 16}
  - {name: state, tag_u8: 17}
  - {name: event, tag_u8: 18}
  - {name: checkpoint, tag_u8: 22}
  - {name: archive_dirty_receipt, tag_u8: 23}

archive_dirty_receipt:
  cardinality: exactly_one
  producer: campaign_work
  row_key: fixed_archive_dirty_receipt_v1_prefix
  payload: IdentifiedTickReportV1.tick_content_hash_exact_32_bytes
  typed_relation_primary_key: [campaign_id, resolve_tick]
  caller_subject: prohibited
  empty_proof: prohibited

retry_semantics:
  requested_against_existing:
    different_key: key_mismatch
    same_key_different_tick_content_hash: content_identity_mismatch
    same_claim_same_exact_envelope_bytes: idempotent
    same_claim_different_exact_envelope_bytes: whole_payload_mismatch

vector_families:
  required: [envelope, mutation, retry, refusal, bound]

excluded_authority:
  - Semantic row codecs or material-mechanic interpretation
  - PostgreSQL DDL, connection, transaction, or acknowledgement
  - Marker-last execution, crash injection, hydration, or lost-tail replay
  - Python writer changes or Rust writer authority
  - Archive processing outside exact dirty-receipt payload bytes
  - Any substitution for TickContentHashV1
