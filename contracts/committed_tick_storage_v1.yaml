meta:
  contract: CommittedTickStorageV1
  version: 1
  issue: PER-20
  authority: additive PostgreSQL schema and database-free Rust row mapping

migration:
  version: 4
  file: rust/crates/babylon-persistence/migrations/0004_committed_tick_storage.sql
  sha256: 496509cd05a5b911e933139cd28bbe281fe9c131560c3efca6bdf1ba8abb7dcf
  transaction_owner: babylon-persistence schema epoch migrator
  marker_order: schema_migration row is the final statement before commit
  origin_contracts: [fresh, exact_legacy, exact_rust_prefix]
  public_authority: none
  babylon_intel_authority: none

campaign:
  relation: babylon_state.campaign
  rust_mapping:
    - {source: CampaignId, column: campaign_id, postgresql: UUID}
    - {source: replay_layout_v1, column: replay_layout_version, postgresql: SMALLINT}
    - {source: rng_layout_v2, column: rng_layout_version, postgresql: SMALLINT}
    - {source: ReplaySessionIdV1, column: replay_session_id, postgresql: TEXT_COLLATE_C}
    - {source: ReplaySeed, column: rng_seed, postgresql: BIGINT}
    - {source: ContentDigest.defines_hash, column: defines_hash, postgresql: BYTEA_32}
    - {source: ContentDigest.rules_hash, column: rules_hash, postgresql: BYTEA_32}
    - {source: RefDigestV1, column: ref_digest, postgresql: BYTEA_32}
  primary_key: [campaign_id]
  reference_foreign_key:
    columns: [ref_digest]
    destination: babylon_ref.h3_reference_cohort(ref_digest)
    timing: DEFERRABLE_INITIALLY_DEFERRED

tick_commit:
  relation: babylon_state.tick_commit
  rust_mapping:
    - {source: TickCommitClaimV1.campaign_id, column: campaign_id, postgresql: UUID}
    - {source: TickCommitClaimV1.resolve_tick, column: resolve_tick, postgresql: NONNEGATIVE_BIGINT}
    - {source: CommittedTickEnvelopeV1.layout, column: envelope_layout_version, postgresql: SMALLINT_V1}
    - {source: TickCommitClaimV1.tick_content_hash, column: tick_content_hash, postgresql: BYTEA_32}
    - {source: CommittedTickEnvelopeV1.digest, column: envelope_digest, postgresql: BYTEA_32_DIAGNOSTIC}
  primary_key: [campaign_id, resolve_tick]
  campaign_foreign_key:
    columns: [campaign_id]
    destination: babylon_state.campaign(campaign_id)
    timing: DEFERRABLE_INITIALLY_DEFERRED

family_row_shape:
  columns:
    - {source: TickCommitClaimV1.campaign_id, column: campaign_id, postgresql: UUID}
    - {source: TickCommitClaimV1.resolve_tick, column: resolve_tick, postgresql: NONNEGATIVE_BIGINT}
    - {source: CommittedTickStorageRowV1.row_ordinal, column: row_ordinal, postgresql: INTEGER_0_TO_1048575}
    - {source: CommittedTickRowV1.key, column: row_key, postgresql: BYTEA_NONEMPTY_MAX_67108856}
    - {source: CommittedTickRowV1.payload, column: row_payload, postgresql: BYTEA_MAX_67108855}
  primary_key: [campaign_id, resolve_tick, row_ordinal]
  marker_foreign_key:
    columns: [campaign_id, resolve_tick]
    destination: babylon_state.tick_commit(campaign_id,resolve_tick)
    timing: DEFERRABLE_INITIALLY_DEFERRED
  canonical_order: row_ordinal is the zero-based position in strict ascending row_key order
  opaque_key_indexing: none

historical_epoch4_relations:
  - {family: graph, tag_u8: 16, relation: babylon_state.tick_graph_row}
  - {family: state, tag_u8: 17, relation: babylon_state.tick_state_row}
  - {family: event, tag_u8: 18, relation: babylon_state.tick_event_row}
  - {family: subsystem, tag_u8: 19, relation: babylon_state.tick_subsystem_row}
  - {family: conservation, tag_u8: 20, relation: babylon_state.tick_conservation_row}
  - {family: boundary_flow, tag_u8: 21, relation: babylon_state.tick_boundary_flow_row}
  - {family: checkpoint, tag_u8: 22, relation: babylon_state.tick_checkpoint_row}
  - {family: archive_dirty_receipt, tag_u8: 23, relation: babylon_state.tick_archive_dirty_receipt_row}

live_writer_targets:
  - {family: graph, tag_u8: 16, relation: babylon_state.tick_graph_row}
  - {family: state, tag_u8: 17, relation: babylon_state.tick_state_row}
  - {family: event, tag_u8: 18, relation: babylon_state.tick_event_row}
  - {family: checkpoint, tag_u8: 22, relation: babylon_state.tick_checkpoint_row}
  - {family: archive_dirty_receipt, tag_u8: 23, relation: babylon_state.tick_archive_dirty_receipt_row}

invariants:
  - The five live writer targets are closed, ordered, and one-to-one.
  - The eight epoch-4 relations remain an immutable historical migration fact.
  - All relation and column identities are schema-qualified and fixed.
  - Exact envelope validation happens before any future parameter binding.
  - >-
    The bounded row ordinal is a collision-free physical identity that keeps
    every valid opaque row key storeable without a B-tree entry over those bytes.
  - Family rows reference the marker through deferred foreign keys so a future transaction can insert the marker last.
  - The schema epoch must remain an exact contiguous version and checksum prefix.
  - Failed or ambiguous migration outcomes reconcile against the durable prefix.

excluded_authority:
  - PostgreSQL committed-tick writes or acknowledgements
  - Runtime construction of RustWriterAuthority
  - Python writer or migrator retirement
  - Hydration, checkpoint selection, crash recovery, or lost-tail replay
  - Archive processing outside the exact dirty-receipt row family
  - Semantic interpretation or encoding of any family row payload
