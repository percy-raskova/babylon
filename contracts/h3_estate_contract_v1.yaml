    - add measure-specific babylon_ref relations and positive BIGINT shadow keys
    - import only hash-proved governed artifact bytes
    - bounded backfill with invalid unknown duplicate and conflict refusals
    - prove counts semantic digests ancestry query and compatibility equivalence
    - validate constraints and indexes
    - publish schema-qualified versioned compatibility and observer views
    - move read-only readers and compare old and new ordered queries
    - join the one-way PER-20 writer cutover only after full parity
    - retire legacy tables and the unused domain in a later reviewed ceremony
