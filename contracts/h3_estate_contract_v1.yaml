  vector_bytes: 65536
  vector_lines: 256
  persistent_tables: 15
  current_views: 10
  temporary_shapes: 2
  runtime_consumers: 41
  artifacts: 6
  artifact_rows: 65536
  artifact_bytes: 67108864

conversion_policies:
  required_h3:
    source: canonical lowercase legacy text
    target: checked positive BIGINT referencing babylon_ref.h3_cell(cell_id)
    conflict: refuse invalid, unknown, noncanonical, negative, duplicate, or mismatched identity
    compatibility: reproduce the exact lowercase legacy text
  nullable_h3:
    source: null or canonical lowercase legacy text
    target: null or checked positive BIGINT referencing babylon_ref.h3_cell(cell_id)
    conflict: preserve null; otherwise apply required_h3 refusal law
    compatibility: preserve null or reproduce exact lowercase legacy text
  tagged_h3_or_external:
    source: H3 text when kind=hex; canada or rest_of_usa when kind=external
    target: nullable checked cell_id plus a closed destination kind and preserved external literal
    conflict: refuse kind/value disagreement and never coerce an external literal
    compatibility: reproduce the exact legacy workplace_dest text

