authority:
  purpose: Migration-ready H3 estate and governed artifact handoff without database mutation
  evidence_law: CONSTITUTION.md Article IV
  architecture_record: docs/superpowers/specs/2026-08-22-rust-postgresql-persistence-boundary-design.md
  canonical_identity: babylon_ref.h3_cell(cell_id)
  canonical_rust_type: H3CellId(u64)
  canonical_sql_type: positive BIGINT
  compatibility_text: lowercase hexadecimal without prefix or padding
  classifications:
    legacy_estate_inventory: Observed
    artifact_bytes_and_extents: Observed
    measure_rows: Derived
    framing_and_conversion_contracts: Designed
  excluded_authority:
    - PostgreSQL DDL or schema epoch changes
    - Runtime database reads or writes
    - Compatibility view creation
    - Reader or writer cutover
    - Legacy-write prohibition or retirement
    - Place or nationwide overlap completion
    - Any authority from /media/user/data/babylon-data or runtime rows

bounds:
