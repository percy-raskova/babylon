  process_outputs:
    - process_id
  input_output_coefficients:
    - process_id
    - good_id
    - unit_id
  labor_coefficients:
    - process_id
  supplier_routes:
    - buyer_site_id
    - supplier_site_id
    - good_id
    - unit_id
  route_legs:
    - route_id
    - leg_index
  inventory:
    - site_id
    - good_id
    - unit_id
  orders:
    - order_id
  backlog:
    - order_id
  routed_freight_lots:
    - leg_arrival_week
    - lot_id
  corridor_capacity:
    - departure_week
    - corridor_id
    - unit_id
  process_capacity:
    - week
    - site_id
    - process_id
  labor_capacity:
    - week
