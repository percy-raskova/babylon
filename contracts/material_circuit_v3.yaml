admission:
  - each economic site has exactly one captured logistics access point; distinct sites may share that point
  - shared logistics access never merges site stock ownership, orders, cash accounts, or capacity claims
  - each supplier relation selects one relationship identity and explicit local or staged transport
  - local relations connect distinct known sites and have no timed stages or memberships
  - staged relations have connected positive timed stages; one relationship cannot mix transport modes
  - stages are contiguous, connected, and positive-duration
  - every stage has a nonempty unique set of capacity memberships
  - every capacity membership references an existing stage
  - every capacity budget references a principal in stage memberships or merchant handling
  - every order and supplier good-unit principal has one positive mass coefficient
  - extra mass coefficients and unused route topology may remain
  - finite-schedule missing period capacity means zero availability, not a malformed register
  - every merchant owns a unique handling capacity disjoint from route capacities
  - production and merchant work at one site share its inventory and exact site-unit labor budget
  - every merchant site has a logistics access point, checked economic location, and one labor-unit principal
  - each merchant outbound good-unit has positive exact handling hours and mass per native unit
  - each final-demand principal has one unique identity and account; distinct households may share a location
  - a local order names a retail merchant in its demand principal economic location
  - local order quantities satisfy zero <= fulfilled <= ordered with ordered positive
  - routed and local order identity domains are disjoint even if their raw order IDs match
  - all ordinary material and production invariants remain enforced
  - accounting mode is explicit; absent monetary data never selects a physical control
  - monetary accounts are nonnegative and unique; all material sites and household principals have cash rows
  - site and household account identities reference known material owners;
    organization and public namespaces are distinct
  - monetary member terms bind unique member IDs, a site-unit, resident payee and explicit compensation
  - positive wage rates create obligations; working-owner and unpaid-family modes create no wages or ownership
  - member schedule totals exactly cover each declared site-unit period budget; zero-force workplaces may be empty
  - every purchase reserve matches its physical order identity, parties, quantity, delivered quantity, and lost quantity
  - a monetary commodity sale has realized quantity equal to its accepted delivered quantity
  - a final-demand purchase reserve matches fulfilled quantity and has no refunded quantity in this close
  - committed shift rows contain only accrued unpaid obligations earned in a positive period before the opening period
  - all monetary row families have strictly increasing canonical keys before book reconstruction
  - recurring households are explicit resident cohorts, never inferred from workplace jobs
  - each configured household need has a purchase policy; only stored goods have an explicit pantry row including zeros
  - period-service household needs have no pantry, zero stock target and a captured provider connection
  - household service providers need not be Retail merchants
  - every finite order of a configured household names a captured recipient stock before admission
  - recurring production has one policy per process and at most one process per site-output-good-unit
  - recurring attendance exactly covers distinct employment and current labor principals at the opening period
  - an attendance principal without employment has an explicit zero available-hours row and zero planned hours
  - multiple resident members retain separate payees and share one workplace attendance plan
  - desired production or handling at an empty workplace cannot create workers, funded hours, wages or output
  - both recurring household phase cursors equal the preceding period at a canonical opening
  - responsive quotes remain inside positive captured bounds; admitted escrows retain their own prices

allocation:
  order_request: full remaining native quantity
  inventory_request: native quantity
  capacity_request: native quantity multiplied by grams_per_unit
  intermediate: checked u128 request products and group sums
  resource_grant: floor(available_resource * resource_request / total_requested)
  native_grant: floor(resource_grant / resource_per_native_unit)
  feasible_outbound: minimum native grant across inventory and every route or merchant handling capacity
  labor_request: feasible merchant native quantity multiplied by hours_per_unit
  actual_outbound: minimum feasible native quantity and the same proportional-floor reducer applied to opening labor
  labor_scope: routed and local merchant orders share one site-unit labor budget
  handling_reservation: actual native outbound multiplied by grams_per_unit once at departure period
  handling_labor_debit: actual native outbound multiplied by hours_per_unit once
  handling_need: checked u64 feasible outbound multiplied by hours_per_unit, independent of current employment
  reservation: actual native dispatch multiplied by grams_per_unit, once per unique capacity/departure principal
  residual: no redistribution after proportional flooring or another resource limit
  missing_route: leave unshipped order in backlog
  failed_close: publish no successor state or receipt

period_close:
  - complete due stages and attribute stage-specific native-unit loss
  - credit retained final arrival to destination inventory once
  - settle accepted arrived quantities and refund newly lost quantities from their existing purchase reserves
  - retire already settled prior purchase principals before new admissions need their bounded slots
  - execute due captured capital contributions from pre-phase cash, preserving exact equity and issuer capital
  - fund captured public allocations from finite current cash and appropriation caps in priority order
  - pay outstanding earned wages from their existing payroll reserves
  - fund planned attendance in canonical site-unit order, bounded by spendable cash and available whole hours
  - accrue and pay each funded attendance commitment before work; productive utilization is recorded separately
  - admit recurring household orders after payroll, sharing actual cash in canonical household-good-unit order
  - admit finite current service requirements from captured production commitments and input coefficients, bounded
    by cash and policies
  - execute UtilityProvision then LocalServiceProvision then GoodsProduction through shared input, labor and
    process residuals
  - each service stage produces complete funded-request-bounded batches and grants finite output through the
    existing outbound allocator
  - settle actual service grants and refund unperformed orders; expire unallocated provider output at exact
    remaining cost
  - complete all service seller debits and provider expiry before crediting that stage buyers
  - direct household service satisfaction consumes current performance without pantry stock
  - expense unused acquired service grants and remove all transient service quantity and carrying rows before
    publication
  - expire unused opening service and perform whole maintenance jobs from inputs before outbound local credits
  - consume actual equipment service life during production and capitalize exact historical wear into output
  - start installation from arrived equipment and complete complementary materials; consume shared residual worker hours
  - completed installation becomes usable only next period; unfinished work and its carrying value persist
  - allocate routed and local outbound requests against shared stock, route mass and merchant handling mass
  - record merchant feasible quantities before current labor
  - constrain feasible handling with opening labor through the same resource reducer
  - reserve future-stage capacity before dispatch
  - debit supplier inventory and create one lot and dispatch receipt per positive order/period grant
  - debit local internal supplier stock and advance shipped, delivered, and realized together
  - debit merchant handling mass and labor exactly once per actual outbound
  - debit retail stock and credit positive local order fulfillment exactly once without a freight lot
  - record handling receipts including explicit zero feasible and actual work
  - credit actual household handoffs to stock and settle them; expire unfilled recurring requests with refunds
  - replenish firm inventory positions, counting undelivered order quantities once including their transit
  - allocate only newly admitted deliveries in a second pass through the same remaining resource budgets
  - credit local internal buyers only after both outbound passes fix all grants and debits
  - local credits cannot feed another outbound order until a following close
  - settle actual local supplier transfers and retail handoffs from their admitted purchase reserves
  - consume recurring household needs from actual stocks, retaining unmet consumption as dated evidence
  - record used, paid idle, planned unfunded, and available unplanned hours separately
  - assess captured eligible wage and positive operating-income taxes after actual costs and wage accrual
  - collect taxes only from cash above captured floors; record uncollected amounts without creating claims
  - resolve an original authenticated Collect ruling from independently captured household cash consent after
    actual reproduction and due taxes, freezing eligible free cash before ownership distributions and collection
  - protect every current captured household storable and service requirement, closing purchase-policy stock
    target, due tax and capital payment; existing purchase, payroll and aid reserves are never free cash
  - exclude earlier current-period MutualAid and aid cash grant credits from the frozen collection source;
    an ownership payout cannot retroactively fund this period's collection
  - transfer one all-or-zero capped household cash gift to its existing aid mandate's organizational payer using
    Cash(MutualAid); close gift expense and income once and retain its exact canonical transfer ordinal
  - consume whole actual collection hours from the same finite donor household contribution capacity after
    physical aid fulfillment; an acknowledgment cannot consume those hours again, and it reduces the donor
    political promise once before delayed coordination
  - retain the original command, admission and resolve periods, captured mandate and source, exact donor and
    payer, actual amount, refusal reason and shared contribution use in the bounded V17 receipt family36;
    actual voluntary payment creates no membership, agreement, recurring withdrawal or new hour supply
  - distribute positive post-tax retained earnings only within cash, fraction and cap, using captured ownership
  - admit ordinary equipment orders from post-financial free cash and explicit replacement or expansion policies
  - derive subsequent production from dispatched and unfulfilled demand, output stock, and captured buffers
  - forecast already funded freight due before subsequent production without crediting current usable inventory
  - derive subsequent attendance from distinct production, merchant, maintenance and installation work requests
  - update next goods quotes from captured fixed or bounded stock-and-unserved-demand policies
  - update next service quotes from funded unmet requests, native capacity and whole-batch cost including provider
    expiry
  - retire terminal physical and financial purchase principals together after their evidence is recorded
  - audit total cash plus live purchase, payroll and aid reserves without counting wage claims as extra money
  - rebuild unshipped backlog
  - derive next-period staffing and production through their existing exact rules
  - prune finite scheduled capacity or install rolling next-period budgets net of due advance reservations
  - validate the successor without generating additional capacity

transit:
  lot_identity: SHA256(freight_lot_domain + terminator + order_id + dispatch_period_u64)
  arrival: dispatch period plus cumulative stage durations
  loss: floor(native_quantity * loss_ppm / 1000000)
  loss_receipt: [lot_id, order_id, route_id, stage_index, quantity]
  dispatch_receipt: [lot_id, order_id, route_id, quantity, final_arrival_period]
  conservative_capacity: later loss never releases advance reservations
  geometry: many physical edges and capacity memberships may share one timed stage

conservation:
  - realized <= delivered
  - delivered + lost <= shipped <= ordered
  - backlog = ordered - shipped
  - shipped = delivered + lost + live freight quantity
  - dispatch debits native stock exactly once
  - each route capacity debit equals actual dispatch grams for its unique membership
  - each merchant handling capacity debit equals routed plus local actual outbound grams
  - opening stock plus physical arrivals plus local transfer receipts plus production equals consumed inputs plus
    maintenance spare consumption plus staged dispatch plus local transfer outflow plus final fulfillment plus
    closing stock
  - local fulfilled cumulative quantity increments only by positive local fulfillment receipts
  - finite final-demand fulfillment remains distinct from household consumption
  - household opening stock plus actual handoffs equals consumption plus closing stock
  - required household consumption equals consumed plus unmet quantity, independently of employment
  - generated household admitted quantity equals fulfilled plus expired refunded quantity
  - total spendable cash plus purchase reserves plus payroll reserves is unchanged by the close
  - purchase reserve equals fixed unit price multiplied by (quantity - delivered - refunded)
  - each money transfer has equal opposite signed postings with named cash or reserve locations
  - attendance accrual creates one employer payable and matching worker receivable without a cash movement
  - wage payment consumes its payroll reserve and extinguishes the matching obligation
  - funded hours equal used hours plus paid idle hours
  - planned available hours equal funded plus unfunded hours
  - available hours equal planned available plus unplanned hours

