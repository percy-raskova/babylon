monetary_accounting:
  opening: capture explicit cash endowments and employment terms; no default accounts, credit, or hidden issuance
  unit_price: positive exact currency per native order unit, fixed for the accepted principal
  admission: reserve the entire new purchase principal and admit its physical order as one detached operation
  departure: seller retains title while goods are in transit; buyer holds reserved money and no delivered goods
  settlement: cumulative actual arrival or local handoff pays only its newly delivered quantity
  loss: cumulative physically lost quantity refunds only its newly lost portion to the buyer
  duplicate_settlement: repeated or decreasing cumulative quantities are refused
  payroll: reserve all wages for the admitted attendance before accrual or payment
  attendance: all funded employee hours earn wages even when later productive use is zero; non-wage hours stay distinct
  utilization: actual production, handling and maintenance take proportional remaining member hours; idle stays distinct
  member_wages: actual use receives exact employee hours times rate; working-owner and unpaid-family cost is zero
  shift_identity: sha256 member-funded-attendance domain, period, member, site, unit and resident payee
  price_valuation: money costs, sale receipts, and wage obligations are not a claim about labor value or surplus value
  snapshot: spendable cash excludes reserves; decoding never reserves the same principal a second time
  failure: checked overflow or any refusal publishes no successor state, payment, obligation, or physical receipt

merchant_receipts:
  handling_fields: [site_id, outbound_order, feasible_quantity, handled_quantity, needed_hours, used_hours]
  handling_key: [site_id, outbound_order]
  outbound_order_tags: {delivery: 1, local_final_demand: 2}
  local_fulfillment_fields: [order_id, retailer_site_id, demand_principal_id, good_id, unit_id, quantity]
  local_fulfillment_key: [order_id]
  local_fulfillment_zero: omit event; preserve completed zero handling evidence
  local_transfer_fields: [order_id, supplier_site_id, buyer_site_id, good_id, unit_id, quantity]
  local_transfer_key: [order_id]
  local_transfer_zero: omit event; preserve completed zero handling evidence
  local_transfer_accounts: shipped equals delivered equals realized; lost equals zero
  local_transfer_evidence: no freight lot, physical arrival, or staged dispatch receipt

staffing:
  schema: StaffingV3
  work_source_tags: {production: 1, merchant_handling: 2, maintenance: 3}
  work_source_identity: process ID for production, site ID for merchant handling and maintenance
  binding_membership: unique tagged work sources, one workplace with one labor unit and conserved resident members
  graph_authority: SOCIAL_CLASS members alone own employed and reserve; BUSINESS workplace owns prior request memory
  member_limit: 131072
  population_transfer: aggregate hires or separations use largest remainders over member reserves or employed stocks
  opening_hours: graph employment times captured schedule must equal each current derived member-hour budget
  receipt_join: member receipts reconcile aggregate staffing, resident payees, hours, actual use and wage accruals
  production_request: next-period input and process-capacity feasible work before service and employment constraints
  maintenance_request: prospective requested whole jobs multiplied by hours per job before resource constraints
  merchant_request: recorded current-period nonlabor-feasible outbound handling hours
  complete_requests: one explicit request including zero per admitted work source
  retention: max(current unretained hours, previous unretained hours)
  employment: ceil(retained hours / hours per person), capped by conserved labor force
  execution: current opening hours only; subsequent hires supply next-period hours

maintenance:
  scope: one optional provider and one dependent process; no general service market
  admission:
    - binding and service are both present or both absent; zero service remains explicit
    - every coefficient and maximum job count is positive; service belongs to the opening period
    - spare quantity and labor time have distinct unit identities
    - maximum jobs multiplied by enabled batches is checked and bounds opening service
    - provider is a distinct known site without production or merchant work
    - consumer is the sole process at its site and produces the bound spare good and unit
    - consumer has material inputs distinct from its output; no consumer input is supplied to outbound orders
    - provider has no outbound orders and only the bound labor unit
  request: ceil(prospective next-period material and nameplate batches / enabled batches per job)
  prospective: compute after arrivals and production, before maintenance and outbound local credits;
    omit service and labor limits
  completed: min(requested jobs, maximum jobs per period, floor(parts available / parts per job),
    floor(hours available / hours per job))
  parts_available: opening provider stock plus due freight arrivals; same-close local credits cannot be used
  parts_debit: completed jobs multiplied by spare units per job
  labor_debit: completed jobs multiplied by labor units per job
  consumed_service: actual current-period consumer batches
  expired_service: opening enabled batches minus consumed service; never carried forward
  next_service: completed jobs multiplied by enabled batches per job, valid only next period
  unused_capacity: expires each period; no accumulation
  planning: constrain actual production and next-period commitments by service; preserve unconstrained staffing demand
  receipt_optional: absent means no maintenance dependency; present zero records completed zero work
  receipt_fields: [binding, period, opening_service_batches, consumed_service_batches, expired_service_batches,
                   prospective_batches, requested_jobs, opening_spare_parts, arrived_spare_parts, available_spare_parts,
                   available_labor_hours, completed_jobs, consumed_spare_parts, consumed_labor_hours, next_service]

capacity_supply:
  evidence_class: Designed
  mode_u8: {finite_schedule: 0, rolling: 1}
  finite_schedule: dated capacities and corridor_capacities are sole residual owners; absent periods supply zero
  rolling_field_order: [mode_u8, process_supply_tag, process_supply, shared, future_reservations]
  process_supply_tag: {captured_nameplate: 0, equipment: 1}
  finite_field_order: [mode_u8]
  row_fields:
    installed_processes: [process_id, site_id, batches_per_period]
    shared: [corridor_id, grams_per_period]
    future_reservations: [departure_period, corridor_id, reserved_grams]
  row_width_bytes: {installed_processes: 72, shared: 40, future_reservations: 48}
  canonical_keys:
    installed_processes: [site_id, process_id]
    shared: [corridor_id]
    future_reservations: [departure_period, corridor_id]
  maximum_rows_per_family: 65536
  installed_equipment: captured nameplate controls or finite managed cohorts; one owner, never additive
  labor: next-period staffing remains independent; rolling capacity does not generate workers or hours
  accounting: capacity mode is explicit and independent of physical or monetary accounting and price policy
  rolling_invariants:
    - installed rows cover every process once with its actual site; zero nameplate is explicit
    - shared supply covers exactly the union of route capacity and merchant handling principals
    - current process and shared budgets contain only the opening period and cover their supply rows exactly
    - current process batches equal the explicit supply mode result; remaining shared grams cannot exceed gross
      throughput
    - future reservations are positive, unique and strictly later than the opening period
    - every future reservation references a route capacity with sufficient remaining departure lookahead
    - future reserved grams cannot exceed the corresponding gross shared supply
    - row, date and quantity arithmetic overflow refuses the complete detached close
  availability:
    current: existing residual budget
    future_process: captured nameplate or usable managed cohort supply for planning only
    future_shared: gross grams per period minus already reserved grams
  reservation:
    current: debit the remaining current budget
    future: add original dispatch grams to the unique departure-period and corridor reservation
    losses: never release advance reservations, including when a lot disappears before its booked departure
    capacity_reduction: refuse captured supply below existing bookings; no silent cancellation or clipping
  rollover:
    - require exactly one successor period
    - install current process budgets from the explicit supply mode once
    - install current shared budgets as gross throughput minus reservations due in the successor period
    - discard consumed earlier budgets and promoted reservations; retain all later reservations
    - perform rollover only in successful transition finalization, never in validation or decoding
  persistence: encode mode, installed supply, current residual budgets and future bookings; refuse earlier schemas


historical_cost_book:
  evidence_class: Designed
  purpose: Historical transaction-cost bookkeeping; no surplus-value, SNLT or universal valuation claim
  field_order: [capital_accounts, stock_carrying_values, freight_carrying_values, equity_carrying_values,
                equipment_carrying_values]
  row_fields:
    capital_accounts: [account, opening_capital, contributed_capital, retained_earnings]
    stock_carrying_values: [owner_account, good_id, unit_id, amount]
    freight_carrying_values: [lot_id, owner_account, amount]
    equity_carrying_values: [owner_account, issuer_site_id, amount]
    equipment_carrying_values: [asset_tag_u8, asset_id, owner_site_id, amount]
  row_width_bytes: {capital_accounts: 81, stock_carrying_values: 113, freight_carrying_values: 81,
                    equity_carrying_values: 81, equipment_carrying_values: 81}
  canonical_keys:
    capital_accounts: [account]
    stock_carrying_values: [owner_account, good_id, unit_id]
    freight_carrying_values: [lot_id]
    equity_carrying_values: [owner_account, issuer_site_id]
    equipment_carrying_values: [asset_tag_u8, asset_id]
  bounds: {capital_accounts: 131072, stock_carrying_values: 196608, freight_carrying_values: 65536,
           equity_carrying_values: 131072, equipment_carrying_values: 131072}
  stock_bound: Site inventories at most 131072 plus resident household stocks at most 65536
  opening:
    - require explicit carrying rows for every physical site stock, household stock and freight lot, including zero
    - derive opening capital once from cash, reserves, physical and equity carrying values and wage claims less
      liabilities
    - initial retained earnings are zero; restart restores captured capital and accumulated earnings exactly
    - managed equipment and unfinished installations each require an explicit carrying row, including zero
    - captured-nameplate controls deliberately omit equipment physical and carrying assets
  quantities: Physical rows alone own quantities; carrying rows never manufacture or duplicate units
  withdrawal: floor(carrying_amount * withdrawn_quantity / available_quantity), using quotient/remainder arithmetic
  rounding: Partial withdrawals retain every rounding remainder; whole depletion transfers the full remaining amount
  flow_rules:
    - production consumes input carrying values and capitalizes actual productive paid labor into output
    - dispatch transfers seller stock cost to seller-owned freight without revenue or buyer inventory
    - staged loss expenses the seller's withdrawn carrying amount; its cash refund remains the money book's authority
    - final arrival recognizes seller sales and COGS; buyer inventory receives the fixed settled acquisition amount
    - local seller withdrawal and sale precede delayed buyer stock and carrying-value credits after both outbound passes
    - household handoff capitalizes pantry purchases; actual household consumption withdraws carrying value as expense
    - finite final-demand sinks recognize a distinct outlay at fulfillment without adding a pantry or consumption need
    - wages earned are household income; productive wages capitalized are not a second current expense
    - unused funded attendance, handling, maintenance labor and materials, and freight losses are separate expenses
    - changed quotes do not reprice existing stock, transit or purchase reserves
  reconciliation:
    - carrying amounts are nonnegative; zero physical quantity requires zero carrying value
    - ordinary transit carrying rows belong to the seller account; aid transit carrying rows belong to the donor
      household
    - capital accounts exactly match monetary accounts; stock keys match physical stocks and freight keys match
      ordinary plus aid lots
    - each account's net assets equal captured opening capital plus contributed capital plus accumulated retained
      earnings
    - each period income includes sales, wages, tax, operating-transfer, distribution and gift income less COGS,
      named expenses and gift expense
    - closing retained earnings equal opening retained earnings plus period income less distributions paid
    - productive labor, installation labor, handling, maintenance labor and idle wage costs partition current earned
      wages exactly
    - cost operations cannot mutate spendable cash, reserves, purchase prices or wage obligations
    - all refusals discard the detached close, including late planning, arithmetic and net-asset mismatches
  excluded: Calendar decay, obsolescence and universal social-value measurement remain outside this book

period_services:
  authority: ADR264
  commodity_admission:
    - Every inventory, process input and process output good-unit has an explicit commodity definition.
    - Storable goods have positive grams; service units have a declared stage and cannot have durable inventory,
      freight or pantry rows.
    - One service output process per provider-good-unit; positive ordinary output batch coefficients remain native
      quantities.
    - Service recipes may consume only earlier-stage service inputs; same-stage, backward dependencies and cycles
      are refused.
    - Captured provider-to-site-or-household connections authorize exact service orders; they do not infer
      geography or class.
    - Service orders have a positive quantity, current-or-future performance period and a matching accepted-price
      monetary reserve.
    - Service offers use Fixed or ServiceResponsive; service output stock buffers are zero.
  partition:
    - Complete produced native output equals allocated grants plus unallocated provider expiry.
    - Admitted requests equal performed plus refunded unperformed quantity.
    - Acquired performance equals used plus unused buyer expiry.
    - Household required quantity equals satisfied plus unmet need; satisfaction is minimum required and acquired.
  accounting:
    - Provider input and productive labor costs capitalize only complete performed batches.
    - Seller COGS follows canonical proportional carrying-cost withdrawal; full depletion takes the exact remainder.
    - Unallocated provider output and acquired-but-unused buyer service become unused_service_expense at their
      respective carrying amounts.
    - Buyer service used in production enters output carrying basis; direct household use is consumption expense.
    - Service stock and carrying rows exist only inside the detached atomic close and are absent in every committed
      opening.
  planning:
    - B2B native requests derive from current committed batches times input coefficients, capped by policy
      quantities and cash floor.
    - Matching provider-buyer-good-unit funded orders due now reduce fresh household and B2B requests before admission.
    - Top-up identity hashes its domain, ordinary recurring identity, and sorted matching due order identities,
      quantities and accepted prices.
    - Due orders retain their accepted price; only residual need can obtain a new reserve at the current quote.
    - Service next planned native output covers observed requests or explicit next-period claims; ceiling division
      converts to batches.
    - Responsive quotes distinguish funded unmet demand, whole-batch cost pressure and spare native capacity with
      bounded steps.
    - Existing reserves keep their accepted price; no price or planning policy guarantees execution or profit.

financial_institutions:
  authority: ADR266
  evidence_class: Designed
  field_order: [locations, ownership, distributions, taxes, public_budgets, public_allocations, contributions]
  row_fields:
    locations: [account, economic_location]
    ownership: [issuer_site_id, beneficiary_account, shares_u64]
    distributions: [issuer_site_id, earnings_fraction_bps_u16, period_cap, cash_floor]
    taxes: [payer_account, public_recipient_id, tax_basis_u8, rate_bps_u16, cash_floor]
    public_budgets: [public_account_id, period_cap, cash_floor]
    public_allocations: [public_account_id, recipient_account, transfer_treatment_u8, priority_u32, amount_per_period]
    contributions: [id, due_period, contributor_account, issuer_site_id, amount]
  row_width_bytes: {locations: 39, ownership: 73, distributions: 66, taxes: 84, public_budgets: 64,
                    public_allocations: 86, contributions: 121}
  canonical_keys:
    locations: [account]
    ownership: [issuer_site_id, beneficiary_account]
    distributions: [issuer_site_id]
    taxes: [payer_account]
    public_budgets: [public_account_id]
    public_allocations: [public_account_id, priority, recipient_account, transfer_treatment]
    contributions: [id]
  tax_basis_u8: {wage_income: 1, positive_operating_income: 2}
  transfer_treatment_u8: {household_income_support: 1, provider_operating_grant: 2}
  invariants:
    - All tables are bounded by N; account identities and explicit policy counterparties must exist.
    - Locations exactly cover organization and public accounts; locations do not create ownership or tax liability.
    - Captured positive ownership shares are independent of residence, attendance and legal account namespace.
    - Claim keys exactly match explicit equity carrying rows, including zero; no self-ownership.
    - Contributions require a captured claim, due period and positive amount; consume each due instruction once.
    - Acquired equity debits cash and raises contributor carrying basis and issuer contributed capital, never income.
    - Capture all contribution funding before credits; no same-phase circular funding.
    - Public allocations consume cash above floor and finite current appropriation in priority then canonical order.
    - Household income support and provider operating grants produce paired expense and income only when paid.
    - Public capital support uses the separate finite contribution instruction and its equity claim.
    - One tax policy per eligible payer; bases are earned wages or positive operating income before financial flows.
    - Taxes exclude contributions, distribution income and reporting remittances; uncollected assessments create no
      debt.
    - Capture tax bases and cash before credits; capture distribution earnings and cash after tax but before any payout.
    - Distributions use positive retained earnings, a bounded fraction, cap and available cash; never mint money.
    - Exact share floors allocate remaining micro-units to canonical beneficiaries, conserving the declared amount.
    - Distribution is an issuer retained-earnings reduction and beneficiary income exactly once, not a second sale.
    - Cross-border reporting may classify the same flow as a remittance but cannot post a second income or cash credit.
    - Equity carrying assets and issuer capital require elimination when reporting consolidated totals.
  limits: Prices, shares, appropriations and tax rules are captured game policies; no endogenous legislature or finance
    market.

productive_equipment:
  authority: ADR268
  evidence_class: Designed
  field_order: [definitions, bindings, installation_inputs, cohorts, pending,
                installation_policies, investment_policies]
  row_fields:
    definitions: [id, equipment_good_id, equipment_unit_id, batches_per_unit_per_period, service_batches_per_unit,
                  installation_labor_unit_id, installation_hours_per_unit]
    bindings: [process_id, site_id, definition_id]
    installation_inputs: [definition_id, good_id, unit_id, quantity_per_equipment_unit]
    cohorts: [id, process_id, units, remaining_service_batches, usable_from_period]
    pending: [id, process_id, units, started_period, remaining_hours]
    installation_policies: [process_id, target_tag_u8, target_units_u64,
                            maximum_started_units_per_period, maximum_hours_per_period]
    investment_policies: [process_id, supplier_site_id, replacement_target_units, maximum_installed_units,
                          maximum_purchase_per_period, expansion_earnings_fraction_bps_u16, cash_floor]
  asset_tag_u8: {installation: 0, installed: 1}
  installation_target_tag_u8: {fixed_units: 1, production_plan: 2}
  installation_target_payload: Fixed uses target units; production plan uses explicit replacement units.
  installation_policy_row_width: 57
  canonical_keys:
    definitions: [id]
    bindings: [process_id]
    installation_inputs: [definition_id, good_id, unit_id]
    cohorts: [process_id, id]
    pending: [process_id, id]
    installation_policies: [process_id]
    investment_policies: [process_id]
  limits: Each physical family has at most N rows; N pending plus N installed carrying values have at most 2N rows.
  invariants:
    - Every process has one checked binding; zero cohorts and absent policies explicitly permit inactive processes.
    - Coefficients are positive; equipment and installation complements are storable native goods.
    - Available batches sum the minimum of each usable cohort nameplate and its remaining finite service batches.
    - Productive use consumes service batches once; full exhaustion transfers all remaining carrying micro-units.
    - Equipment stock becomes WIP only with complete complementary inputs; no cash payment can install capacity.
    - Installation target is explicit fixed units or maximum of replacement units and ceiling of current planned
      batches divided by batches per equipment unit; the production-plan mode requires a captured recurring plan.
    - New installation requests equal target minus live installed units after wear and existing WIP, floored at zero.
    - Existing WIP continues under its work budget when the new target falls; purchase ceilings cannot ban owned
      equipment installation below a separately declared target.
    - Unshipped delivery and unfulfilled final-demand commitments protect equipment and complementary stock from
      installation; prospective staffing uses the same transient eligibility and shared material residuals.
    - Investment position excludes sale-pledged stock and inbound units needed to cover remaining sale commitments.
    - Installation decision receipts include explicit zero choices and match actual new starts and existing WIP.
    - Actual installation shares existing attendance residuals; employee wages capitalize and unpaid work adds no
      wage cost.
    - A completed cohort becomes usable in the following period; unfinished work survives restart and zero current
      output.
    - Fixed finite and captured-nameplate controls remain explicit and cannot add capacity to managed equipment.
    - Investment accounts once for installed units, WIP, allocated equipment stock and outstanding funded goods orders.
    - Replacement may use available cash at a loss; expansion also requires its bounded positive retained-earnings
      budget.
    - Decisions disclose captured plans, accepted output orders, output stocks and buffers without promising sales
      or growth.
    - Captured service lives and proportional historical-cost withdrawals are Designed, not empirical machine-life
      estimates.


goods_quote_costs:
  evidence_class: Designed
  persistence: transient current-close posting evidence in receipts; no second durable cost or cash ledger

  basis:
    produced: current actual output quantity and capitalized input carrying, actual productive wages and equipment wear
    released: current actual seller-stock withdrawals to routed freight, local buyers or final demand
    unavailable: zero quantity and zero amounts when neither current production nor release exists
  selection:
    - actual merchant handling requires the released basis and the same native released and handled quantity
    - handling uses actual member wage costs, including zero wages for working owners and unpaid family
    - otherwise current produced cost takes precedence over released cost; the two are never added
    - idle work and general maintenance are not speculatively allocated to a particular good
  quote:
    - fixed offers remain fixed; existing accepted reserves and historical carrying are never repriced
    - existing unmet-demand and stock-target guard takes precedence, then observed unit cost, then excess stock
    - exact rounded-up unit cost above the old quote applies only the captured step and ceiling
    - no observation is distinct from actual zero-cost output; no policy guarantees clearing or a positive margin
  qualification: >-
    Historical transaction-cost bookkeeping, not social value, surplus value or a universal valuation theory.

household_time:
  authority: ADR270
  evidence: Captured eligible residents and explicitly Designed hour commitments; not observed time-use estimates.
  accounting_u8: {not_modeled_control: 0, modeled: 1}
  field_order: [accounting_u8, policies, receipts, contributions]
  count_encoding: u32_big_endian_before_each_modeled_row_family_and_each_policy_burden_family
  policy_fields: [principal_id, labor_unit_id, eligible_persons, hours_per_eligible_person,
                  protected_need_basis_u8, protected_hours_per_basis,
                  provisioning_need_basis_u8, provisioning_hours_per_basis, unmet_burdens]
  burden_fields: [good_id, unit_id, hours_per_unmet_unit]
  receipt_fields: [principal_id, period, labor_unit_id, endowment_hours, attended_hours,
                   protected_hours, protected_unresolved_hours, unpaid_requested_hours,
                   unpaid_allocated_hours, unpaid_unresolved_hours, contribution_available_hours]
  contribution_fields: [period, use_id, principal_id, actor_id, contributor_id, hours]
  canonical_keys:
    policies: [principal_id]
    burdens: [good_id, unit_id]
    receipts: [principal_id]
    contributions: [use_id]
  limits:
    policies: 65536
    receipts: 65536
    contributions: 65536
    aggregate_burdens: 65536
  invariants:
    - Modeled accounts cover exactly the recurring household roster, including collective residences.
    - Eligible residents do not exceed counted persons; member capacity cannot exceed their declared hour endowment.
    - Labor units belong to admitted hour accounts and match each household's employment terms.
    - Actual unique current-period member attendance is charged once, including paid and unpaid idle hours.
    - Priority is attendance, protected commitments, unpaid provisioning, then available contribution.
    - Endowment equals attendance plus allocated protected and unpaid commitments plus available contribution.
    - Requested unpaid commitments equal allocated plus unresolved claims; unresolved claims are not performed work.
    - Unresolved higher-priority claims forbid available contribution; protected unresolved claims forbid unpaid
      allocation.
    - Receipts belong exactly to the preceding completed period and reconcile captured policy and needs bounds.
    - Consumption changes unmet-need burdens; it cannot create time, goods or political consent.
    - Several organizational aliases share one household account; their combined positive debits cannot overdraw it.
    - Exact same-period debit retries are idempotent; stale uses or changed terms refuse atomically.
    - Consent remains a separate authorized political relation; a debit ledger does not establish agreement.
    - Current state bytes include the last receipts and debit ledger; older state versions refuse without migration.

household_aid:
  evidence_class: Designed
  field_order: [mandates, freight, cash_reserves]
  mandate_fields: [id, source_hash, donor_actor, donor_contributor_id, recipient_actor, payer_account,
                   donor_household_id, recipient_household_id, good_id, unit_id, labor_unit_id,
                   hours_per_unit, maximum_quantity, cash_per_unit, transport_tag, conditional_transport_fields]
  transport_u8: {local: 1, routed: 2}
  routed_fields: [route_id, from_node_id, to_node_id]
  mandate_width_bytes: {local: 314, routed: 410}
  freight_fields: [lot_id, commitment_id, mandate_id, route_id, dispatch_period, current_stage_index,
                   stage_arrival_period, donor_household_id, recipient_household_id, good_id, unit_id, quantity]
  reserve_fields: [commitment_id, payer_account, donor_household_id, recipient_household_id, quantity,
                   cash_per_unit, granted, refunded]
  row_width_bytes: {freight: 282, cash_reserves: 169}
  canonical_keys: {mandates: [id], freight: [lot_id], cash_reserves: [commitment_id]}
  bounds: {mandates: 65536, freight: 65536, cash_reserves: 327680, receipts_per_period: 327680}
  receipt_bound_basis: Five closed outcomes times MAX_MATERIAL_CIRCUIT_ROWS; not a guarantee of five rows per mandate.
  commitment_identity: SHA256(aid_commitment_domain + terminator + mandate_id + dispatch_period_u64)
  payer: Explicit captured account funds cash; donor household owns goods and supplies contributor authority.
  rules:
    - Mandates capture exact source hash, donor and recipient actors, contributor, payer, households and native units.
    - Donor and recipient households differ; payer cannot be the recipient household account.
    - Input authority and period must match the captured mandate; no missing time or account fallback.
    - Positive requested quantities are bounded by captured maximum, actual donor stock, finite cash and supplied hours.
    - Local transport requires one location; routed transport uses captured route and endpoint identities.
    - Local grant credits actual recipient stock; dispatch moves donor stock and basis to donor-owned aid freight.
    - Routed grants credit only retained arrived quantities; stage losses remove goods and expense their withdrawn
      donor freight basis.
    - Cash enters one aid reserve at reservation; actual grant releases it to recipient and unshipped or lost
      quantities refund payer.
    - Granted goods basis is donor gift expense; granted cash is payer gift expense; recipient gift income includes
      both exactly once.
    - Gift flows are not sales, wages, contributed capital, tax collections or additional reserves.
    - Contribution uses retain exact period, household, actor, contributor and hours; the host must atomically debit
      the authoritative time ledger.
    - Gross household time receipts remain unchanged by contribution debits; the separate ledger owns their expenditure.
    - A failed detached operation publishes no goods, cash, time use or aid receipt.
  host_boundary: Material aid and supplied resources do not establish completed organizer practice or independent
    partner consent.
  persistence: State schema18 includes every aid vector even when empty in monetary mode; physical controls omit
    monetary branches.
