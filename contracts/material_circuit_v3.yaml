meta:
  contract: MaterialCircuitV3
  schema_version: 13
  evidence_class: Designed
  rust_owner: babylon-material-circuit

scope:
  - native-unit conserved stock, production, orders, and staged freight
  - positive exact grams per native shipment unit
  - shared mass capacity independent of a good's shipment unit
  - geometry and preselected physical paths are captured by campaign content
  - explicit local inter-owner circulation without timed transport or a road
  - staffed wholesale and retail outbound handling without changing goods
  - finite location-local retail handoff orders with no road journey
  - one bounded maintenance provider consumes parts and labor to enable next-period batches
  - explicit physical controls or captured monetary accounts, purchase reserves, and attendance wages
  - exact funded settlement follows actual arrival or local handoff; departure is not a sale
  - optional recurring resident needs, funded purchases, stocks, consumption, procurement, and subsequent plans
  - fixed-price controls and captured bounded responsive offers use the same physical allocator
  - no route search, credit creation, exchange-rate policy, or endogenous fiscal policy decisions occur here

domains:
  state: babylon.material-circuit-state.v3
  freight_lot_identity: babylon.freight-lot.v2
  household_order_identity: babylon.recurring-household-order.v1
  service_order_identity: babylon.recurring-service-order.v1
  service_topup_identity: babylon.recurring-service-topup.v1
  procurement_identity: babylon.recurring-procurement.v1
  terminator_hex: "00"

encoding:
  byte_order: big-endian
  identity: raw-32-bytes
  schema_version: u16
  period: u64
  quantity: u64
  stage_index: u16
  travel_periods: u16
  loss_ppm: u32
  economic_location: six canonical bytes with a checked county, counterpart or dependency tag
  need_basis_u8: {persons: 1, households: 2}
  merchant_role_u8: {wholesale: 1, retail: 2}
  supplier_transport_u8: {local: 1, staged: 2}
  optional_presence_u8: {absent: 0, present: 1}
  accounting_mode_u8: {physical_control: 0, monetary: 1}
  account_owner_u8: {site: 1, household: 2, organization: 3, public: 4}
  account_identity: account_owner_u8 followed by raw-32-byte identity in its distinct owner namespace
  outbound_order_u8: {delivery: 1, local_final_demand: 2, period_service: 3}
  outbound_order_identity: outbound_order_u8 followed by raw-32-byte order ID
  labor_compensation_u8: {wage: 1, working_owner: 2, unpaid_family: 3}
  compensation_rate: wage requires positive hourly_rate; non-wage modes require canonical zero padding
  shift_state_u8: {reserved: 1, accrued: 2, paid: 3, cancelled: 4}
  boolean_u8: {disabled: 0, enabled: 1}
  price_policy_u8: {fixed: 1, responsive: 2, service_responsive: 3}
  commodity_kind_u8: {storable: 1, period_service: 2}
  service_stage_u8: {utility_provision: 1, local_service_provision: 2}
  currency: signed i128 exact micro-units; 1000000 micro-units per currency unit; no float conversion
  maintenance_options: independent presence tags followed by fields; both present or both absent
  unsupported_schema: refuse; no legacy decoding or migration
  row_count: u32
  noncanonical_order: forbidden
  trailing_bytes: forbidden
  header: [state_domain, terminator, schema_version, period]

state_field_order:
  - site_logistics_nodes
  - process_outputs
  - input_coefficients
  - labor_coefficients
