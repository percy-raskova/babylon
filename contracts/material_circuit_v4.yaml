# Market policy (the price of a short market). A catalog carries it only by asking: the order of paying below.
# Without it every catalog and state byte is the one of before. With it, in a period in which a private seller
# is short, the price paid rises to the first level at which what its buyers can pay for equals what there is.
market_clearing:
  P1_market: >-
    one seller, one product and one moment of sale in a period; its supply is what the seller has on offer to new
    buyers; its buyers are the accounts whose policy names that seller for that product
  P2_bid: >-
    each buyer brings what it wants, its purse and, for a business, a limit; at price p it can pay for min(wanted,
    floor(purse / p)) and for nothing above its limit; a household brings a rung for its need and one for each want
    of the product, each with a reserve (the posted cost of what is ahead of it in its list and still to buy), and
    at price p a rung can pay for min(wanted, floor((purse - reserve - spent on the rungs before it) / p))
  P3_price: >-
    no more demand than supply at the posted price sells at the posted price; otherwise the price is the lowest
    price above the posted one at which the demand no longer exceeds the supply, found exactly in millionths by
    bisection, one price for every buyer of the market
  P4_shares: >-
    each buyer gets what it can pay for at that price; where demand falls past the supply in one step the price is
    the last one before the step, the buyers who fall away share what is left in proportion to what each loses,
    and the last indivisible units go in canonical order; everything on offer is sold; a buyer's share fills its
    rungs in order, each up to what it can pay for at that price
  P5_limit: >-
    a business bids no more than the price at which a batch just covers its cost, never under the posted price; a
    merchant pays no more than its own posted price less its handling wage
  P6_offer: >-
    stock or output at the moment of sale less what the seller owes to orders accepted earlier; for a merchant
    also no more than its hands and room can pass over
  P7_order_of_paying: >-
    the catalog names one order of its products; a buyer's purse reaches the markets in that order, and each
    purchase is paid before the next market is cleared; a household's list goes by tier first and by the order
    inside a tier
  P8_accepted_order: >-
    money set aside keeps its price and quantity; a good a household buys is handed over at the purchase; a
    business's goods sold and not yet moved are owed
  P9_posted_price: keeps its rule of one step a period inside its bounds
  P10_record: >-
    a short market leaves one receipt of seller, product, moment, posted price, price paid, on offer, demand at
    the posted price, sold, and buyers bid and served
  P11_money: nothing is created or destroyed; the buyers' extra payments are the seller's receipts
  P12_not_by_price: >-
    a product left out of the order of paying, a catalog without an order, and a world without money share in
    proportion as before; a product in the order has no seller with a fixed price
  P13_asking: >-
    a catalog gets the rule only by naming an order of paying, and A6 only by setting plans_from_spare_money
  A6_spare_money: >-
    a workplace that holds more money than one period of what it pays out plans for what was asked of it and
    not paid for at its posted price, as far as that spare money carries; what a period pays out is the wages of
    its planned hours, the inputs of its planned batches and a merchant's restocking; a raise stops at nameplate
    and takes no stocked input that a paid-for plan needs; a workplace without spare money, and a catalog that
    does not set plans_from_spare_money, plan as before
  admission:
    - the order is not empty, names no product twice, and names only declared commodities
    - every storable good that a household need names is in the order; a service may be left out
    - a household want has a positive units per basis, names a product in the order, and no key twice
    - a market policy has at most 262144 household wants
    - a refusal is MarketClearingInvariant
    - a market policy requires no company portfolio
    - under a market policy every offer of a product in the order is responsive

# Households buy in tiers (O7, O8). A catalog without wants has none of this: no list, no record, today's bytes.
household_tiers:
  O7_tiers: >-
    a household account buys its needs (tier 1), then its comforts (tier 2), then its luxuries (tier 3), in the same
    markets at the same price as everyone else, with the money its own list does not need
  O8_reserve: >-
    a want rung of tier t at place q in the order of paying holds back the posted cost, quantity still to buy times
    posted price, of the account's items of every other product that are needs, or wants of an earlier tier, or
    wants of tier t at an earlier place, and, when the account has a wage tax row, the wage tax it owes for the
    period (the sum, over its wage tax rows, of the wage income booked at the opening of the period times each
    rate, as the close will assess it); the account's own need and earlier wants of the product are the rungs
    before it, so reserves never fall along a bid; a need rung holds back nothing, and the money held back for the
    tax stays in the account until the close collects it
  still_to_buy: >-
    a need is still to buy for the rest of the period by the part the household did not get, and that part's
    posted cost is held back from every want and from no later need; a want is done once its market has cleared
    for the household, whatever it got
  want_is_used: >-
    a want is used at its purchase: it has its own order, made, handed over, paid and retired inside the household
    moment, and reaches no pantry; its payment is the household's consumption expense
  records: >-
    each period, for every want one receipt of wanted, bought, posted and market price; for every account and tier
    one receipt of wanted and bought value at posted prices; an unreached want is bought 0 at its posted price
  standard: >-
    going without when a need row of the account has unmet quantity; else getting by when tier 2 bought less than
    it wanted; else comfortable when tier 3 did; else affluent
  unreached: >-
    a want with nothing on offer, a disabled row or a price it cannot pay buys 0, leaves no order, no unmet need
    and no division by zero
  service_wants: >-
    a want of a service is bought in the service's stage market, as a rung of its account's bid; its performance row
    requests what its rung could pay for at the posted price with the account's cash at that moment and admits what
    it bought; the list settles after every stage market of an account, one left out of the order of paying included

catalog_seal:
  - canonicalize every definition family once at admission, in the orders above
  - validate row bounds, uniqueness, route continuity, coefficient coverage and nested definitions
  - seal validated definitions with the digest computed from canonical bytes; input definitions contain no digest
  - sealed catalog data and its digest are private and immutable
  - a decoder refuses bytes whose embedded digest differs from the supplied catalog
  - the sealed catalog remains authoritative; definitions are not encoded into period state

