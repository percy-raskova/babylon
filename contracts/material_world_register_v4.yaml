version: 4
name: material_world_register_v4
authority: [ADR251, ADR260, ADR262, ADR263]
purpose: Complete current material state owned by the explicit material replay session.
related_contracts:
  - contracts/material_circuit_v3.yaml
  - contracts/simulation_interval_v1.yaml
  - contracts/organizer_practice_v1.yaml
  - contracts/nominal_material_world_v3.yaml
clock:
  completed_tick: unsigned_64_big_endian
  circuit_period: completed_tick_plus_one_checked
  days_per_period: 28
encoding:
  domain: "babylon.material-world-register.v4\0"
  fields:
    - u32_big_endian_version_4
    - u64_big_endian_completed_tick
    - u64_big_endian_state_byte_length
    - exact_material_circuit_state_bytes_schema_6
    - organizer_presence_u8_zero_or_one
    - if_present_u64_big_endian_config_length_then_canonical_organizer_config
    - if_present_u64_big_endian_state_length_then_canonical_organizer_state
  digest: sha256_exact_bytes
  maximum_complete_bytes: 67108864
  decoder: reject_unknown_version_truncated_trailing_or_noncanonical_bytes
transition:
  authority: MaterialCircuitV3
  material_schema: 6
  implementation: advance_material_circuit_or_its_single_detached_close_and_finish
  order:
    - Complete due transport stages, attribute native loss and credit final physical arrivals.
    - In monetary circuits, refund actual losses and settle actual arrivals from the matched purchase reserves.
    - Retire prior terminal purchases; pay previously accrued wages and fund planned attendance from spendable cash.
    - Accrue and pay attendance before work; admit recurring household orders from their actual current budgets.
    - Execute prior production commitments against current stock, opening labor and expiring service.
    - Complete bounded maintenance against post-production prospective inputs and current provider parts and labor.
    - Allocate delivery and final-demand orders against stock and shared mass capacities.
    - Constrain merchant handling with opening labor and debit only actual outbound quantities.
    - Credit actual household handoffs, settle them, and refund expired recurring household orders.
    - Replenish firm inventory positions and allocate only their new delivery orders through remaining resources.
    - Publish local internal buyer credits after both outbound passes fix every grant and debit.
    - Settle local transfers and consume recurring household needs from actual household stocks.
    - Record planned, unplanned, funded, unfunded, used and paid idle hours separately.
    - Check total cash plus purchase and payroll reserves against the captured opening total.
    - Derive subsequent demand caps from sales, unfulfilled demand and inventories; update captured offers.
    - Derive distinct production, merchant and maintenance work requests; retire terminal purchase principals.
    - Resolve staffing, replace next-period labor and form next-period production commitments.
  causal_barriers:
    - Arrivals cannot enlarge an existing production commitment.
    - Arrived goods may satisfy current merchant handling and dispatch.
    - Local internal buyer credits cannot feed another outbound order in the same close.
    - New employment supplies the next period and cannot enlarge current handling or maintenance work.
    - Unused opening service expires; completed jobs grant service only for the next period.
    - Local parts replenishment arrives after maintenance and cannot repair the opening shortage.
    - Production and maintenance staffing requests ignore unavailable maintenance service.
    - A monetary order requires matched funded escrow; an absent financial principal cannot enable free trade.
    - Current attendance uses only funded hours; sales later in this close cannot fund earlier attendance.
    - Attendance wages do not depend on production, handling, sales or realized revenue.
    - Needs persist through unemployment and purchase withdrawal; unmet consumption cannot create money or hours.
    - Expected future arrivals inform subsequent plans only; they never enter current usable inventory.
    - Each generated household request expires after this period; settlement and refunds precede paired retirement.
  capacity:
    principal: corridor_id_and_departure_period
    unit: grams
    request: native_quantity_times_positive_exact_grams_per_unit
    reservation: actual_dispatch_grams_once_per_unique_principal
    physical_path: Many captured edges may share one timed stage; edges do not advance time.
    residual: Proportional-floor and cross-resource residuals remain unused.
  quantity_realization: Delivered internal commodity quantity;
    distinct from monetary settlement and value interpretation.
  final_demand: Finite and generated household orders use the same retail handoff;
    explicit household stocks and consumption remain separate accounts.
  accounting: Explicit physical control or a captured monetary circuit using the same physical allocator.
publication:
  owner: babylon_tick::material_replay::MaterialReplaySession
  prepare: Detached graph and material candidates with exact babylon_tick::material_world::MaterialTickReceipts bytes.
  commit: Preflight all publication allocations before the one durable operation.
  success: Infallible moves publish graph, material register, completed tick and graph event sink.
  failure: Graph, material register, identity, completed tick and event sink remain unchanged.
  horizon: Refuse before adjudication when the captured finite content horizon is complete.
compatibility:
  runtime: Only the current register and material codec are live.
  incompatible_campaign: Refuse reopening without modifying stored data.
history:
  predecessor: https://github.com/percy-raskova/babylon/blob/8c71be68bdc2c292b9b58ad98b2023213edb6b98/contracts/material_world_register_v2.yaml
