invariants:
  - Each tick is one four-week simulation period. Explicit continuous or finite
    duration and the supported interval are captured from authored parameters.
    Opening resources stay finite; continuous duration does not generate demand.
  - All initial quantities, recipes, throughput, labor hours, workforce seeds,
    orders and route durations come from one required numeric TOML document.
    The foundation stores its canonical values and derived bundles together.
  - A new campaign reloads the file. Reopening reconstructs the stored values;
    later edits or removal of the authoring file cannot alter that campaign.
  - Labor per person per period derives from weekly work hours and the fixed
    interval. Previous unretained hours equal opening employed labor hours.
  - Sites represent county-industry aggregates. Logistics nodes are abstract
    accounts attached to these sites, without factory coordinates or H3 cells.
  - The five private-industry rows are unsuppressed QCEW annual 2024 records.
    Their county CSV hashes match the checked 83-county source manifest.
    Suppressed rows and their zero placeholders are refused as evidence.
  - Observed employment is an annual average of jobs. It does not determine
    Designed labor hours, capacity, inventory, production or class movement.
  - The metal chain consumes billet into sheet, sheet into panels, and panels
    into subassemblies. The food chain consumes grain into meal and meal into
    packaged meal. All recipe quantities use the declared physical units.
  - Subassemblies and packaged meal remain unsold on-hand terminal inventory.
    No terminal consumption, payment, money or household demand is invented.
  - Quantity realization follows delivered intermediate orders and is never
    labeled payment. Supplier relations and route delays are Designed.
  - Delivered inputs alter the following period's production commitments.
    Changing only the sheet route delay leaves the food trajectory unchanged.

acceptance:
  - Observed artifacts decode without acquisition files or network access.
  - Equal canonical parameter values produce equal states and transition bytes.
  - Invalid, missing or unknown parameters fail without a compiled fallback.
  - Stored parameters authenticate against the complete campaign foundation.
  - The shipped twins diverge downstream after their differing deliveries.
  - Restart decoding at dispatch, transit and arrival preserves continuation.
