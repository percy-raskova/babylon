version: 2
name: nominal_material_world_v2
authority: ADR251
purpose: Nominal whole-world identity for explicit material campaigns.
encoding:
  domain: "babylon.nominal-material-world.v2\0"
  fields:
    - u32_big_endian_version_2
    - exact_32_byte_graph_nominal_world_v1_hash
    - exact_32_byte_material_world_register_v2_digest
  digest: sha256_exact_bytes
graph_component: Unchanged graph hash, completed time, allocator cursors and phase schedule.
material_component: Complete canonical V2 circuit; no summary or parallel inventory ledger.
tick_identity:
  version: 3
  domain: "babylon.material-tick-content.v3\0"
  fields:
    - u32_big_endian_version_3
    - u64_big_endian_resolve_tick
    - exact_32_byte_material_campaign_foundation_v2_digest
    - exact_32_byte_graph_component_tick_content_v1_hash
    - exact_32_byte_graph_nominal_world_before_hash
    - exact_32_byte_graph_nominal_world_after_hash
    - exact_32_byte_prior_nominal_material_world_v2_hash
    - exact_32_byte_result_nominal_material_world_v2_hash
    - exact_32_byte_material_tick_receipts_v3_digest
  digest: sha256_exact_bytes
  database_campaign_uuid: Excluded from mechanics identity; included in the durable envelope.
