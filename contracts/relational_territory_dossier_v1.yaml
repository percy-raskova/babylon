# Closed registry rows stay one physical line for row-level mutation review.
# yamllint disable rule:line-length
schema: babylon.relational-territory-dossier
schema_version: 1
hash_domain_separator: babylon.relational-territory-dossier.v1
draft_record: RtdDossierDraftV1
sealed_record: RelationalTerritoryDossierV1

scalar_types:
  string:
    json_type: string
    nfc: true
  u16:
    json_type: unsigned_integer
    minimum: 0
    maximum: 65535
  u64:
    json_type: unsigned_integer
    minimum: 0
    maximum: 18446744073709551615
  digest_hex:
    json_type: string
    nfc: true
    utf8_bytes: 64
    pattern: "^[0-9a-f]{64}$"
  bits64_hex:
    json_type: string
    nfc: true
    utf8_bytes: 16
    pattern: "^[0-9a-f]{16}$"
    uint64_encoding: big_endian_bits
    float64_encoding: finite_ieee754_binary64_bits
    normalize_negative_zero: true
  vintage:
    json_type: string
    nfc: true
    minimum_utf8_bytes: 1
    maximum_utf8_bytes_limit: max_vintage_bytes
  producer_issue:
    json_type: string
    nfc: true
    minimum_utf8_bytes: 1
    maximum_utf8_bytes_limit: max_required_producer_bytes
    pattern: "^PER-[1-9][0-9]*$"

limits:
  max_collection_items: 65535
  max_focus: 64
  max_reference_digests: 4096
  max_scale_memberships: 65535
  max_facets: 65535
  max_dyads: 65535
  max_hyperedges: 65535
  max_flows: 65535
  max_gaps: 65535
  max_provenance: 65535
  max_coordinates: 32
  max_hyperedge_members: 1024
  max_payload_facets: 256
  max_decision_surface_refs: 256
  max_provenance_refs: 8192
  max_identity_component_bytes: 256
  max_vintage_bytes: 256
  max_provenance_locator_bytes: 1024
  max_required_producer_bytes: 64
  max_canonical_bytes: 67108864

enums:
  AudienceV1: [ADMIN_MATERIAL, PLAYER_KNOWLEDGE]
  DurabilityV1: [IN_MEMORY, COMMITTED]
  EvidenceClassV1: [Observed, Derived, Calibrated, Designed]
  StatusV1: [PRESENT, ABSENT, UNKNOWN, NOT_COMPUTED, REDACTED]
  ValueKindV1: [UINT64_BITS, FLOAT64_BITS]
  CoverageV1: [COMPLETE, PARTIAL, NOT_APPLICABLE, UNKNOWN]
  MembershipKindV1:
    - ADMINISTRATIVE
    - NATIONAL
    - COMMUTING_ZONE
    - METROPOLITAN
    - WEIGHTED_OVERLAP
  FacetFamilyV1:
    - COMMAND_ADMINISTRATION
    - PRODUCTION_CIRCULATION
    - REPRODUCTION_SETTLEMENT_ACCESS
    - EXTRACTION_ABANDONMENT_CARCERAL
    - ECOLOGY_CARE
    - ORGANIZATION_ROOTEDNESS
  DyadKindV1: [PRESENCE, MEMBERSHIP, SOLIDARITY, COMMAND]
  HyperedgeKindV1: [PUBLIC_RELATION]
  FlowKindV1: [COMMUTER_JOBS, BORDER_SYNTHESIS]
  RelationPayloadModeV1: [EMPTY, SINGLE_METRIC_FACET, IMPLICIT_RELATION]
  GapReasonV1:
    - MISSING_GOVERNED_OMB_DELINEATION
    - IDENTITY_CONTRACT_PENDING
    - MISSING_GOVERNED_PRODUCER
    - REFERENCE_COVERAGE_UNAVAILABLE
    - PLAYER_BOUNDARY_UNAVAILABLE
    - PROVENANCE_COORDINATE_CONFLICT
  MetricRepresentationV1: [FACET, REFERENCE_FLOW, DYAD]
  AggregationRuleV1:
    - NONE
    - PUBLISHED_ROLLUP
    - LOAD_TIME_SUM
    - BLOCK_INTERNAL_POINT_ASSIGNMENT
    - BLOCK_COORDINATE_ASSIGNMENT
    - EQUAL_AREA_WATER_INTERSECTION
    - TYPED_RELATION_PROJECTION
  RtdCollectionKindV1:
    - FOCUS
    - REFERENCE_DIGESTS
    - SCALE_MEMBERSHIPS
    - FACETS
    - DYADS
    - HYPEREDGES
    - FLOWS
    - GAPS
    - PROVENANCE
    - COORDINATES
    - MEMBER_REFS
    - PAYLOAD_FACETS
    - DISPLAY_REFS
    - PROVENANCE_REFS

records:
  TypedIdentityV1:
    fields:
      - {name: domain, type: string, bound: max_identity_component_bytes}
      - {name: authority, type: string, bound: max_identity_component_bytes}
      - {name: local_id, type: string, bound: max_identity_component_bytes}
  ReferenceDigestV1:
    fields:
      - {name: reference_id, type: identity}
      - {name: sha256_hex, type: digest_hex}
      - {name: artifact_schema_id_or_null, type: identity, nullable: true}
      - {name: vintage, type: vintage, bound: max_vintage_bytes}
      - {name: evidence_class, type: EvidenceClassV1}
  DimensionCoordinateV1:
    fields:
      - {name: dimension_ref, type: identity}
      - {name: member_ref, type: identity}
  ScaleMembershipV1:
    fields:
      - {name: membership_id, type: identity}
      - {name: member_ref, type: identity}
      - {name: scale_ref, type: identity}
      - {name: membership_kind, type: MembershipKindV1}
      - {name: status, type: StatusV1}
      - {name: weight_status, type: StatusV1}
      - {name: weight_bits_or_null, type: bits64_hex, nullable: true}
      - {name: coverage, type: CoverageV1}
      - {name: evidence_class, type: EvidenceClassV1}
      - {name: provenance_refs, type: "list[identity]", bound: max_provenance_refs, sort_key: identity}
  FacetV1:
    fields:
      - {name: facet_id, type: identity}
      - {name: family, type: FacetFamilyV1}
      - {name: subject_ref, type: identity}
      - {name: metric_id, type: identity}
      - {name: unit_id, type: identity}
      - {name: native_scale, type: identity}
      - {name: coordinates, type: "list[DimensionCoordinateV1]", bound: max_coordinates, sort_key: dimension_ref}
      - {name: vintage, type: vintage, bound: max_vintage_bytes}
      - {name: status, type: StatusV1}
      - {name: value_kind, type: ValueKindV1}
      - {name: value_bits_or_null, type: bits64_hex, nullable: true}
      - {name: coverage, type: CoverageV1}
      - {name: evidence_class, type: EvidenceClassV1}
      - {name: provenance_refs, type: "list[identity]", bound: max_provenance_refs, sort_key: identity}
  DyadV1:
    fields:
      - {name: relation_id, type: identity}
      - {name: relation_kind, type: DyadKindV1}
      - {name: from_ref, type: identity}
      - {name: to_ref, type: identity}
      - {name: native_scale, type: identity}
      - {name: status, type: StatusV1}
      - {name: coverage, type: CoverageV1}
      - {name: payload_facets, type: "list[identity]", bound: max_payload_facets, sort_key: identity}
      - {name: evidence_class, type: EvidenceClassV1}
      - {name: provenance_refs, type: "list[identity]", bound: max_provenance_refs, sort_key: identity}
  HyperedgeV1:
    fields:
      - {name: hyperedge_id, type: identity}
      - {name: hyperedge_kind, type: HyperedgeKindV1}
      - {name: member_refs, type: "list[identity]", bound: max_hyperedge_members, sort_key: identity}
      - {name: native_scale, type: identity}
      - {name: status, type: StatusV1}
      - {name: coverage, type: CoverageV1}
      - {name: payload_facets, type: "list[identity]", bound: max_payload_facets, sort_key: identity}
      - {name: evidence_class, type: EvidenceClassV1}
      - {name: provenance_refs, type: "list[identity]", bound: max_provenance_refs, sort_key: identity}
  ReferenceFlowV1:
    fields:
      - {name: flow_id, type: identity}
      - {name: flow_kind, type: FlowKindV1}
      - {name: origin_ref, type: identity}
      - {name: destination_ref, type: identity}
      - {name: payload_facets, type: "list[identity]", bound: max_payload_facets, sort_key: identity}
      - {name: native_scale, type: identity}
      - {name: status, type: StatusV1}
      - {name: coverage, type: CoverageV1}
      - {name: evidence_class, type: EvidenceClassV1}
      - {name: provenance_refs, type: "list[identity]", bound: max_provenance_refs, sort_key: identity}
  GapV1:
    fields:
      - {name: gap_id, type: identity}
      - {name: requested_metric_or_relation, type: identity}
      - {name: status, type: StatusV1}
      - {name: reason_code, type: GapReasonV1}
      - {name: required_producer_or_null, type: producer_issue, nullable: true, bound: max_required_producer_bytes}
      - {name: provenance_refs, type: "list[identity]", bound: max_provenance_refs, sort_key: identity}
  ProvenanceV1:
    fields:
      - {name: provenance_id, type: identity}
      - {name: artifact_digest, type: digest_hex}
      - {name: locator, type: string, bound: max_provenance_locator_bytes}
      - {name: vintage, type: vintage, bound: max_vintage_bytes}
      - {name: evidence_class, type: EvidenceClassV1}
      - {name: transformation_digest_or_null, type: digest_hex, nullable: true}
  DecisionSurfaceV1:
    fields:
      - {name: question_id, type: identity}
      - {name: signal_refs, type: "list[identity]", bound: max_decision_surface_refs, sort_key: input_order}
      - {name: action_refs, type: "list[identity]", bound: max_decision_surface_refs, sort_key: input_order}
      - {name: receipt_refs, type: "list[identity]", bound: max_decision_surface_refs, sort_key: input_order}
      - {name: archive_subject_refs, type: "list[identity]", bound: max_decision_surface_refs, sort_key: input_order}
  RtdDossierDraftV1:
    fields:
      - {name: schema, type: string}
      - {name: schema_version, type: u16}
      - {name: projection_version, type: u16}
      - {name: audience, type: AudienceV1}
      - {name: durability, type: DurabilityV1}
      - {name: verified_tick, type: u64}
      - {name: graph_state_hash, type: digest_hex}
      - {name: nominal_world_hash, type: digest_hex}
      - {name: reference_digests, type: "list[ReferenceDigestV1]", bound: max_reference_digests, sort_key: reference_id}
      - {name: definitions_digest, type: digest_hex}
      - {name: template_digest, type: digest_hex}
      - {name: fog_policy_digest, type: digest_hex, nullable: true}
      - {name: knowledge_context_digest, type: digest_hex, nullable: true}
      - {name: actor, type: identity, nullable: true}
      - {name: focus, type: "list[identity]", bound: max_focus, sort_key: identity}
      - {name: scale_memberships, type: "list[ScaleMembershipV1]", bound: max_scale_memberships, sort_key: membership_id}
      - {name: facets, type: "list[FacetV1]", bound: max_facets, sort_key: facet_id}
      - {name: dyads, type: "list[DyadV1]", bound: max_dyads, sort_key: relation_id}
      - {name: hyperedges, type: "list[HyperedgeV1]", bound: max_hyperedges, sort_key: hyperedge_id}
      - {name: flows, type: "list[ReferenceFlowV1]", bound: max_flows, sort_key: flow_id}
      - {name: gaps, type: "list[GapV1]", bound: max_gaps, sort_key: gap_id}
      - {name: provenance, type: "list[ProvenanceV1]", bound: max_provenance, sort_key: provenance_id}
      - {name: decision_surface, type: DecisionSurfaceV1}
  RelationalTerritoryDossierV1:
    fields:
      - {name: schema, type: string}
      - {name: schema_version, type: u16}
      - {name: projection_version, type: u16}
      - {name: audience, type: AudienceV1}
      - {name: durability, type: DurabilityV1}
      - {name: verified_tick, type: u64}
      - {name: graph_state_hash, type: digest_hex}
      - {name: nominal_world_hash, type: digest_hex}
      - {name: reference_digests, type: "list[ReferenceDigestV1]", bound: max_reference_digests, sort_key: reference_id}
      - {name: definitions_digest, type: digest_hex}
      - {name: template_digest, type: digest_hex}
      - {name: fog_policy_digest, type: digest_hex, nullable: true}
      - {name: knowledge_context_digest, type: digest_hex, nullable: true}
      - {name: actor, type: identity, nullable: true}
      - {name: focus, type: "list[identity]", bound: max_focus, sort_key: identity}
      - {name: scale_memberships, type: "list[ScaleMembershipV1]", bound: max_scale_memberships, sort_key: membership_id}
      - {name: facets, type: "list[FacetV1]", bound: max_facets, sort_key: facet_id}
      - {name: dyads, type: "list[DyadV1]", bound: max_dyads, sort_key: relation_id}
      - {name: hyperedges, type: "list[HyperedgeV1]", bound: max_hyperedges, sort_key: hyperedge_id}
      - {name: flows, type: "list[ReferenceFlowV1]", bound: max_flows, sort_key: flow_id}
      - {name: gaps, type: "list[GapV1]", bound: max_gaps, sort_key: gap_id}
      - {name: provenance, type: "list[ProvenanceV1]", bound: max_provenance, sort_key: provenance_id}
      - {name: decision_surface, type: DecisionSurfaceV1}
      - {name: projection_hash, type: digest_hex}

