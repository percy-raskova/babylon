# Exact governed signatures and inventory rows intentionally stay in compact flow form.
# yamllint disable rule:line-length rule:commas
meta:
  contract: RustPersistenceCutoverV1
  version: 1
  issue: PER-281
  parent: PER-21
  stopped_with: PER-280

bounds:
  contract_bytes: 65536
  vector_bytes: 262144
  vector_rows: 128
  vector_line_bytes: 65536
  identifier_bytes: 256
  utf8_bytes: 65535
  family_rows: 1048576
  aggregate_rows: 1048576

authority:
  purpose: One-way replacement of Python game-managed PostgreSQL authority with one Rust runtime
  canonical_crate: babylon-persistence
  composition_module: rust/crates/babylon-persistence/src/runtime.rs
  composition_binary: rust/crates/babylon-persistence/src/bin/babylon-runtime.rs
  composition_type: DurableReplayRuntimeV1
  prepared_tick_type: PreparedCommittedTickV1
  identified_tick_input: babylon_tick::replay_session::IdentifiedTickReportV1
  prepared_tick_constructor: prepare_committed_tick_v1
  activation_function: activate_rust_persistence_v1
  absorbed_binary: rust/crates/babylon-persistence/src/bin/babylon-schema-epoch.rs
  constructibility:
    activation: "activate_rust_persistence_v1(&postgres::Config) -> Result<ActivationReportV1, RustPersistenceActivationErrorV1>"
    content_bundle: "FoundationContentBundleV1::try_new(&str, Option<&str>, &str, &[u8], &[u8]) -> Result<FoundationContentBundleV1, RustPersistenceRuntimeErrorV1>"
    foundation_capture: "CampaignFoundationV1::capture(&ReplayTickSession<HypergraphStore>, FoundationContentBundleV1) -> Result<CampaignFoundationV1, RustPersistenceRuntimeErrorV1>"
    foundation_hydration: "hydrate_campaign_foundation_v1(&postgres::Config, CampaignId) -> Result<CampaignFoundationV1, RustPersistenceRuntimeErrorV1>"
    runtime_create: "DurableReplayRuntimeV1<HypergraphStore>::create(&postgres::Config, CampaignId, ReplayTickSession<HypergraphStore>, FoundationContentBundleV1) -> Result<Self, RustPersistenceRuntimeErrorV1>"
    runtime_open: "DurableReplayRuntimeV1<HypergraphStore>::open(&postgres::Config, CampaignId) -> Result<Self, RustPersistenceRuntimeErrorV1>"
    runtime_advance: "DurableReplayRuntimeV1<HypergraphStore>::advance_and_commit(&mut self, &mut CollectingSink, &OrderedPracticeActionBatchV1) -> Result<CommittedTickReceiptV1, RustPersistenceRuntimeErrorV1>"
    adjudication_sink: private_runtime_owned_buffer
    caller_sink_law: The mutable caller sink is a post-acknowledgement destination only; it remains byte-identical on refusal, rollback, or unresolved commit ambiguity.
    external_commit_from_report: prohibited
  prohibited_owners: [babylon-tick, babylon-client]
  prohibited_adjudication_calls: [prepare_rules, run_prepared_replay_tick]
  invariants:
    - Tick adjudication remains database-free.
    - A completed tick is observable only after COMMIT acknowledgement or exact ambiguity reconciliation.
    - A failed post-adjudication commit permits only identical retry or runtime reconstruction.
    - Python game-managed DDL and writes refuse before Rust authority becomes constructible.
    - No compatibility view, adapter, fallback, dual writer, dual storage, or runnable midpoint exists.

schema_epochs:
  reader_epoch: 7
  additive_preparation_epoch: 8
  destructive_activation_epoch: 9
  activation_ledger:
    relation: babylon_meta.persistence_authority_ledger
    row_type: PersistenceAuthorityLedgerRowV1
    state_type: PersistenceAuthorityStateV1
    primary_key: [ordinal]
    wire:
      domain_utf8: "babylon.persistence-authority-ledger-row.v1\0"
      layout_u32: 1
      closed_state_tags: {prepared: 1, rust_active: 2}
      fields:
        - ordinal_u16_be
        - state_tag_u8
        - schema_epoch_u16_be
        - contract_sha256
        - reader_contract_sha256
        - predecessor_optional_digest32
      optional_digest32: {none_tag_u8: 0, some_tag_u8: 1}
      row_sha256: sha256_exact_canonical_bytes
      predecessor_law: rust_active predecessor_sha256 equals the exact prepared-row SHA-256
      vector_ids: [authority-ledger-prepared, authority-ledger-rust-active]
    columns:
      - {name: ordinal, postgresql: SMALLINT, codec: u16_be}
      - {name: state_tag, postgresql: SMALLINT, codec: closed_enum_u8}
      - {name: schema_epoch, postgresql: SMALLINT, codec: u16_be}
      - {name: contract_sha256, postgresql: BYTEA_32, codec: digest32}
      - {name: reader_contract_sha256, postgresql: BYTEA_32, codec: digest32}
      - {name: predecessor_sha256, postgresql: BYTEA_32_NULLABLE, codec: optional_digest32}
    state_machine:
      - {ordinal: 1, state_tag: 1, state: prepared, schema_epoch: 8, predecessor: none}
      - {ordinal: 2, state_tag: 2, state: rust_active, schema_epoch: 9, predecessor: exact_prepared_row_sha256}
    allowed_transitions: [absent_to_prepared, prepared_to_rust_active]
    prohibited_transitions: [skip_prepared, update, delete, rollback, python_active_after_rust_active]
    row_last_law: The rust_active ledger row is the final DML statement before activation COMMIT.
    reacquisition_law: A durable rust_active row permits only the Rust composition root to construct write authority.
  activation_ledger_row_commits_last: true
  recovery_after_activation: forward_only

foundation:
  relation: babylon_state.campaign_foundation
  type: CampaignFoundationV1
  key: [campaign_id]
  tick_commit_starts_at: 1
  tick_commit_maximum: 9223372036854775807
  tick_number_type: CommittedResolveTickV1
  tick_zero_marker: prohibited
  out_of_postgresql_bigint_range: refused
  first_tick_checkpoint: required_full
  content_bundle:
    type: FoundationContentBundleV1
    domain_ascii_nul: babylon.campaign-foundation-content.v1
    layout_u32: 1
    fields:
      - {tag_u8: 1, name: scenario_source_bytes, codec: bounded_utf8, required: true}
      - {tag_u8: 2, name: prelude_source_bytes, codec: optional_bounded_utf8, required: true}
      - {tag_u8: 3, name: rule_source_bytes, codec: bounded_utf8, required: true}
      - {tag_u8: 4, name: defines_bytes, codec: bounded_bytes, required: true}
      - {tag_u8: 5, name: reference_bundle_manifest_bytes, codec: bounded_bytes, required: true}
    artifact_resolution:
      relation: babylon_ref.reference_artifact
      key: [ref_digest, logical_name, artifact_sha256]
      stored_fields: [exact_bytes, byte_length]
      digest_algorithm: SHA-256
      lookup: database_exact_key_only
      prohibited: [ambient_path, network_fetch, latest_version, digest_fallback]
      refusal: missing_or_digest_mismatched_artifact
  exact_fields:
    - {name: stable_graph, source_type: StableGraphStateV1, codec: bounded_bytes}
    - {name: world_registers, source_type: WorldRegisterSetV1, codec: bounded_bytes}
    - {name: resolver_manifest, source_type: StableElementResolverV1, codec: bounded_bytes}
    - {name: prepared_environment, source_type: PreparedEnvironmentV1, codec: bounded_bytes}
    - {name: replay_session_identity, source_type: ReplaySessionIdV1, codec: bounded_utf8}
    - {name: rng_seed, source_type: ReplaySeed, codec: i64_be}
    - {name: content_digest, source_type: ContentDigest, codec: digest_pair_v1}
    - {name: reference_digest, source_type: RefDigestV1, codec: digest32}
    - {name: content_bundle, source_type: FoundationContentBundleV1, codec: content_bundle_v1}
  checkpoint_completeness:
    manifest_type: CommittedFullCheckpointV1
    completeness_type: CheckpointCompletenessV1
    domain_ascii_nul: babylon.full-checkpoint-manifest.v1
    layout_u32: 1
    relation: babylon_state.checkpoint_manifest
    full_tag_u8: 1
    delta_tag_u8: 2
    manifest_layout: [domain_ascii_nul, layout_u32, completeness_tag_u8, campaign_id_uuid16, resolve_tick_u64_be, section_count_u16_be, exact_ordered_sections]
    required_full_sections:
      - stable_graph
      - world_registers
      - resolver_manifest
      - prepared_environment
      - replay_session_identity
      - rng_seed
      - content_digest
      - reference_digest
      - semantic_state
    section_tags:
      - {tag_u8: 1, name: stable_graph}
      - {tag_u8: 2, name: world_registers}
      - {tag_u8: 3, name: resolver_manifest}
      - {tag_u8: 4, name: prepared_environment}
      - {tag_u8: 5, name: replay_session_identity}
      - {tag_u8: 6, name: rng_seed}
      - {tag_u8: 7, name: content_digest}
      - {tag_u8: 8, name: reference_digest}
      - {tag_u8: 9, name: semantic_state}
    section_shape: [section_tag_u8, row_count_u32_be, section_sha256]
    completeness_digest: SHA-256 over the exact ordered manifest bytes
    selection_law: Only a full-tag manifest with all nine exact sections is a restart root.
    delta_is_restore_root: false
  restart:
    - Load campaign foundation or the latest committed full-tag checkpoint manifest.
    - Refuse an absent, duplicate, out-of-order, or digest-mismatched required section.
    - Replay a contiguous marker tail beginning at restore tick plus one.
    - Recompose exact TickContentHashV1 and exact CommittedTickEnvelopeV1 bytes per tail tick.
    - Resume only at the last acknowledged tick plus one.

semantic_rows:
  row_wire:
    byte_order: big_endian
    key_domain_ascii_nul: babylon.committed-tick-row-key.v1
    payload_domain_ascii_nul: babylon.committed-tick-row-payload.v1
    layout_u32: 1
    key_layout: [domain_ascii_nul, layout_u32, family_tag_u8, producer_tag_u8, row_codec_tag_u8, exact_key_fields]
    payload_layout: [domain_ascii_nul, layout_u32, family_tag_u8, producer_tag_u8, row_codec_tag_u8, exact_payload_fields]
    archive_dirty_receipt_payload_layout: TickContentHashV1_exact_32_bytes_without_row_payload_prefix
    storage_columns_not_duplicated_in_semantic_key: [campaign_id, resolve_tick]
    typed_sql_layout: [campaign_id_UUID, resolve_tick_BIGINT_CHECK_gte_1, exact_key_columns, exact_payload_columns]
    typed_sql_primary_key: [campaign_id, resolve_tick, exact_key_columns]
  family_order:
    - {family: graph, tag_u8: 16}
    - {family: state, tag_u8: 17}
    - {family: event, tag_u8: 18}
    - {family: checkpoint, tag_u8: 22}
    - {family: archive_dirty_receipt, tag_u8: 23}
  scalar_codecs:
    bool_u8: {bytes: 1, accepted: [0, 1]}
    u16_be: {bytes: 2, minimum: 0, maximum: 65535}
    u32_be: {bytes: 4, minimum: 0, maximum: 4294967295}
    u64_be: {bytes: 8, minimum: 0, maximum: 18446744073709551615}
    i64_be: {bytes: 8, minimum: -9223372036854775808, maximum: 9223372036854775807, encoding: twos_complement}
    nonnegative_i64_be: {bytes: 8, minimum: 0, maximum: 9223372036854775807}
    i128_be: {bytes: 16, encoding: twos_complement}
    uuid16: {bytes: 16, encoding: RFC4122_network_order}
    digest32: {bytes: 32}
    h3_cell_id_i64_be: {bytes: 8, minimum: 1, maximum: 9223372036854775807, validation: babylon_kernel::H3CellId::try_from(u64), invalid_mode_or_resolution: refused}
    f64_be_canonical:
      bytes: 8
      encoding: IEEE754_binary64_bits
      refused: [nan, positive_infinity, negative_infinity]
      normalization: negative_zero_to_positive_zero
    bounded_utf8:
      layout: [length_u32_be, exact_utf8_bytes]
      maximum_bytes: 65535
      refused: [invalid_utf8, embedded_nul, over_bound]
    bounded_bytes:
      layout: [length_u32_be, exact_bytes]
      maximum_bytes: 67108864
    optional_v1:
      none_tag_u8: 0
      some_tag_u8: 1
      unknown_tag: refused
    optional_bounded_utf8:
      layout: [presence_tag_u8, bounded_utf8_when_present]
      none_tag_u8: 0
      some_tag_u8: 1
      unknown_tag: refused
    optional_h3_cell_id_i64_be:
      layout: [presence_tag_u8, h3_cell_id_i64_be_when_present]
      none_tag_u8: 0
      some_tag_u8: 1
      unknown_tag: refused
    optional_digest32:
      layout: [presence_tag_u8, digest32_when_present]
      none_tag_u8: 0
      some_tag_u8: 1
      unknown_tag: refused
    digest_pair_v1:
      layout: [defines_hash_digest32, rules_hash_digest32]
    content_bundle_v1:
      layout: [domain_ascii_nul, layout_u32, five_tagged_fields_in_contract_order]
    ordered_bounded_utf8_v1:
      layout: [count_u32_be, exact_ordered_bounded_utf8_items]
      maximum_items: 1048576
    ordered_named_bsl_fields_v1:
      layout: [count_u32_be, exact_ordered_items]
      item_layout: [field_name_bounded_utf8, value_stable_bsl_value_v1]
      order: strictly_ascending_field_name_utf8_bytes
      duplicate_field_name: refused
      maximum_items: 1048576
    ordered_named_f64_fields_v1:
      layout: [count_u32_be, exact_ordered_items]
      item_layout: [field_name_bounded_utf8, value_f64_be_canonical]
      order: strictly_ascending_field_name_utf8_bytes
      duplicate_field_name: refused
      maximum_items: 1048576
    stable_element_key_v1:
      domain_ascii_nul: babylon.stable-element
      layout_u32: 1
      closed_kinds:
        stable_node_key: {key_kind_u8: 1, fields: [scenario_qname, local_name_lower_symbol]}
        stable_edge_key: {key_kind_u8: 2, fields: [scenario_qname, edge_type_ascii_graphic, source_local_name_lower_symbol, target_local_name_lower_symbol]}
        stable_hyperedge_key: {key_kind_u8: 3, fields: [scenario_qname, local_name_lower_symbol]}
      canonical_bytes: exact_StableElementKeyV1_canonical_bytes
      runtime_graph_handles: prohibited
    ordered_stable_element_keys_v1:
      layout: [count_u32_be, exact_ordered_items]
      item_layout: [item_length_u32_be, stable_element_key_v1_canonical_bytes]
      order: strictly_ascending_stable_element_key_v1_canonical_bytes
      duplicate_key: refused
      maximum_items: 1048576
    department_shares_v1:
      layout: [department_i_f64_be_canonical, department_iia_f64_be_canonical, department_iib_f64_be_canonical, department_iii_f64_be_canonical]
    closed_enum_u8: {unknown_tag: refused}
    stable_bsl_value_v1:
      closed_tags:
        int_i64: 1
        currency_i128: 2
        real_f64_bits: 3
        ratio_f64_bits_with_optional_bounds: 4
        bool: 5
        enum_type_and_member: 6
        stable_node_key: 7
        stable_hyperedge_key: 8
        stable_edge_key: 9
      graph_reference_payload: full StableElementKeyV1 canonical layout
      graph_reference_layout: [domain_ascii_nul, layout_u32, key_kind_u8, scenario_qname, exact_key_fields]
      outer_variant_key_kind: must_match_inner_key_kind
      runtime_graph_handles: prohibited
      unknown_tag: refused
  row_codecs:
    - {id: stable_graph_node_v1, tag_u8: 1, family: graph, typed_relation: babylon_state.graph_node_v1, key_fields: [local_name:bounded_utf8], payload_fields: [node_type:bounded_utf8]}
    - {id: stable_graph_node_f64_v1, tag_u8: 2, family: graph, typed_relation: babylon_state.graph_node_f64_v1, key_fields: [local_name:bounded_utf8, qname:bounded_utf8], payload_fields: [value:f64_be_canonical]}
    - {id: stable_graph_edge_v1, tag_u8: 3, family: graph, typed_relation: babylon_state.graph_edge_v1, key_fields: [edge_type:bounded_utf8, source:bounded_utf8, target:bounded_utf8], payload_fields: [strength:f64_be_canonical]}
    - {id: stable_graph_hyperedge_v1, tag_u8: 4, family: graph, typed_relation: babylon_state.graph_hyperedge_v1, key_fields: [local_name:bounded_utf8], payload_fields: [hyperedge_type:bounded_utf8, ordered_members:ordered_bounded_utf8_v1]}
    - {id: stable_graph_edge_f64_v1, tag_u8: 5, family: graph, typed_relation: babylon_state.graph_edge_f64_v1, key_fields: [edge_type:bounded_utf8, source:bounded_utf8, target:bounded_utf8, qname:bounded_utf8], payload_fields: [value:f64_be_canonical]}
    - {id: stable_graph_node_currency_v1, tag_u8: 6, family: graph, typed_relation: babylon_state.graph_node_currency_v1, key_fields: [local_name:bounded_utf8, qname:bounded_utf8], payload_fields: [micro_units:i128_be]}
    - {id: stable_graph_hyperedge_f64_v1, tag_u8: 7, family: graph, typed_relation: babylon_state.graph_hyperedge_f64_v1, key_fields: [local_name:bounded_utf8, qname:bounded_utf8], payload_fields: [value:f64_be_canonical]}
    - {id: world_register_v1, tag_u8: 1, family: state, typed_relation: babylon_state.world_register_v1, key_fields: [register_name:bounded_utf8], payload_fields: [value:stable_bsl_value_v1]}
    - {id: territory_state_v1, tag_u8: 2, family: state, typed_relation: babylon_state.territory_state_v1, key_fields: [territory_id:stable_element_key_v1], payload_fields: [ordered_fields:ordered_named_bsl_fields_v1]}
    - {id: dynamic_hex_state_v1, tag_u8: 3, family: state, typed_relation: babylon_state.hex_state_delta_v1, key_fields: [cell_id:h3_cell_id_i64_be], payload_fields: [c:f64_be_canonical, v:f64_be_canonical, s:f64_be_canonical, k:f64_be_canonical, biocapacity_stock:f64_be_canonical, energy_stock:f64_be_canonical, raw_material_stock:f64_be_canonical, internet_access_pct:f64_be_canonical, surveillance_coupling:f64_be_canonical]}
    - {id: organization_state_v1, tag_u8: 8, family: state, typed_relation: babylon_state.organization_state_v1, key_fields: [organization_id:stable_element_key_v1], payload_fields: [organization_kind:stable_bsl_value_v1, ordered_territory_ids:ordered_stable_element_keys_v1, ordered_fields:ordered_named_bsl_fields_v1]}
    - {id: successful_event_v1, tag_u8: 1, family: event, typed_relation: babylon_state.tick_event_v1, key_fields: [ordinal:u32_be], payload_fields: [event_type:bounded_utf8, ordered_fields:ordered_named_bsl_fields_v1]}
    - {id: checkpoint_v1, tag_u8: 1, family: checkpoint, typed_relation: babylon_state.checkpoint_section_v1, key_fields: [section_tag:closed_enum_u8, ordinal:u32_be], payload_fields: [completeness_tag:closed_enum_u8, exact_section_bytes:bounded_bytes]}
    - {id: archive_dirty_receipt_v1, tag_u8: 1, family: archive_dirty_receipt, typed_relation: babylon_state.archive_dirty_receipt_v1, key_fields: [], payload_fields: [tick_content_hash:digest32], typed_primary_key: [campaign_id, resolve_tick]}
  producer_inventory:
    - {id: stable_graph_rows_v1, tag_u8: 1, family: graph, source_type: StableGraphStateV1, source_accessor: IdentifiedTickReportV1.result_stable_graph, row_codecs: [stable_graph_node_v1, stable_graph_node_f64_v1, stable_graph_edge_v1, stable_graph_hyperedge_v1, stable_graph_edge_f64_v1, stable_graph_node_currency_v1, stable_graph_hyperedge_f64_v1], emptiness_proof_type: StableGraphRowsEmptyProofV1}
    - {id: material_state_rows_v1, tag_u8: 16, family: state, source_type: MaterialStateRowsV1, source_accessor: IdentifiedTickReportV1.material_state_rows, row_codecs: [world_register_v1, territory_state_v1, dynamic_hex_state_v1, organization_state_v1], closed_variants: [world_register, territory, dynamic_hex, organization]}
    - {id: successful_event_batch_v1, tag_u8: 32, family: event, source_type: SuccessfulEventBatchV1, source_accessor: IdentifiedTickReportV1.successful_event_batch, row_codecs: [successful_event_v1], value_codec: stable_bsl_value_v1, emptiness_proof_type: SuccessfulEventBatchEmptyProofV1}
    - {id: checkpoint_rows_v1, tag_u8: 96, family: checkpoint, source_type: CheckpointRowsV1, source_accessor: PreparedCommittedTickV1.checkpoint_rows, row_codecs: [checkpoint_v1], closed_variants: [full], cardinality: exactly_nine}
    - {id: campaign_work_receipt_v1, tag_u8: 112, family: archive_dirty_receipt, source_type: ArchiveDirtyReceiptV1, source_accessor: PreparedCommittedTickV1.archive_dirty_receipt, source_identity: IdentifiedTickReportV1.tick_content_hash, row_codecs: [archive_dirty_receipt_v1], cardinality: exactly_one, emptiness_proof: prohibited}
  emptiness_law:
    domain_ascii_nul: babylon.semantic-empty-proof.v1
    layout_u32: 1
    proof_layout: [domain_ascii_nul, layout_u32, producer_tag_u8, source_count_u32_be, source_digest32]
    valid_empty: source_count equals zero and source_digest equals the source-owned empty-batch digest
    constructor: private_to_named_source_accessor
    missing_or_foreign_proof: refused
  laws:
    - StableWorldV1 and TickPayloadV1 blobs cannot substitute for exact typed source rows.
    - Every row is emitted by exactly one named producer and one private source-owned constructor.
    - Every family is present in the envelope; sparse graph and event producers require their exact empty proof, while every full checkpoint contains exactly nine rows.
    - Every real tick carries exactly one campaign-work Archive dirty receipt and it has no empty proof.
    - Existing Michigan and public-table payloads cannot be declared empty because a Rust producer is absent.
    - Territory and organization identities are full checked StableElementKeyV1 canonical bytes, never shortened text aliases.
    - Dynamic hex rows contain one H3 identity and exactly nine canonical f64 lanes; county, state, and region membership remain separate foundation authority.
    - Organization kind is an exact OrgKind StableBslValueV1 enum and ordered territories are exact source-owned PRESENCE targets.
    - Arbitrary JSON and production decoding of opaque row blobs are prohibited.
    - Rows use the exact declared field order; duplicate or out-of-order keys are refused before SQL.

storage:
  canonical_schemas: [babylon_ref, babylon_state, babylon_meta]
  marker: babylon_state.tick_commit
  visibility_law: marker_last
  public_marker_disposition:
    source: public.tick_commit
    source_partition: public.tick_commit_default
    action: migrate_verify_drop_in_activation_epoch
    destination: babylon_state.tick_commit
    hash_law: determinism_hash may map only after exact TickContentHashV1 byte proof; a name match is insufficient
    checkpoint_law: is_checkpoint maps only to a committed full-tag checkpoint manifest
    count_law: hex_rows_written is verification evidence and is not an authority field
    retirement: drop source table and partition with no alias or view before rust_active ledger row
  prohibited_final_relations:
    - babylon_state.tick_graph_row
    - babylon_state.tick_state_row
    - babylon_state.tick_event_row
    - babylon_state.tick_subsystem_row
    - babylon_state.tick_conservation_row
    - babylon_state.tick_boundary_flow_row
    - babylon_state.tick_checkpoint_row
    - babylon_state.tick_archive_dirty_receipt_row
  prohibited_final_columns: [row_key, row_payload]
  prohibited_semantic_sql_types: [JSON, JSONB]
  physical_scalar_columns:
    bool_u8: {postgresql: BOOLEAN, nullable: false}
    u16_be: {postgresql: SMALLINT, nullable: false, check: value BETWEEN 0 AND 65535}
    u32_be: {postgresql: BIGINT, nullable: false, check: value BETWEEN 0 AND 4294967295}
    u64_be: {postgresql: NUMERIC(20,0), nullable: false, check: value BETWEEN 0 AND 18446744073709551615}
    i64_be: {postgresql: BIGINT, nullable: false}
    nonnegative_i64_be: {postgresql: BIGINT, nullable: false, check: value >= 0}
    i128_be: {postgresql: NUMERIC(39,0), nullable: false, check: value BETWEEN -170141183460469231731687303715884105728 AND 170141183460469231731687303715884105727}
    uuid16: {postgresql: UUID, nullable: false}
    digest32: {postgresql: BYTEA, nullable: false, check: octet_length(value) = 32}
    h3_cell_id_i64_be: {postgresql: BIGINT, nullable: false, check: value > 0, rust_validation: babylon_kernel::H3CellId::try_from(i64)}
    f64_be_canonical: {postgresql: BIGINT, column_suffix: _bits, nullable: false, meaning: canonical IEEE754 binary64 bits with negative zero normalized and non-finite values refused}
    bounded_utf8: {postgresql: TEXT, nullable: false, check: octet_length(value) <= 65535 AND position(chr(0) in value) = 0}
    bounded_bytes: {postgresql: BYTEA, nullable: false, check: octet_length(value) <= 67108864}
    optional_bounded_utf8: {postgresql: TEXT, nullable: true, check_when_present: octet_length(value) <= 65535 AND position(chr(0) in value) = 0}
    optional_h3_cell_id_i64_be: {postgresql: BIGINT, nullable: true, check_when_present: value > 0, rust_validation: babylon_kernel::H3CellId::try_from(i64)}
    optional_digest32: {postgresql: BYTEA, nullable: true, check_when_present: octet_length(value) = 32}
    closed_enum_u8: {postgresql: SMALLINT, nullable: false, check: value BETWEEN 0 AND 255 AND value is in the field-owned closed tag map}
    stable_element_key_v1: {postgresql: BYTEA, nullable: false, rust_type: StableElementKeyV1, encoding: exact_canonical_bytes, validation: checked_before_insert}
  bsl_value_columns_v1:
    columns:
      - {name: value_tag, postgresql: SMALLINT, nullable: false, check: value_tag BETWEEN 1 AND 9}
      - {name: int_value, postgresql: BIGINT, nullable: true}
      - {name: currency_value, postgresql: NUMERIC(39,0), nullable: true}
      - {name: real_bits, postgresql: BIGINT, nullable: true}
      - {name: ratio_bits, postgresql: BIGINT, nullable: true}
      - {name: ratio_min_bits, postgresql: BIGINT, nullable: true}
      - {name: ratio_max_bits, postgresql: BIGINT, nullable: true}
      - {name: bool_value, postgresql: BOOLEAN, nullable: true}
      - {name: enum_type, postgresql: TEXT, nullable: true}
      - {name: enum_member, postgresql: TEXT, nullable: true}
      - {name: stable_key, postgresql: BYTEA, nullable: true}
    exact_variant_check:
      1: [int_value]
      2: [currency_value]
      3: [real_bits]
      4: [ratio_bits, ratio_min_bits_optional, ratio_max_bits_optional]
      5: [bool_value]
      6: [enum_type, enum_member]
      7: [stable_key]
      8: [stable_key]
      9: [stable_key]
    law: Exactly the named columns for value_tag are present; every other variant column is NULL.
  parent_relation_law:
    mandatory_prefix_columns:
      - {name: campaign_id, postgresql: UUID, nullable: false}
      - {name: resolve_tick, postgresql: BIGINT, nullable: false, check: resolve_tick >= 1}
    scalar_expansion: Every non-ordered row-codec field expands through physical_scalar_columns under its declared field name; department_shares_v1 expands to four named BIGINT bit columns.
    bsl_expansion: stable_bsl_value_v1 expands through bsl_value_columns_v1.
