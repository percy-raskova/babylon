  normalized_child_relations:
    - {relation: babylon_state.graph_hyperedge_member_v1, parent: babylon_state.graph_hyperedge_v1, parent_key: [campaign_id, resolve_tick, local_name], columns: [position_INTEGER_CHECK_gte_0, member_TEXT_NOT_NULL], primary_key: [campaign_id, resolve_tick, local_name, position], unique: [campaign_id, resolve_tick, local_name, member], foreign_key: exact_parent_key_cascade}
    - {relation: babylon_state.territory_state_field_v1, parent: babylon_state.territory_state_v1, parent_key: [campaign_id, resolve_tick, territory_id], columns: [position_INTEGER_CHECK_gte_0, field_name_TEXT_NOT_NULL, bsl_value_columns_v1], primary_key: [campaign_id, resolve_tick, territory_id, position], unique: [campaign_id, resolve_tick, territory_id, field_name], foreign_key: exact_parent_key_cascade}
    - {relation: babylon_state.organization_territory_v1, parent: babylon_state.organization_state_v1, parent_key: [campaign_id, resolve_tick, organization_id], columns: [position_INTEGER_CHECK_gte_0, territory_id_BYTEA_NOT_NULL_STABLE_ELEMENT_KEY_V1], primary_key: [campaign_id, resolve_tick, organization_id, position], unique: [campaign_id, resolve_tick, organization_id, territory_id], foreign_key: exact_parent_key_cascade}
    - {relation: babylon_state.organization_state_field_v1, parent: babylon_state.organization_state_v1, parent_key: [campaign_id, resolve_tick, organization_id], columns: [position_INTEGER_CHECK_gte_0, field_name_TEXT_NOT_NULL, bsl_value_columns_v1], primary_key: [campaign_id, resolve_tick, organization_id, position], unique: [campaign_id, resolve_tick, organization_id, field_name], foreign_key: exact_parent_key_cascade}
    - {relation: babylon_state.tick_event_field_v1, parent: babylon_state.tick_event_v1, parent_key: [campaign_id, resolve_tick, ordinal], columns: [position_INTEGER_CHECK_gte_0, field_name_TEXT_NOT_NULL, bsl_value_columns_v1], primary_key: [campaign_id, resolve_tick, ordinal, position], unique: [campaign_id, resolve_tick, ordinal, field_name], foreign_key: exact_parent_key_cascade}
  normalized_child_laws:
    - Positions are contiguous from zero and preserve the source-owned exact order.
    - Organization territory positions preserve strictly ascending exact StableElementKeyV1 canonical bytes from the source-owned PRESENCE topology.
    - Parent and all children are inserted and retried inside the same marker-last transaction.
    - SQL projections join typed parent and child columns directly; no JSON, opaque semantic BYTEA, or decoder function is permitted.
    - Every ordered codec field has exactly one named child-relation mapping and no ungoverned child table.
  metadata_disposition:
    owner: babylon_persistence::meta
    material_state_dependency: prohibited
    tick_hash_membership: excluded
    relations:
      - {relation: babylon_meta.campaign, action: retain_typed_in_place, rust_type: CampaignCatalogRowV1, key: [campaign_id], law: last_tick_updates_only_after_material_tick_acknowledgement}
      - {relation: babylon_meta.watchlist, action: retain_typed_in_place, rust_type: WatchlistRowV1, key: [campaign_id, position], law: preserve exact position and unique entity identity}
      - {relation: babylon_meta.jumplist, action: retain_typed_in_place, rust_type: JumplistRowV1, key: [campaign_id, position], law: preserve exact position and duplicate policy}
      - {relation: babylon_meta.breadcrumb, action: retain_typed_in_place, rust_type: BreadcrumbRowV1, key: [campaign_id, position], law: preserve exact navigation order}
    python_writes_after_activation: prohibited
  laws:
    - Typed physical relations are the sole semantic store and direct source for SQL projections.
    - Retry reads typed rows in primary-key order and re-encodes the complete envelope.
    - TickContentHashV1 remains constitutional; envelope SHA remains diagnostic.
    - Durability is never inferred from MAX of a state table.

