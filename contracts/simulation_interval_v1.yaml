meta:
  contract: SimulationIntervalV1
  schema_version: 1
  status: accepted
  evidence_class: Designed
  authority: Constitution v4.2.0 Amendment AK, ADR257 and ADR260

interval:
  days_per_tick: 28
  weeks_per_tick: 4
  ticks_per_model_year: 13
  weeks_per_model_year: 52
  civil_calendar: false
  transitions_per_advance: 1
  commits_per_successful_advance: 1
  internal_weekly_substeps: 0

ordinals:
  foundation_completed_tick: 0
  first_opening_period: 1
  successor: completed_tick + 1
  next_opening: completed_tick + 1
  elapsed_weeks: completed_tick * 4
  elapsed_days: completed_tick * 28
  arithmetic: checked integer arithmetic; overflow refuses the operation
  interpretation: >-
    Tick and period are ordinal positions in the same causal sequence. A
    completed period n leaves the opening state for period n+1. Ordinal keys
    do not jump by four. An elapsed-time display converts the ordinal to weeks
    or days and does not reinterpret it as a civil month or date.

admission:
  presets:
    - michigan-material-standard-v7
    - michigan-material-delayed-v7
    - michigan-material-shared-freight-ample-v7
    - michigan-material-shared-freight-constrained-v7
    - michigan-material-statewide-baseline-v7
    - michigan-material-statewide-freight-constraint-v7
    - michigan-material-statewide-packaging-shortage-v7
    - michigan-material-statewide-both-v7
    - michigan-material-statewide-maintenance-baseline-v8
    - michigan-material-statewide-maintenance-labor-shortage-v8
    - michigan-material-statewide-maintenance-parts-shortage-v8
    - michigan-material-statewide-maintenance-both-v8
  stored_defines_version: 4
  duration_days: 28
  duration_is_hashed_foundation_content: true
  incompatible_prior_content: refuse without changing stored data
  malformed_or_missing_duration: refuse
  compatibility_runtime: forbidden

causal_order:
  steps:
    - Credit due arrivals at the opening of the period.
    - Execute only previously committed production through current resource and expiring service limits.
    - Complete maintenance from post-production prospective inputs, current provider labor and parts.
    - Expire unused opening service and grant completed maintenance service to the next period only.
    - Allocate outbound orders against native stock and shared gram capacity principals.
    - Charge actual merchant handling once against current opening labor and handling grams.
    - Credit finite retail final-demand accounts without physical freight or implied consumption.
    - Credit local internal buyers after all outbound grants and stock debits are fixed.
    - Derive production need, recorded feasible merchant work and receipted maintenance requests before staffing limits.
    - Resolve staffing and its graph effects, then plan the next opening.
    - Publish all state, events, receipts, and time only after total success.
  note: >-
    The existing phase composition and within-period ordering remain binding.
    New arrivals can feed planning for the following period; they do not
    enlarge an already committed production plan in the arrival period.
    Physical arrivals can supply current merchant handling. Local internal
    credits cannot feed another outbound order in the same close. Employment
    derived at this close supplies the next opening, including after zero work.
    Local parts replenishment cannot fund maintenance earlier in this close.
    Prospective production and maintenance requests ignore maintenance service
    limits, so a temporary service shortage does not prevent later hiring.

content_units:
  recurring_process_capacity: batches per period
  recurring_corridor_capacity: grams per departure period
  merchant_handling_capacity: grams per departure period
  merchant_handling_labor: positive exact hours per native outbound unit
  freight_mass: positive exact grams per native good-unit quantity
  labor_schedule: hours per person per period
  maintenance_service: Expiring enabled batches for one opening period, never a commodity stock.
  maintenance_jobs: Whole jobs using exact spare units and current person-hours per job.
  staffing_retention: current and previous unretained period work requests
  route_duration: positive whole periods per timed stage
  physical_edges: Ordered captured geometry; many edges may form one timed stage.
  local_transfer: No timed stage, physical road reservation or freight lot.
  final_fulfillment: Native quantities credited once against finite county end-buyer orders.
  unchanged_principals:
    - exact inventory stocks
    - persons in employment and reserve
    - total order quantities and cumulative order accounts
    - per-batch physical inputs, outputs, and recipe hours
  regional_design:
    recurring_capacity_multiplier: 4
    hours_per_person_per_period: 160
    initial_commitment_multiplier: 4
    previous_unretained_hours_multiplier: 4
    staffing_retention_periods: 1
    standard_route_periods: 1
    delayed_sheet_route_periods: 3
    horizon_periods: 16
  observed_source_units: >-
    Annual observations stay annual. QCEW mean weekly wage remains a weekly
    source statistic, not a period wage or a payment. No observed value,
    probability, nonlinear response, or stock receives an implicit fourfold
    multiplier. Every rate conversion needs its own declared transformation.

current_contracts:
  - contracts/material_circuit_v3.yaml
  - contracts/material_world_register_v3.yaml
  - contracts/committed_material_tick_v3.yaml
  - contracts/nominal_material_world_v3.yaml
historical_contracts:
  status: Retired source and vectors are historical evidence, with no live compatibility codec.
  revision: 8c71be68bdc2c292b9b58ad98b2023213edb6b98
  sources:
    - https://github.com/percy-raskova/babylon/blob/8c71be68bdc2c292b9b58ad98b2023213edb6b98/contracts/material_circuit_v1.yaml
    - https://github.com/percy-raskova/babylon/blob/8c71be68bdc2c292b9b58ad98b2023213edb6b98/contracts/material_circuit_v1_vectors.jsonl
    - https://github.com/percy-raskova/babylon/blob/8c71be68bdc2c292b9b58ad98b2023213edb6b98/contracts/material_circuit_v2.yaml
    - https://github.com/percy-raskova/babylon/blob/8c71be68bdc2c292b9b58ad98b2023213edb6b98/contracts/material_circuit_v2_vectors.jsonl

required_evidence:
  - One advance traverses the causal schedule once and creates one durable marker.
  - A successful tick increments the ordinal once and represents four elapsed weeks.
  - Altered, absent, or predecessor duration content cannot pass admission.
  - Matching new-content input produces identical state, receipts, and hashes on replay.
  - Restart agrees with uninterrupted play at dispatch, transit, and arrival boundaries.
  - Exact stock, freight, order, labor, and person accounts reconcile each period.
  - History, comparison, Archive, and Bevy label the same authenticated period.
  - Old stored campaigns remain intact after refused admission.
