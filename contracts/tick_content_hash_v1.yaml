vector_families:
  required:
    - replay_session
    - replay_seed
    - rng_v1
    - rng_v2
    - stable_element
    - carrier_segment
    - stable_carrier_key
    - resolver_manifest
    - stable_graph
    - action_id
    - ordered_action_batch
    - bsl_discriminant
    - prepared_environment
    - register_manifest
    - register_set
    - stable_world
    - tick_payload
    - tick_content_hash
    - mutation
    - refusal

preserved_contracts:
  - RNG V1 byte derivation and stream vectors
  - Practice V2 contract vector corpora
  - P27 frozen Python bytes and behavior

excluded_authority:
  - PostgreSQL I/O
  - CommittedTickEnvelope
  - Archive or outbox
  - Bevy
  - player-action execution
  - BSL intents
