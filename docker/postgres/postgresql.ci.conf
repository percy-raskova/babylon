# Babylon isolated Postgres — CI fork (ADR176 ruling 33: "the CI config fork").
#
# The dev config (postgresql.conf) is sized for a >=16 GB workstation
# (shared_buffers=4GB, effective_cache_size=12GB); a hosted GitHub runner
# has ~16 GB shared with the checkout, the venv build, and pytest itself —
# copying the dev values would swap or OOM the job. This fork keeps every
# BEHAVIORAL setting identical (WAL compression, autovacuum posture,
# observability) and shrinks ONLY the memory sizing. Selected by
# docker-compose.ci.yml's config mount; the dev file stays the local
# default. When overriding config_file the image's default
# listen_addresses is lost, so it MUST be set here.

listen_addresses = '*'
max_connections = 50

# --- Memory (runner-sized; the ONLY divergence from the dev file) -------------
shared_buffers = 512MB
effective_cache_size = 2GB
maintenance_work_mem = 256MB
work_mem = 32MB

# --- WAL / checkpoints (bulk-insert friendly; CI data is disposable) -----------
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
wal_compression = zstd

# --- Autovacuum (identical to dev) ---------------------------------------------
autovacuum_vacuum_insert_scale_factor = 0.05

# --- Observability (identical to dev) -------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
log_min_duration_statement = 1000

# NOTE: synchronous_commit stays ON cluster-wide; the `test` role switches it
# off via docker/postgres/initdb/01-babylon-init.sql exactly as on dev.
