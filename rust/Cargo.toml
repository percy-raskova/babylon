[workspace]
members = [
    "crates/babylon-kernel",
    "crates/babylon-material-circuit",
    "crates/babylon-practice-contract",
    "crates/babylon-graph",
    "crates/babylon-bsl",
    "crates/babylon-evidence",
    "crates/babylon-tick",
    "crates/babylon-persistence",
    "crates/babylon-client",
    "crates/babylon-rtd",
    "crates/bsl-lint",
    "crates/bsl-test",
    "crates/babylon-ls",
]
resolver = "2"

# Release must fail as loudly as dev. Cargo's implicit release default is
# `overflow-checks = false`, which turns every arithmetic overflow into a
# silent wrap — the exact shape Constitution III.11 (Loud Failure) forbids,
# and in a hash-producing engine a wrapped intermediate is a wrong tick that
# still validates. A real instance shipped here: `round_half_even_div`'s
# `denominator.abs()` returned -1 instead of 0 in release while panicking in
# dev (fixed at the site with `unsigned_abs`; this table closes the class).
#
# `debug-assertions` stays at the release default (off): those are for
# invariants we choose to check, whereas overflow is never intended.
# Determinism is unaffected either way — an overflow panic is not a
# divergent number, it is the absence of one.
[profile.release]
overflow-checks = true

# Full Michigan replay and persistence proofs execute production-sized worlds.
# Optimize their simulation/codec loops and the native development client while
# retaining invariant checks and recoverable debug symbols. Tests inherit this
# profile, so bootstrap and tests can also reuse the same compiled libraries.
[profile.dev]
opt-level = 1
debug-assertions = true
overflow-checks = true

# R1.2 (BSL refactor program, Director-approved 2026-08-18): strip debug
# symbols from every DEPENDENCY (not this workspace's own crates — cargo's
# package-name matching for `dev.package."*"` covers only external deps;
# workspace members keep full `debug` at the top-level `[profile.dev]`
# default, so `RUST_BACKTRACE=1`/debugger sessions on OUR code stay intact).
# Motivation: Bevy-class dev builds link several multi-GB rust-lld binaries
# concurrently across the now-common multi-worktree setup (8 worktrees live
# at drafting time) — most of that size is dependency debuginfo nobody
# steps into. `split-debuginfo = "unpacked"` keeps whatever symbols remain
# out of the object files themselves (faster incremental links; the .debug
# files are regenerable, never a correctness artifact — Constitution III.7
# unaffected by those symbol settings).
[profile.dev.package."*"]
# Keep Bevy's frame loop usable in the canonical development build. Workspace
# code retains debug symbols and the normal dev assertions/overflow checks.
opt-level = 3
debug = false
split-debuginfo = "unpacked"

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.87 is bnum 0.14's declared MSRV, not a preference — declaring 1.85 while
# depending on a crate that needs 1.87 would be a false claim about who
# can build this workspace. The toolchain pin (rust-toolchain.toml) is
# 1.91.1, so this is the floor we support, not the one we use.
# The toolchain/dependency report (2026-10-23) found the true floor of this
# crate graph is 1.89.0, set by bevy and uuid — bnum's 1.87 is not the
# maximum requirement. The declared number stays 1.87 until PER-351 rules on
# the bump; treat it as advisory (issue #525 rider, Director ruling 2), not a
# tested promise: no cargo-msrv (or equivalent) check runs here, so no value
# in this field has been mechanically confirmed as the actual minimum.
rust-version = "1.87"
license = "AGPL-3.0-or-later"   # in-tree = babylon's own license, not the sibling BSD

# PER-350: every workspace crate declares `[lints] workspace = true`, so these
# levels are the single lint authority for the workspace (`docs/agents/rust-style.md`).
# A crate-level `#![forbid(unsafe_code)]` or `#![warn(clippy::pedantic)]` is now
# redundant and must not be reintroduced.
[workspace.lints.rust]
unsafe_code = "forbid"
# `non_exhaustive_omitted_patterns` is deliberately absent: the lint is still
# unstable on the pinned 1.91.1 toolchain (rust-lang/rust#89554), so declaring
# it here emits `unknown_lints` on every crate and fails `-D warnings`. EXC-02
# bans internal `#[non_exhaustive]`, so rustc's E004 non-exhaustive-match error
# and review carry that obligation; no wildcard-arm check exists.

[workspace.lints.clippy]
# Baseline cursor for the CLI-planned lints below; the group stays a warning so
# `-D warnings` in CI promotes it without hiding which lint fired.
pedantic = { level = "warn", priority = -1 }
# Denied outright: each of these has a mechanical rewrite that never changes
# behavior, and leaving one to warning level let it accumulate.
borrowed_box = "deny"
for_kv_map = "deny"
len_without_is_empty = "deny"
new_without_default = "deny"
ptr_arg = "deny"
rc_buffer = "deny"
should_implement_trait = "deny"
wildcard_imports = "deny"
wrong_self_convention = "deny"
# PER-350: a bare `unwrap()` is a finding in every target, tests included.
# `expect("<invariant>")` or a pattern match replaces it; the message states
# why the call cannot fail (`docs/agents/rust-style.md`, implementation table).
unwrap_used = "deny"
