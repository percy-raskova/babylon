[package]
name = "babylon-client"
description = "Durable campaign observer and headless read commands"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "babylon_client"
path = "src/lib.rs"

[[bin]]
name = "babylon-client"
path = "src/main.rs"

[features]
# R1.4 (Director ruling 2026-08-18, "bevy/dynamic_linking — RULED: APPROVED
# WITH FENCE"): opt-in, LOCAL ITERATION ONLY — faster incremental rebuilds
# via libbevy_dylib.so. Enable it with `mise run rust:client-dev-dylib`,
# never a bare `cargo build --features dynamic_linking` in CI/release/pin-ceremony
# context. Must NEVER be a member of `default` (see tools/
# check_dynamic_linking_fence.sh, invariant 3). The fence's compiled half is
# tests/dynamic_linking_fence.rs.
dynamic_linking = ["bevy/dynamic_linking"]

[dependencies]
# Preserve Bevy 0.18's 2d/3d/ui/audio defaults without Bevy's optional texture
# codecs: `3d` expands to `3d_api`, whose `ktx2`/`smaa_luts`/`tonemapping_luts`
# and `zstd_rust` members are what pull a zstd backend into bevy_image. The
# client ships no .ktx2 texture and uses neither SMAA nor a LUT tonemapper (both
# Camera3d spawns declare `Tonemapping` explicitly), so those features stay off
# and bevy_image resolves no zstd/ruzstd crate at all. Bevy 0.20's `2d`
# aggregate no longer carries `ui` or `audio`; both are named here.
bevy = { version = "0.20.0", default-features = false, features = [
    "2d",
    "audio",
    "bevy_anti_alias",
    "bevy_gltf",
    "bevy_light",
    "bevy_mikktspace",
    "bevy_pbr",
    "gltf_animation",
    "morph",
    "morph_animation",
    "ui",
    "webp",
] }
babylon-kernel = { path = "../babylon-kernel" }
# Archive commands use the confined fog-safe reader. The explicit economy
# status command uses the separately provisioned full-observer reader, as does
# the window's full-observer view. Neither receives a writer capability.
babylon-persistence = { path = "../babylon-persistence" }
earcut = "0.4.11"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = "1.24"
# Client logging estate (Director directive 2026-07-28 for location +
# rotation; Director-approved switch 2026-08-11, #503 item 7): the file
# sink rides Bevy's own tracing stack via LogPlugin::custom_layer —
# tracing-subscriber comes through bevy_log's re-export, no direct dep.
# `log` stays: LogPlugin installs LogTracer, bridging this crate's
# log:: call sites into tracing.
log = "0.4"

[dev-dependencies]
# Construct decoder-completion sinks without a native audio device. rodio
# tracks bevy_audio: Bevy 0.20 decodes through rodio 0.22, and `AudioSink`
# only accepts a `Player` from that same crate version.
rodio = { version = "0.22", default-features = false, features = ["playback"] }
babylon-tick = { path = "../babylon-tick" }
babylon-graph = { path = "../babylon-graph" }
babylon-bsl = { path = "../babylon-bsl" }
# PER-23 Slice 3 live proof: the dossier CLI test clones the disposable
# runtime template, commits real ticks, installs the Archive + reader-role
# schemas, and drives the built binary against a confined login — the same
# harness shape as babylon-persistence's reader_role_live, self-contained
# per crate.
babylon-practice-contract = { path = "../babylon-practice-contract" }
postgres = { version = "=0.19.14", features = ["with-uuid-1"] }
