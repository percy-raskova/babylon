[package]
name = "babylon-ls"
description = "Language Server Protocol front end for .bsl/.bscn (issue #652, wave 1) — non-normative, observes-only; the load path stays the only door"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
# 0.10 is the crate's own crates.io-published version (rust-analyzer's
# lib/lsp-server); `Connection::initialize_start` is what gives us the
# `-32002`-before-`initialize` handshake for free (plan §3).
lsp-server = "0.10"
# Pinned below 0.96: 0.96 replaced the `url::Url` re-export this crate's
# `Url`-keyed document store (task-5-brief.md §5.3) is written against with
# a `fluent-uri`-backed `Uri` newtype — a real breaking API change, not a
# patch bump. `url`/`percent-encoding` land transitively (plan §3's
# dependency-delta table).
lsp-types = "0.95"
serde_json = "1"

[lib]
name = "babylon_ls"
path = "src/lib.rs"

[[bin]]
name = "bsl-ls"
path = "src/main.rs"
