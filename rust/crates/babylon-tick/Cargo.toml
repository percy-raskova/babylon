[package]
name = "babylon-tick"
description = "P27 Phase 2 Slice 1 driver: run one rule over one scenario and print the state hash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
babylon-bsl = { path = "../babylon-bsl" }
babylon-graph = { path = "../babylon-graph" }
# The `rng-draw` seam's `SessionId` (Task 4, #576 intrinsic-host train,
# plan §3.5): `TickSession::new` and `run_once`/`run_once_into` construct
# one. Promoted from dev-only to a real dependency — it was already
# transitive via babylon-bsl, this makes production code's own use direct.
babylon-kernel = { path = "../babylon-kernel" }

[lib]
name = "babylon_tick"
path = "src/lib.rs"

[[bin]]
name = "babylon-tick"
path = "src/main.rs"
