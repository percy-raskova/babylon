[package]
name = "babylon-tick"
description = "P27 Phase 2 Slice 1 driver: run one rule over one scenario and print the state hash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
babylon-bsl = { path = "../babylon-bsl" }
babylon-graph = { path = "../babylon-graph" }
# TickSession's deterministic V1 execution namespace and ReplayTickSession's
# governed V2 replay identity are direct production dependencies. Finite
# choices are legal only through the latter; BSL has no author-visible draw.
babylon-kernel = { path = "../babylon-kernel" }
babylon-practice-contract = { path = "../babylon-practice-contract" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "babylon_tick"
path = "src/lib.rs"

[[bin]]
name = "babylon-tick"
path = "src/main.rs"

# Task W3 (BSL Hygiene Knock-out): the fuel-bound report mode. A separate
# binary target, not a `babylon-tick` subcommand — `main.rs`'s own doc
# scopes that binary to "argument parsing, calling [run_once], and
# printing" for exactly one rule/scenario pair; this report iterates the
# whole landed corpus and never runs a tick, a different enough shape to
# earn its own entry point rather than widen that one's contract.
[[bin]]
name = "bsl-fuel-report"
path = "src/bin/bsl_fuel_report.rs"
