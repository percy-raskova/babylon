[package]
name = "babylon-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# In-tree engine crate — never published to crates.io (cargo-deny wildcard
# exemption for path deps applies only to unpublishable crates).
publish = false

[features]
# The 3D lane's foundation (BD-3/BD-10): rev-pinned git-dep, never `branch =`
# — rev bumps are explicit, reviewable in-tree commits. The pinned rev is the
# clean Phase R + Phase I state (raster/cells3d goldens frozen); the remote
# was created by the ADR150 owner ceremony 2026-07-27 (public repo — cargo
# fetches anonymously, so no deploy key is needed; see ADR150).
# Task 35 (contract §7 + §5.3): the pixel tier rides the SAME feature —
# ratatui-image's StatefulProtocol::new construction path (zero terminal
# queries; Picker::from_query_stdio* is sentinel-banned) over the git-dep's
# raster-png `render_pixels`. `image` default-features off: only the
# in-memory RgbImage/DynamicImage types are needed, no codecs.
raster = ["dep:hypergraph-rs", "dep:ratatui-image", "dep:image"]

[dependencies]
# default-features off: highlight-code pulls syntect/onig (a native C
# build) and M1 renders fences as styled fences with pre-resolved payloads —
# no highlighting needed; keeps the client C-toolchain-free (AA disclosure:
# also removes the classic MSVC cross-compile failure point).
babylon-md = { path = "../babylon-md", default-features = false }
# Client logging estate (Director directive 2026-07-28): log4rs is the Rust
# log4j — programmatic config, size-triggered rolling, fixed-window archive
# caps. default-features off keeps the graph to exactly the pieces the
# file-only sink uses (a console appender is the PR #318 frame-corruption
# class; gzip would pull flate2 for nothing). Pure Rust — the client stays
# C-toolchain-free (AA disclosure).
log = "0.4"
log4rs = { version = "1", default-features = false, features = [
    "rolling_file_appender",
    "compound_policy",
    "size_trigger",
    "fixed_window_roller",
    "pattern_encoder",
] }
pulldown-cmark = "0.13"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
# preserve_order: peek plates must walk view-model fields in Python
# declaration order (model_dump_json insertion order) — alphabetical maps
# would TRUNCATE to a different field subset at capped depths.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
unicode-width = "0.2"
hypergraph-rs = { git = "https://github.com/percy-raskova/hypergraph-rs.git", rev = "0c95db0663737b492af27f85e70b223833a18c2e", default-features = false, features = ["cells3d", "raster-png"], optional = true }
# default-features off: the default set pulls chafa-dyn — a NATIVE C
# library via pkg-config — for its chafa halfblock backend; this client is
# C-toolchain-free (the babylon-md syntect precedent + AA disclosure) and
# only uses the pure-Rust kitty StatefulProtocol path. `crossterm` matches
# ratatui's own backend here; image codecs come from our `image` dep pin.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"], optional = true }
image = { version = "0.25", default-features = false, optional = true }

[dev-dependencies]
insta = { version = "1", features = ["filters"] }
