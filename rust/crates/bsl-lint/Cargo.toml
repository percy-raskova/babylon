[package]
name = "bsl-lint"
description = "Repo-relationship sentinels for BSL identity, namespaces, and T3 non-authorability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bsl-lint"
path = "src/main.rs"

[dependencies]
babylon-bsl = { path = "../babylon-bsl" }
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
toml = "1"

[dependencies.regex]
version = "1"
