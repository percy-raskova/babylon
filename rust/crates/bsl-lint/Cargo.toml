[package]
name = "bsl-lint"
description = "Repo-relationship and Rust AST-style sentinels for BSL content"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "bsl-lint"
path = "src/main.rs"

[dependencies]
babylon-bsl = { path = "../babylon-bsl" }
babylon-kernel = { path = "../babylon-kernel" }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", features = ["full", "visit"] }
toml = "1"

[dependencies.regex]
version = "1"
