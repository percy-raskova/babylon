# Babylon interface SFX suite — the moddable source of truth.
#
# Rendered by generate_sfx.py into <family>/<name>.mid (General MIDI, type 0).
# License: CC0-1.0 (src/assets/LICENSE) — public domain, reuse freely.
#
# Row formats (times in beats at the sound's bpm):
#   notes = [channel, gm_program, pitch, start, duration, velocity]
#   bends = [channel, start, value]   # pitch wheel, -8192..8191 over a ±12-semitone
#                                     # range (the renderer declares RPN 0/0 per
#                                     # bending channel); no interpolation — write
#                                     # multiple points for sweeps
#   ccs   = [channel, controller, start, value]
# Channel 9 is GM percussion (program column ignored; pitch = drum map).
# Sonic identity (ai/epochs/epoch3/music-system.yaml): root E; Phrygian flat-2 = dread;
# tritone E-Bb = crisis; minor->major resolution reserved for revolutionary outcomes;
# CC93 chorus = solidarity, CC94 detune = atomization (semantic record — audible
# devices always back it, since not every synth renders CC94), CC71 resonance =
# repression.
# Loudness doctrine: channel volume/expression render at maximum (see generate_sfx.py
# DEFAULT_CCS); dynamics live entirely in velocity, and the floor is kept HOT — the
# quietest sound in the suite is a deliberate whisper, not an accident of headroom.

schema_version = 1

