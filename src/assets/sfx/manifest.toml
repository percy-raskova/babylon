# ============================================================================
# FAMILY resistance — human timbre against machine drone (#641). Struck,
# breathed, voiced: brass, taiko, choir, claps. Escalation is architecture,
# not loudness: the organizing tier is two voices finding a grid; open
# struggle is the full percussion floor. Solidarity is HARMONY — never
# unison (unison is the fascist mob). The crowd is more in tune than the
# beast and less in time: that contrast is the whole point. Intercepts are
# drama, not errors: gesture begins, is interrupted, and the tail resolves
# TOWARD the remedy.
# ============================================================================

